<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-watch · 세션</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  /* ── 다크 테마 ── */
  :root { --bg:#15151a; --card:#1e1e24; --line:#2c2c35; --muted:#8b8b96; --ink:#e7e7ec; --accent:#ff5fa8;
    --code-bg:#16161b; --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    /* 대화 폰트: 라틴=JetBrains Mono, 한글=Pretendard 폴백 */
    --chat:'JetBrains Mono', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.7 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(21,21,26,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 20px; }
  .topline { display:flex; gap:10px; align-items:center; }
  header h1 { font-size:15px; margin:0; font-weight:600; font-family:var(--mono); } /* 로고: JetBrains Mono 토큰 */
  .usagebar { margin-left:auto; font-size:12px; color:var(--muted); font-family:var(--mono); white-space:nowrap; }
  .usagebar b { color:var(--ink); font-weight:700; }
  .usagebar .cost { color:#ffb454; font-weight:700; }
  .usagebar .acct { color:#71717c; } .usagebar .acct b { color:#a9a9b4; }
  .hbtn { margin-left:12px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px; font-family:var(--mono); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
  .hbtn svg { width:14px; height:14px; display:block; flex:none; } /* Figma listIcon/exportIcon */
  .hbtn:hover { border-color:var(--accent); color:var(--accent); }
  .hbtn:disabled { opacity:.5; cursor:wait; }
  .topline > .hbtn:first-child { margin-left:0; } /* 맨 왼쪽 List 버튼은 여백 제거 */
  /* 버전 라벨 (Figma 디자인 반영): latest일 때만 "/latest"를 네온그린으로 */
  .ver { font-size:11px; color:var(--muted); font-family:var(--mono); }
  .ver .latest { color:#5af78e; } /* neon/green */
  .topdiv { color:var(--muted); font-family:var(--mono); }
  .sessname { font-size:12px; color:#f4f89d; font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; max-width:520px; } /* neon/yellow */
  .status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-left:14px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#555; }
  .dot.live { background:#2bbf6a; box-shadow:0 0 0 3px rgba(43,191,106,.18); }
  .tabs { display:flex; gap:4px; margin-top:10px; }
  .tabs button { border:none; background:transparent; padding:8px 14px; font-size:13.5px; cursor:pointer;
    color:var(--muted); border-radius:8px 8px 0 0; font-weight:600; }
  .tabs button.on { color:var(--accent); background:var(--card); border:1px solid var(--line); border-bottom:1px solid var(--card); margin-bottom:-1px; }
  main { max-width:880px; margin:0 auto; padding:24px 20px 120px; }
  .ev { margin:16px 0; font-family:var(--chat); }

  /* 역할 헤더 (F) */
  .msghead { display:flex; align-items:center; gap:8px; margin:0 2px 5px; font-size:12px; }
  .msghead .who { font-weight:800; font-size:16px; display:inline-flex; align-items:center; gap:6px; }
  .cicon { width:1.35em; height:1.35em; flex:none; }
  .msghead .ts { color:var(--muted); font-family:var(--mono); font-size:11px; }
  .user_text .who { color:#6fa8ff; }
  .assistant_text .who { color:var(--accent); }

  .bubble { position:relative; padding:12px 16px; border-radius:14px; word-break:break-word; max-width:80%; }
  /* 사람=우측 정렬 · Claude=좌측(기본), 두 버블 모두 카드형으로 통일 */
  .ev.user_text { display:flex; flex-direction:column; align-items:flex-end; }
  .ev.user_text .bubble, .ev.user_text > details { max-width:80%; }
  /* Claude도 flex → 내용 길이에 맞춰 가로폭 조절(항상 넓게 퍼지지 않도록) */
  .ev.assistant_text { display:flex; flex-direction:column; align-items:flex-start; }
  .user_text .bubble { background:#1d2740; border:1px solid #2c3a5c; white-space:pre-wrap; text-align:left; border-top-right-radius:0; }
  .user_text .attach { font-size:12px; color:var(--muted); margin-top:5px; font-family:var(--mono); }
  /* 사용자 입력: 기본 10줄까지 표시, 넘으면 '펼치기' */
  .uctext.uclamp { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:10; overflow:hidden; }
  .uctext.uclamp.open { display:block; -webkit-line-clamp:unset; overflow:visible; }
  .uc-toggle { align-self:flex-end; margin-top:4px; background:none; border:none; color:var(--accent);
    font:12px var(--mono); cursor:pointer; padding:2px 4px; }
  .uc-toggle:hover { text-decoration:underline; }
  .assistant_text .bubble { background:var(--card); border:1px solid var(--line); border-top-left-radius:0; }
  /* 말풍선 꼬리: 2겹 border-삼각형(뒤=테두리색, 앞=채움색) → 버블 border와 자연 연결 */
  /* Claude(좌상단): ::before=테두리, ::after=채움 */
  .assistant_text .bubble::before {
    content:""; position:absolute; left:-11px; top:-1px; width:0; height:0;
    border:12px solid transparent; border-right-color:var(--line); border-top:0; border-left:0; }
  .assistant_text .bubble::after {
    content:""; position:absolute; left:-9px; top:0; width:0; height:0;
    border:11px solid transparent; border-right-color:var(--card); border-top:0; border-left:0; }
  /* 사용자(우상단) */
  .user_text .bubble::before {
    content:""; position:absolute; right:-11px; top:-1px; width:0; height:0;
    border:12px solid transparent; border-left-color:#2c3a5c; border-top:0; border-right:0; }
  .user_text .bubble::after {
    content:""; position:absolute; right:-9px; top:0; width:0; height:0;
    border:11px solid transparent; border-left-color:#1d2740; border-top:0; border-right:0; }
  .role { font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  details.think summary { cursor:pointer; color:var(--muted); font-size:13px; list-style:none; }
  details.think .body { white-space:pre-wrap; color:#9a9aa4; font-size:13px; background:#22222a;
    border-left:3px solid #3a3a44; padding:10px 12px; border-radius:6px; margin-top:6px; font-family:var(--mono); }

  /* 마크다운 (H) */
  .md :first-child { margin-top:0; } .md :last-child { margin-bottom:0; }
  .md p { margin:.5em 0; } .md ul, .md ol { margin:.5em 0; padding-left:1.4em; }
  .md li { margin:2px 0; }
  .md h1,.md h2,.md h3,.md h4 { font-size:1.05em; margin:.8em 0 .3em; font-weight:700; }
  .md a { color:var(--accent); }
  .md blockquote { margin:.5em 0; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); }
  .md table { border-collapse:collapse; margin:.5em 0; font-size:.95em; }
  .md th, .md td { border:1px solid var(--line); padding:4px 8px; }
  .md code { font-family:var(--mono); font-size:.92em; background:#2a2733; padding:1px 5px; border-radius:4px; color:#CE9178; }
  .md pre { background:var(--code-bg); padding:12px 14px; border-radius:8px; overflow:auto; margin:.6em 0; }
  .md pre code { background:transparent; padding:0; font-size:12.5px; }
  /* 마크다운 펜스 코드블록: 네온 시안으로 균일 처리(토큰 색 덮어쓰기 방지) */
  .md pre code, .md pre code.hljs, .md pre code * { color:#9AEDFE; }

  .tool { background:#191920; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:10px 0; } /* 말풍선(--card)보다 살짝 어둡게 */
  .tool .head { display:flex; align-items:center; gap:8px; padding:10px 14px; font-size:13px; }
  .tool .head .name { font-weight:600; }
  .tool .head .path { color:var(--muted); font-family:var(--mono); font-size:12px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool .head .ts { color:var(--muted); font-family:var(--mono); font-size:11px; margin-left:auto; }
  .tool .head .badge { margin-left:8px; }
  .tool.err { border-color:#5c2e2e; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; background:#18331f; color:#5fcf86; }
  .badge.err { background:#3a1e1e; color:#ef7d7d; }
  pre.code { margin:0; padding:12px 14px; background:var(--code-bg); color:#e6e6e6; overflow:auto;
    font:12.5px/1.55 var(--mono); }
  pre.code code, pre.code code.hljs { background:transparent; padding:0; }
  .desc { padding:6px 14px 10px; color:var(--muted); font-size:12.5px; }
  .diff { font:12.5px/1.55 var(--mono); }
  .diff .l { padding:1px 14px; white-space:pre-wrap; word-break:break-word; }
  .diff .del { background:rgba(229,83,75,.14); color:#f0a39a; }
  .diff .add { background:rgba(63,185,108,.14); color:#8fe0ab; }
  details.result { border-top:1px dashed var(--line); }
  details.result summary { cursor:pointer; padding:8px 14px; font-size:12px; color:var(--muted); list-style:none; }
  details.result pre { margin:0; padding:0 14px 12px; max-height:320px; overflow:auto;
    white-space:pre-wrap; font:12px/1.5 var(--mono); color:#9a9aa4; }
  summary::-webkit-details-marker { display:none; }

  /* 접기형 도구 카드: 한 줄 미리보기 + 클릭 펼침 */
  details.tool > summary.head { cursor:pointer; list-style:none; }
  .tool .head .pv { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--muted); font-family:var(--mono); font-size:12px; }
  .tool .head .caret { color:var(--ink); opacity:.75; font-size:15px; line-height:1; transition:transform .15s; margin-left:8px; }
  details.tool[open] > summary.head .caret { transform:rotate(90deg); }
  /* result·대안 요약에도 회전 caret 프리픽스(일관성·가독성) */
  details.result > summary::before,
  details.dalts > summary::before {
    content:"▸"; display:inline-block; font-size:15px; line-height:1; margin-right:7px;
    opacity:.7; transition:transform .15s; }
  details.result[open] > summary::before,
  details.dalts[open] > summary::before { transform:rotate(90deg); }
  .tool .tbody { border-top:1px solid var(--line); }
  /* AskUserQuestion 가독형 (도구 그룹과 동일한 어두운 톤) */
  .tool.ask { background:#131317; border-color:rgba(255,255,255,.05); }
  .tool.ask .aq { padding:10px 14px; border-top:1px dashed var(--line); }
  .tool.ask .aq:first-child { border-top:none; }
  .tool.ask .aqt { font-weight:600; font-size:13px; margin-bottom:7px; }
  .tool.ask .aqt .dtag { display:inline-block; font-size:10px; font-weight:700; color:var(--accent);
    background:#2c1a26; padding:1px 7px; border-radius:10px; margin-right:7px; vertical-align:middle; }
  .tool.ask .aopt { padding:6px 10px; margin:4px 0; border-radius:8px; border:1px solid var(--line); font-size:12.5px; }
  .tool.ask .aopt.picked { border-color:#5fcf86; background:rgba(95,207,134,.10); }
  .tool.ask .aopt.picked b { color:#8fe0ab; }
  .tool.ask .aans { margin:7px 0 2px; padding:7px 10px; border-radius:8px; font-size:12.5px;
    background:rgba(95,207,134,.10); border:1px solid #5fcf86; }
  .tool.ask .aans .k { font-weight:700; color:#8fe0ab; margin-right:6px; }
  .tool.ask .aans.muted { background:transparent; border:1px dashed var(--line); color:var(--muted); }
  .tool.ask .aans.muted .k { color:var(--muted); }
  /* 시스템/하네스 주입 메시지: 토글 없이 한 줄 회색 노트 */
  .ev.system_note { margin:3px 0; }
  .sysnote { display:flex; align-items:center; gap:8px; padding:3px 4px; }
  .sysnote .sys-label { flex:none; color:#ef5350; font-weight:800; font-family:var(--mono);
    letter-spacing:.5px; font-size:11px; }
  .sysnote .systext { min-width:0; color:var(--muted); font-family:var(--mono); font-size:11px;
    opacity:.7; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool.ask .adesc { color:var(--muted); font-size:12px; margin-top:3px; font-weight:400; }

  /* 도구 그룹(A+C): 연속 도구 호출을 한 컨테이너로 묶고 레일 타임라인으로 표시 */
  /* 말풍선(--card)보다 어둡고 낮은 채도 → 대화보다 한 단계 아래로 */
  details.toolgroup { background:#131317; border:1px solid rgba(255,255,255,.05); border-radius:12px; margin:10px 0; overflow:hidden; }
  details.toolgroup > summary.tg-head { display:flex; align-items:center; gap:8px; padding:9px 14px;
    font:12px var(--mono); color:var(--muted); cursor:pointer; list-style:none; background:rgba(0,0,0,.18); }
  .tg-head .tg-cnt { color:var(--ink); font-weight:700; }
  .tg-head .tg-ok { color:#5fcf86; } .tg-head .tg-err { color:#ef7d7d; }
  .tg-head .tg-icons { margin-left:6px; opacity:.7; font-size:11px; letter-spacing:1px; }
  .tg-head .tg-caret { margin-left:auto; color:var(--ink); opacity:.6; font-size:14px; transition:transform .15s; }
  details.toolgroup[open] > summary.tg-head .tg-caret { transform:rotate(90deg); }
  details.toolgroup[open] > summary.tg-head { border-bottom:1px solid rgba(255,255,255,.05); }
  /* 레일: 세로선이 노드 중심(x=18)을 관통 */
  .ac-rail { position:relative; padding:6px 12px 8px 30px; }
  .ac-rail::before { content:""; position:absolute; left:17px; top:12px; bottom:12px; width:2px; background:var(--line); }
  .ac-row { position:relative; display:flex; align-items:center; gap:10px; padding:6px 8px;
    border-radius:8px; cursor:pointer; list-style:none; }
  .ac-row.norow { cursor:default; }
  .ac-row:hover { background:rgba(255,255,255,.04); }
  .ac-row::before { content:""; position:absolute; left:-17px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%; background:var(--bg); border:2px solid #5fcf86; }
  .ac-item.err > .ac-row::before { border-color:#ef7d7d; }
  .ac-ic { font-size:13px; width:16px; text-align:center; flex:none; }
  .ac-nm { font:600 12.5px var(--mono); flex:none; min-width:74px; }
  .ac-pv { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--muted); font:12px var(--mono); }
  .ac-row .ts { flex:none; font-family:var(--mono); font-size:11px; color:var(--muted); }
  .ac-chk { color:#5fcf86; font:700 14px/1 var(--mono); flex:none; }
  .ac-x { color:#ef7d7d; font:700 14px/1 var(--mono); flex:none; }
  .ac-detail { padding:2px 10px 10px; }
  /* 상세는 전체 펼침(토글 없음), 길면 스크롤 대신 클립(overflow:hidden) */
  .ac-detail pre.code, .ac-detail .diff, .ac-result { max-height:300px; overflow:hidden; }
  .ac-result { margin:6px 0 0; padding:8px 12px; background:var(--code-bg); border:1px solid var(--line);
    border-radius:8px; font:11.5px/1.5 var(--mono); color:#9a9aa4; white-space:pre-wrap; word-break:break-word; }
  .ac-result.err { color:#f0a39a; border-color:#5c2e2e; }

  /* 요약 탭 */
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; text-align:center; }
  .stat .n { font-size:22px; font-weight:700; }
  .stat .k { font-size:12px; color:var(--muted); }
  h3.sec { font-size:14px; margin:22px 0 8px; }
  ol.prompts { padding-left:20px; } ol.prompts li { margin:4px 0; }
  ul.files { list-style:none; padding:0; font-family:var(--mono); font-size:12.5px; }
  ul.files li { padding:3px 0; } ul.files .tag { font-size:10px; padding:1px 6px; border-radius:8px; margin-right:6px; }
  .tag.new { background:#1f3a2a; color:#8fe0ab; } .tag.mod { background:#1f2f4a; color:#9cc0ef; }

  /* 세션 요약 v1: 의사결정·산출물·핫스팟 */
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:640px){ .cols { grid-template-columns:1fr; } }
  .decision { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:10px; padding:10px 14px; margin:8px 0; }
  .decision .dq { font-weight:600; font-size:13.5px; margin-bottom:5px; }
  .decision .dtag { font-size:10px; font-weight:700; color:var(--accent); background:#2c1a26;
    padding:1px 7px; border-radius:10px; margin-right:6px; vertical-align:middle; }
  .decision .dchosen { color:#8fe0ab; font-size:13px; }
  .decision details.dalts { margin-top:7px; }
  .decision details.dalts summary { cursor:pointer; color:var(--muted); font-size:12px; list-style:none; }
  .decision .dalt { font-size:12px; color:var(--muted); padding:3px 0 3px 12px; border-left:2px solid var(--line); margin-top:5px; }
  .decision .dalt b { color:var(--ink); }
  /* 섹션 접기/펼치기 래퍼 */
  details.fold { margin:22px 0 0; }
  details.fold > summary { cursor:pointer; list-style:none; font-size:14px; font-weight:700; margin:0; display:flex; align-items:center; gap:7px; padding:4px 0; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::before { content:"▸"; color:var(--muted); font-size:12px; transition:transform .15s; }
  details.fold[open] > summary::before { transform:rotate(90deg); }
  details.fold > summary:hover { color:var(--accent); }
  .foldbody { margin-top:10px; }

  .topsum { background:var(--card); border:1px solid var(--line); border-left:3px solid #ffb454; border-radius:12px; padding:14px 16px; margin:6px 0 18px; }
  .topsum-h { font-weight:700; font-size:14px; margin-bottom:8px; }
  .topsum-body { font-size:13.5px; line-height:1.85; }
  .topsum-body b { color:#ffd9a3; font-weight:700; }

  .aibox { margin:14px 0; }
  .aibtn { background:var(--accent); color:#1a0f15; border:none; padding:9px 16px; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; }
  .aibtn:disabled { opacity:.5; cursor:wait; }
  .aiout { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .mermaid { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; overflow:auto; }
  .hint { color:var(--muted); font-size:12.5px; margin:6px 0 14px; }
  .usage { margin-top:8px; font-size:12px; color:var(--muted); font-family:var(--mono); }
  .usage b { color:var(--ink); font-weight:600; }

  /* 긴 블록 접기 */
  .clamp { max-height:340px; overflow:hidden; }
  .clamp.mini { max-height:66px; }            /* 파일 수정 diff 기본 3줄만 */
  .clamp.open { max-height:none; overflow:auto; }
  .clamp-toggle { display:block; width:100%; border:none; background:#26242c; color:var(--accent);
    font-size:12px; font-weight:600; padding:6px; cursor:pointer; }
  .clamp-toggle:hover { background:#2e2c36; }

  /* FAB */
  .fab { position:fixed; right:20px; bottom:24px; display:flex; flex-direction:column; gap:8px; z-index:20; }
  .fab button { width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer; font-size:18px; color:var(--ink); line-height:1; }
  .fab button:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="topline">
    <a href="/" id="listLink" class="hbtn" title="전체 세션 목록으로"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 8.66667H3.33333V7.33333H2V8.66667ZM2 11.3333H3.33333V10H2V11.3333ZM2 6H3.33333V4.66667H2V6ZM4.66667 8.66667H14V7.33333H4.66667V8.66667ZM4.66667 11.3333H14V10H4.66667V11.3333ZM4.66667 4.66667V6H14V4.66667H4.66667Z" fill="currentColor"/></svg>List</a>
    <h1>🦞 claude-watch</h1>
    <span class="ver" id="ver"></span>
    <span class="topdiv" id="topDiv" hidden>|</span>
    <span class="sessname" id="sessName"></span>
    <div class="usagebar" id="usagebar" title="이 세션 누적 토큰 · API 환산 추정 비용 (구독제면 실제 청구액 아님)">집계 중…</div>
    <div class="status"><span id="dot" class="dot"></span><span id="stat">연결 중…</span></div>
    <button id="exportBtn" class="hbtn" title="이 세션을 자체완결 HTML 파일로 내보내기"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M11.3 3.97867L10.3573 4.92133L8.66667 3.23067V11.3613H7.33333V3.23133L5.64333 4.92133L4.7 3.97867L8 0.678667L11.3 3.97867Z" fill="currentColor"/><path d="M3.33333 13.988V7.32133H6V5.988H2V15.3213H14V5.988H10V7.32133H12.6667V13.988H3.33333Z" fill="currentColor"/></svg><span class="lbl">Export</span></button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="view"></main>
<div class="fab">
  <button id="fabTop" title="처음으로">⤒</button>
  <button id="fabBottom" title="가장 최근 대화로">⤓</button>
</div>

<script>
const SESSION = "__SESSION_ID__";
// export(도시락) 모드: <script type=application/json>에서 데이터를 읽음(SSE 없음)
const EXPORT = (() => {
  const el = document.getElementById("cw-export-data");
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { console.error("export data parse 실패", e); return null; }
})();
let EVENTS = EXPORT ? EXPORT.events : [];
let TAB = "raw";
const view = document.getElementById("view");
const dot = document.getElementById("dot");
const stat = document.getElementById("stat");
const usagebar = document.getElementById("usagebar");
let mermaidSeq = 0;

// 버전 라벨 (Figma 디자인 반영): latest일 때만 "/latest"를 네온그린으로 표기
// ※ 실제 최신 여부 판정(레지스트리/서버 조회)은 후속 — 우선 표시 구조만
const CW_VERSION = "1.00";
const CW_IS_LATEST = true;
(function renderVersion() {
  const el = document.getElementById("ver");
  if (!el) return;
  el.innerHTML = `${CW_VERSION}v` + (CW_IS_LATEST ? `<span class="latest">/latest</span>` : "");
})();

// 세션 이름(제목): 첫 사용자 요청 한 줄 (Figma sessionName 슬롯). 값 있을 때만 divider 표시
function renderSessionName() {
  const el = document.getElementById("sessName"), dv = document.getElementById("topDiv");
  if (!el) return;
  const u = EVENTS.find(e => e.kind === "user_text" && e.text && !e.text.startsWith("[") && e.text.length < 2000);
  const name = u ? u.text.split("\n")[0].slice(0, 60).trim() : "";
  el.textContent = name;
  if (dv) dv.hidden = !name;
}

const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clampWrap = (inner, cls = "") => `<div class="clamp ${cls}">${inner}</div>`;
const fileName = (p) => String(p || "").split("/").slice(-2).join("/");
const base = (p) => String(p || "").split("/").pop();
const topDir = (p) => { const parts = String(p||"").split("/").filter(Boolean); const i = parts.findIndex(x=>x==="src"||x==="lib"||x==="backend"||x==="public"||x==="app"); return i>=0 ? parts[i] : (parts.length>1?parts[parts.length-2]:"root"); };

// 토큰 수 축약 (123456 → 123.5k, 4530000 → 4.5M)
const fmtTok = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);

// ── 타임스탬프 (F) ───────────────────────────────────────
function fmtTs(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ── 마크다운(H) / 코드(G) ────────────────────────────────
function md(t) {
  try { return window.marked ? marked.parse(String(t || ""), { breaks: true }) : esc(t); }
  catch { return esc(t); }
}
const EXT2LANG = { js:"javascript", mjs:"javascript", cjs:"javascript", jsx:"javascript", ts:"typescript", tsx:"typescript",
  java:"java", py:"python", rb:"ruby", go:"go", rs:"rust", sh:"bash", bash:"bash", zsh:"bash", json:"json",
  css:"css", scss:"scss", html:"xml", xml:"xml", md:"markdown", yml:"yaml", yaml:"yaml", sql:"sql",
  kt:"kotlin", swift:"swift", c:"c", h:"c", cpp:"cpp", cc:"cpp", php:"php", vue:"xml" };
const langFromPath = (p) => EXT2LANG[String(p||"").split(".").pop().toLowerCase()] || "";
const codeBlock = (code, lang) => `<pre class="code"><code class="${lang ? "language-"+lang : ""}">${esc(code)}</code></pre>`;
function highlightCode() {
  if (!window.hljs) return;
  view.querySelectorAll("pre code:not([data-hl])").forEach((el) => {
    el.setAttribute("data-hl", "1");
    try { hljs.highlightElement(el); } catch {}
  });
}

// ── 탭 정의 ──────────────────────────────────────────────
const TABS = [
  { id: "raw",     label: "Raw", render: renderRaw },
  { id: "summary", label: "Summary", render: renderSummary },
  { id: "diagram", label: "Architecture", render: renderDiagram },
  { id: "diff",    label: "Changes", render: renderDiff },
];
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button class="${t.id===TAB?'on':''}" data-tab="${t.id}">${t.label}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.onclick = () => { TAB = b.dataset.tab; renderTabs(); draw(); });
}
function draw() { TABS.find(t => t.id === TAB).render(); highlightCode(); applyClamps(); applyUserClamps(); }
// 사용자 입력 버블: 10줄 초과 시 '펼치기' 버튼 부착
function applyUserClamps() {
  view.querySelectorAll(".uctext.uclamp:not([data-uc])").forEach((el) => {
    el.setAttribute("data-uc", "1");
    if (el.scrollHeight <= el.clientHeight + 2) { el.classList.remove("uclamp"); return; }
    const bubble = el.closest(".bubble") || el;
    const btn = document.createElement("button");
    btn.className = "uc-toggle"; btn.textContent = "⌄ 펼치기";
    btn.onclick = () => {
      const open = el.classList.toggle("open");
      btn.textContent = open ? "⌃ 접기" : "⌄ 펼치기";
      if (!open) bubble.scrollIntoView({ block: "nearest" });
    };
    bubble.after(btn);
  });
}

function applyClamps() {
  view.querySelectorAll(".clamp:not([data-clamp])").forEach((el) => {
    el.setAttribute("data-clamp", "1");
    if (el.scrollHeight <= el.clientHeight + 4) { el.classList.remove("clamp"); return; }
    const btn = document.createElement("button");
    btn.className = "clamp-toggle"; btn.textContent = "⌄ 더 보기";
    btn.onclick = () => {
      const open = el.classList.toggle("open");
      btn.textContent = open ? "⌃ 접기" : "⌄ 더 보기";
      if (!open) el.scrollIntoView({ block: "nearest" });
    };
    el.after(btn);
  });
}

// ── 탭1: Raw 대화 ────────────────────────────────────────
function renderRaw() {
  const frag = document.createDocumentFragment();
  let i = 0;
  while (i < EVENTS.length) {
    const e = EVENTS[i];
    // 연속된 도구 호출(AskUserQuestion 제외)을 하나의 그룹으로 묶음
    if (e.kind === "tool_use" && e.name !== "AskUserQuestion") {
      const group = [];
      while (i < EVENTS.length && EVENTS[i].kind === "tool_use" && EVENTS[i].name !== "AskUserQuestion") {
        group.push(EVENTS[i]); i++;
      }
      frag.appendChild(renderToolGroup(group));
    } else {
      frag.appendChild(renderEvent(e));
      i++;
    }
  }
  view.replaceChildren(frag);
}
// 도구별 한 줄 요약 정보(아이콘·이름·미리보기)
function toolInfo(e) {
  const i = e.input || {};
  switch (e.name) {
    case "Bash":  return { icon: "⚡", name: "Bash",  pv: oneLine("$ " + (i.command || "")) };
    case "Edit":  return { icon: "📝", name: "Edit",  pv: fileName(i.file_path) };
    case "Write": return { icon: "📄", name: "Write", pv: fileName(i.file_path) };
    case "Read":  return { icon: "📖", name: "Read",  pv: fileName(i.file_path) };
    default:      return { icon: "🔧", name: e.name,  pv: oneLine(JSON.stringify(i)) };
  }
}
// 결과를 토글 없이 바로 표시(전체 펼침). 길면 CSS로 클립(overflow:hidden).
function resultInline(e) {
  if (e.result == null || e.result === "") return "";
  return `<pre class="ac-result${e.isError ? " err" : ""}">${esc(e.result)}</pre>`;
}
// 도구별 펼침 상세(명령·diff·내용·JSON + 결과). 없으면 "" → 비확장 행
function toolDetail(e) {
  const i = e.input || {};
  switch (e.name) {
    case "Bash":  return codeBlock("$ " + (i.command || ""), "bash") +
      (i.description ? `<div class="desc">${esc(i.description)}</div>` : "") + resultInline(e);
    case "Edit":  return editDiff(i) + resultInline(e);
    case "Write": return codeBlock(String(i.content || "").slice(0, 4000), langFromPath(i.file_path)) + resultInline(e);
    case "Read":  return resultInline(e); // 보통 결과 없음 → 빈 문자열
    default:      return codeBlock(JSON.stringify(i, null, 2).slice(0, 1500), "json") + resultInline(e);
  }
}
// 연속 도구 호출 → 그룹 컨테이너(기본 접힘) + 레일 타임라인
function renderToolGroup(group) {
  const nErr = group.filter((e) => e.isError).length;
  const status = nErr ? `<span class="tg-err">${nErr} 실패</span>` : `<span class="tg-ok">모두 완료</span>`;
  const rows = group.map((e) => {
    const { icon, name, pv } = toolInfo(e);
    const stat = e.isError ? `<span class="ac-x">✗</span>` : `<span class="ac-chk">✓</span>`;
    const inner = `<span class="ac-ic">${icon}</span><span class="ac-nm">${esc(name)}</span>`+
      `<span class="ac-pv">${esc(pv)}</span>${tsSpan(e)}${stat}`;
    const detail = toolDetail(e);
    return detail
      ? `<details class="ac-item${e.isError ? " err" : ""}"><summary class="ac-row">${inner}</summary><div class="ac-detail">${detail}</div></details>`
      : `<div class="ac-item${e.isError ? " err" : ""}"><div class="ac-row norow">${inner}</div></div>`;
  }).join("");
  const d = document.createElement("details"); // open 없음 = 기본 접힘
  d.className = "toolgroup";
  d.innerHTML = `<summary class="tg-head"><span>🛠</span><span class="tg-cnt">도구 ${group.length}</span>`+
    `<span>·</span>${status}<span class="tg-caret">▸</span></summary>`+
    `<div class="ac-rail">${rows}</div>`;
  return d;
}
// Claude Code 공식 로고(오렌지 [*] 마크) — 🤖 대체
const CLAUDE_ICON = `<svg class="cicon" viewBox="0 0 24 24" aria-hidden="true"><path clip-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" fill="#D97757" fill-rule="evenodd"></path></svg>`;
function head(who, cls, ts) {
  return `<div class="msghead"><span class="who ${cls}">${who}</span><span class="ts">${fmtTs(ts)}</span></div>`;
}
function renderEvent(e) {
  const wrap = document.createElement("div");
  wrap.className = "ev " + e.kind;
  if (e.kind === "user_text") {
    const names = e.imageNames || [];
    const nImg = names.length || e.images || 0;
    const attach = nImg ? `<div class="attach">🖼️ ${names.length ? names.map(esc).join(" · ") : "첨부 이미지 " + nImg + "개"}</div>` : "";
    // 기본 10줄까지 표시, 넘으면 10줄 + '펼치기'(applyUserClamps에서 버튼 부착)
    // 클램프는 안쪽 래퍼(.uctext)에만 → 말풍선 꼬리(::before/::after)가 안 잘림
    const body = e.text ? `<div class="bubble"><div class="uctext uclamp">${esc(e.text)}</div></div>` : "";
    wrap.innerHTML = head("나", "", e.ts) + body + attach;
  } else if (e.kind === "assistant_text") {
    wrap.innerHTML = head(CLAUDE_ICON + "Claude", "", e.ts) + `<div class="bubble md">${clampWrap(md(e.text))}</div>`;
  } else if (e.kind === "thinking") {
    wrap.innerHTML = `<details class="think"><summary>💭 생각 펼치기</summary><div class="body">${esc(e.text)}</div></details>`;
  } else if (e.kind === "image") {
    wrap.innerHTML = `<div class="bubble" style="color:var(--muted)">🖼️ 첨부 이미지</div>`;
  } else if (e.kind === "system_note") {
    const pv = (e.text || "").replace(/\s+/g, " ").trim();
    wrap.innerHTML = `<div class="sysnote"><span class="sys-label">SYSTEM</span><span class="systext" title="${esc(e.text)}">${esc(pv)}</span></div>`;
  } else if (e.kind === "tool_use") {
    wrap.appendChild(renderTool(e));
  }
  return wrap;
}
function badge(e){ if(e.result==null) return ""; return e.isError?`<span class="badge err">실패</span>`:`<span class="badge">완료</span>`; }
function tsSpan(e){ return e.ts?`<span class="ts">${fmtTs(e.ts)}</span>`:""; }
function resultBlock(e){ if(!e.result) return ""; const l=e.isError?"⚠️ 오류 결과 펼치기":"결과 펼치기"; return `<details class="result"><summary>${l}</summary><pre>${esc(e.result)}</pre></details>`; }
function editDiff(i){
  const del = String(i.old_string||"").split("\n").map(l=>`<div class="l del">- ${esc(l)}</div>`).join("");
  const add = String(i.new_string||"").split("\n").map(l=>`<div class="l add">+ ${esc(l)}</div>`).join("");
  return `<div class="diff">${del}${add}</div>`;
}
// 여러 줄 → 한 줄 미리보기(공백 압축, 길이 제한). 넘치면 CSS로 말줄임.
const oneLine = (s, n = 300) => String(s || "").replace(/\s+/g, " ").trim().slice(0, n);
// 접기형 도구 카드: summary에 한 줄 미리보기, 클릭 시 body 펼침
function collapsibleTool(e, icon, name, preview, bodyHTML) {
  const d = document.createElement("details");
  d.className = "tool" + (e.isError ? " err" : "");
  d.innerHTML = `<summary class="head"><span>${icon}</span><span class="name">${esc(name)}</span>`+
    `<span class="pv">${esc(preview)}</span>${tsSpan(e)}${badge(e)}<span class="caret">▸</span></summary>`+
    `<div class="tbody">${bodyHTML}</div>`;
  return d;
}
// AskUserQuestion → 가독형(질문 → 옵션+설명, 선택 표시). 기본 펼침
function renderAsk(e) {
  const i = e.input || {};
  const chosen = parseChosen(e.result);
  const qs = i.questions || [];
  const preview = qs.map(q => q.header || q.question).filter(Boolean).join(" · ");
  const body = qs.map(q => {
    const ch = chosen[q.question];
    const labels = (q.options || []).map(o => o.label);
    const matched = labels.includes(ch);
    const opts = (q.options || []).map(o => {
      const picked = o.label === ch;
      return `<div class="aopt${picked ? " picked" : ""}">${picked ? "✓ " : ""}<b>${esc(o.label)}</b>`+
        (o.description ? `<div class="adesc">${esc(o.description)}</div>` : "") + `</div>`;
    }).join("");
    // 옵션 하이라이트로 안 잡히는 경우(직접 입력/Other) 또는 미응답이면 '내 답변'을 명시
    const ans = matched ? "" : (ch
      ? `<div class="aans">🗨 <span class="k">내 답변</span> ${esc(ch)}</div>`
      : `<div class="aans muted">🗨 <span class="k">내 답변</span> (미응답)</div>`);
    return `<div class="aq"><div class="aqt">${q.header ? `<span class="dtag">${esc(q.header)}</span>` : ""}${esc(q.question)}</div>`+
      opts + ans + `</div>`;
  }).join("");
  const d = document.createElement("details");
  d.className = "tool ask"; d.open = true;
  d.innerHTML = `<summary class="head"><span>🤔</span><span class="name">질문</span>`+
    `<span class="pv">${esc(preview)}</span>${tsSpan(e)}${badge(e)}<span class="caret">▸</span></summary>`+
    `<div class="tbody">${body}</div>`;
  return d;
}
function renderTool(e) {
  const i = e.input || {};
  // 접기형: Bash — 한 줄 명령어 미리보기
  if (e.name === "Bash") {
    return collapsibleTool(e, "⚡", "Bash", oneLine("$ " + (i.command || "")),
      clampWrap(codeBlock("$ " + (i.command || ""), "bash")) +
      (i.description ? `<div class="desc">${esc(i.description)}</div>` : "") + resultBlock(e));
  }
  if (e.name === "AskUserQuestion") return renderAsk(e);
  // 접기형: Edit(파일 수정) — 기본 펼침, diff는 3줄만(더보기), caret로 전체 접기
  if (e.name === "Edit") {
    const d = document.createElement("details");
    d.className = "tool" + (e.isError ? " err" : "");
    d.open = true;
    d.innerHTML = `<summary class="head"><span>📝</span><span class="name">파일 수정</span>`+
      `<span class="path">${esc(fileName(i.file_path))}</span>${tsSpan(e)}${badge(e)}<span class="caret">▸</span></summary>`+
      `<div class="tbody">${clampWrap(editDiff(i), "mini")}${resultBlock(e)}</div>`;
    return d;
  }
  // 접기형: Write(파일 생성) — Edit과 동일(기본 펼침, 내용 3줄+더보기, caret로 접기)
  if (e.name === "Write") {
    const d = document.createElement("details");
    d.className = "tool" + (e.isError ? " err" : "");
    d.open = true;
    d.innerHTML = `<summary class="head"><span>📄</span><span class="name">파일 생성</span>`+
      `<span class="path">${esc(fileName(i.file_path))}</span>${tsSpan(e)}${badge(e)}<span class="caret">▸</span></summary>`+
      `<div class="tbody">${clampWrap(codeBlock(String(i.content||"").slice(0,4000), langFromPath(i.file_path)), "mini")}${resultBlock(e)}</div>`;
    return d;
  }
  // 비접기형: Read (경로만 표시)
  const card = document.createElement("div");
  card.className = "tool" + (e.isError ? " err" : "");
  if (e.name === "Read") {
    card.innerHTML = `<div class="head"><span>📖</span><span class="name">읽기</span><span class="path">${esc(fileName(i.file_path))}</span>${tsSpan(e)}${badge(e)}</div>`;
  } else {
    // 접기형: 기타 도구(ToolSearch·MCP 등) — 한 줄 JSON 미리보기
    return collapsibleTool(e, "🔧", e.name, oneLine(JSON.stringify(i)),
      clampWrap(codeBlock(JSON.stringify(i, null, 2).slice(0, 1500), "json")) + resultBlock(e));
  }
  return card;
}

// ── 변경 파일 집계 ──────────────────────────────────────
function changedFiles() {
  const map = new Map();
  for (const e of EVENTS) {
    if (e.kind !== "tool_use") continue;
    const f = e.input?.file_path; if (!f) continue;
    if (e.name === "Write") map.set(f, { kind: "new", edits: [], content: e.input.content || "" });
    else if (e.name === "Edit") {
      const cur = map.get(f) || { kind: "mod", edits: [] };
      cur.edits.push(e.input);
      map.set(f, cur);
    }
  }
  return map;
}

// ── 탭2: 세션 요약 (v1: 데이터로 자동 정리, 토큰 0) ────────
// 결과문자열 "...\"질문\"=\"선택답\"..." → {질문:선택답} 맵
function parseChosen(resultStr) {
  const map = {}; const re = /"([^"]+)"\s*=\s*"([^"]+)"/g; let m;
  while ((m = re.exec(String(resultStr || "")))) map[m[1]] = m[2];
  return map;
}
// AskUserQuestion → 의사결정 목록 (질문·선택·대안+설명)
function decisions(events) {
  const out = [];
  for (const e of events) {
    if (e.kind !== "tool_use" || e.name !== "AskUserQuestion") continue;
    const chosen = parseChosen(e.result);
    for (const q of (e.input?.questions || [])) {
      const ch = chosen[q.question];
      out.push({
        header: q.header || "", question: q.question || "", chosen: ch || "(미응답)",
        options: (q.options || []).map(o => ({ label: o.label, desc: o.description || "", picked: o.label === ch })),
      });
    }
  }
  return out;
}
// 세션 소요 시간(첫~끝 timestamp)
function sessionDuration(events) {
  const ts = events.map(e => e.ts).filter(Boolean).map(t => new Date(t).getTime()).filter(n => !isNaN(n));
  if (ts.length < 2) return "—";
  let s = (Math.max(...ts) - Math.min(...ts)) / 1000;
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60);
  return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${m}분`;
}
// git commit 명령에서 사람이 읽을 메시지(제목 한 줄) 추출
function commitMsg(cmd) {
  // 단순 -m "msg" / 'msg' (단, $(...) 같은 셸 치환은 제외)
  let m = cmd.match(/-m\s+"([^"$]+)"/) || cmd.match(/-m\s+'([^']+)'/);
  if (m) return m[1].split("\n")[0].trim();
  // heredoc: <<'EOF' ... EOF  → 첫 비어있지 않은 줄
  m = cmd.match(/<<\s*['"]?(\w+)['"]?\s*\n([\s\S]*?)\n\1/);
  if (m) { const f = m[2].split("\n").map(s => s.trim()).filter(Boolean)[0]; if (f) return f; }
  return "커밋";
}
function commits(events) {
  const out = [];
  for (const e of events) {
    if (e.kind !== "tool_use" || e.name !== "Bash") continue;
    const cmd = e.input?.command || "";
    if (!/git commit/.test(cmd)) continue;
    out.push(commitMsg(cmd));
  }
  return out;
}

// 최상단 "이 세션 한눈에" — 데이터로 자동 생성(토큰 0)
function autoSummary(events) {
  const files = changedFiles();
  const decs = decisions(events);
  const cms = commits(events);
  const created = [...files].filter(([,v]) => v.kind === "new").length;
  const mod = [...files].filter(([,v]) => v.kind === "mod").length;
  const hot = [...files].filter(([,v]) => v.kind === "mod")
    .sort((a,b) => b[1].edits.length - a[1].edits.length).slice(0,3).map(([f]) => base(f));
  const decHeads = decs.slice(0,4).map(d => d.header || d.question.slice(0,18)).filter(Boolean);
  const lines = [];
  lines.push(`<b>${sessionDuration(events)}</b> 동안 파일 <b>${files.size}</b>개 작업 (생성 ${created} · 수정 ${mod}) · 의사결정 <b>${decs.length}</b>건${cms.length ? ` · 커밋 <b>${cms.length}</b>` : ""}`);
  if (hot.length) lines.push(`주로 손본 곳: ${hot.map(esc).join(", ")}`);
  if (decHeads.length) lines.push(`주요 결정: ${decHeads.map(esc).join(" · ")}`);
  if (cms.length) lines.push(`대표 커밋: ${esc(cms[0])}`);
  return lines.map(l => `<div>• ${l}</div>`).join("");
}
function decisionCard(d) {
  const alts = d.options.filter(o => !o.picked);
  return `<div class="decision">
    <div class="dq">${d.header ? `<span class="dtag">${esc(d.header)}</span>` : ""}${esc(d.question)}</div>
    <div class="dchosen">✅ ${esc(d.chosen)}</div>
    ${alts.length ? `<details class="dalts"><summary>대안 ${alts.length}개</summary>${alts.map(o => `<div class="dalt"><b>${esc(o.label)}</b>${o.desc ? " — " + esc(o.desc) : ""}</div>`).join("")}</details>` : ""}
  </div>`;
}

function renderSummary() {
  const files = changedFiles();
  const decs = decisions(EVENTS);
  const cms = commits(EVENTS);
  const created = [...files].filter(([,v]) => v.kind === "new");
  const hot = [...files].filter(([,v]) => v.kind === "mod").sort((a,b) => b[1].edits.length - a[1].edits.length);
  const fails = EVENTS.filter(e => e.kind === "tool_use" && e.isError).length;

  const edited = [...files].filter(([,v]) => v.kind === "mod");

  view.innerHTML = `
    <div class="topsum">
      <div class="topsum-h">📋 이 세션 한눈에 <span class="hint">(자동 · 토큰 0)</span></div>
      <div class="topsum-body">${autoSummary(EVENTS)}</div>
      <div class="aibox" style="margin:12px 0 0">
        <button class="aibtn" id="aiSum">✨ AI 서술형 요약으로 더 정교하게</button>
        <div class="aiout" id="aiSumOut" style="display:none"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n">${sessionDuration(EVENTS)}</div><div class="k">소요 시간</div></div>
      <div class="stat"><div class="n">${files.size}</div><div class="k">변경 파일</div></div>
      <div class="stat"><div class="n">${decs.length}</div><div class="k">의사결정</div></div>
      <div class="stat"><div class="n">${cms.length}</div><div class="k">커밋</div></div>
      <div class="stat"><div class="n">${fails}</div><div class="k">코스 수정</div></div>
    </div>

    <details class="fold" open>
      <summary>⚖️ 의사결정 ${decs.length}건</summary>
      <div class="foldbody">
        ${decs.length ? decs.map(decisionCard).join("") : '<p class="hint">기록된 결정(AskUserQuestion)이 없습니다.</p>'}
      </div>
    </details>

    <div class="cols">
      <div>
        <h3 class="sec">📦 산출물</h3>
        <div class="hint" style="margin:0 0 6px">파일 생성 ${created.length} · 수정 ${edited.length}${cms.length ? ` · 커밋 ${cms.length}` : ""}</div>
        <ul class="files">
          ${cms.slice(0,8).map(m => `<li>✅ <span style="color:var(--ink)">${esc(m)}</span></li>`).join("")}
          ${created.slice(0,12).map(([f]) => `<li><span class="tag new">생성</span> ${esc(base(f))}</li>`).join("")}
          ${(!cms.length && !created.length) ? "<li>(파일 변경 없음)</li>" : ""}
        </ul>
      </div>
      <div>
        <h3 class="sec">🔥 변경 핫스팟 <span class="hint">(많이 고친 파일)</span></h3>
        <ul class="files">
          ${hot.slice(0,8).map(([f,v]) => `<li><b>×${v.edits.length}</b> &nbsp;${esc(base(f))}</li>`).join("") || "<li>(없음)</li>"}
        </ul>
      </div>
    </div>
  `;
  document.getElementById("aiSum").onclick = (ev) => callAI("summary", ev.target, document.getElementById("aiSumOut"));
  loadCachedAI("summary", document.getElementById("aiSumOut"), document.getElementById("aiSum"), false);
}

// ── 탭3: 아키텍처/구조 ───────────────────────────────────
function renderDiagram() {
  const files = changedFiles();
  view.innerHTML = `
    <div class="aibox">
      <button class="aibtn" id="aiDia">✨ AI 아키텍처 다이어그램 생성 (claude -p)</button>
      <div class="hint">아래는 변경 파일을 기계적으로 그린 "변경 지도"입니다. 진짜 구조도는 위 버튼으로 AI가 생성합니다.</div>
      <div id="aiDiaOut" style="display:none"></div>
    </div>
    <h3 class="sec">🗺️ 변경 파일 맵 (기계적)</h3>
    <div class="mermaid" id="mechMap"></div>
  `;
  const groups = {};
  for (const [f, v] of files) (groups[topDir(f)] ??= []).push([f, v]);
  let def = "flowchart LR\n";
  let nid = 0; const ids = {};
  for (const [dir, arr] of Object.entries(groups)) {
    def += `  subgraph ${JSON.stringify(dir)}\n`;
    for (const [f, v] of arr) {
      const id = "n" + (nid++); ids[f] = id;
      def += `    ${id}["${base(f).replace(/"/g,"")}"]\n`;
    }
    def += "  end\n";
  }
  for (const [f, v] of files) def += `  style ${ids[f]} fill:${v.kind==="new"?"#1f3a2a":"#1f2f4a"},stroke:#666,color:#e7e7ec\n`;
  renderMermaid(document.getElementById("mechMap"), files.size ? def : "flowchart LR\n  x[변경 없음]");
  document.getElementById("aiDia").onclick = (ev) => callAI("diagram", ev.target, document.getElementById("aiDiaOut"), true);
  loadCachedAI("diagram", document.getElementById("aiDiaOut"), document.getElementById("aiDia"), true);
}

async function renderMermaid(el, def) {
  try {
    const { svg } = await mermaid.render("m" + (mermaidSeq++), def);
    el.innerHTML = svg;
  } catch (e) {
    el.innerHTML = `<div class="hint">다이어그램 렌더 실패. 원본:</div><pre class="code">${esc(def)}</pre>`;
  }
}

// ── 탭4: 코드 변경 (diff) ────────────────────────────────
function renderDiff() {
  const files = changedFiles();
  if (!files.size) { view.innerHTML = `<p class="hint">코드 변경이 없습니다.</p>`; return; }
  const frag = document.createDocumentFragment();
  for (const [f, v] of files) {
    const card = document.createElement("div");
    card.className = "tool";
    let body;
    if (v.kind === "new") {
      body = clampWrap(codeBlock(String(v.content).slice(0,6000), langFromPath(f)));
    } else {
      body = clampWrap(v.edits.map(i => editDiff(i)).join('<div style="height:6px"></div>'));
    }
    card.innerHTML = `<div class="head"><span>${v.kind==="new"?"📄":"📝"}</span><span class="name">${v.kind==="new"?"생성":"수정"}</span><span class="path">${esc(fileName(f))}</span><span class="badge" style="margin-left:auto">${v.kind==="new"?"new":v.edits.length+"회"}</span></div>${body}`;
    frag.appendChild(card);
  }
  view.replaceChildren(frag);
}

// ── AI 호출 (claude -p) ──────────────────────────────────
const fmtK = (n) => n >= 1000 ? (n/1000).toFixed(1) + "k" : String(n);
function usageLine(u) {
  if (!u) return "";
  const cost = u.cost != null ? `$${u.cost.toFixed(4)}` : "—";
  const sec = u.durationMs != null ? `${(u.durationMs/1000).toFixed(1)}s` : "";
  return `입력 <b>${fmtK(u.input)}</b> · 출력 <b>${fmtK(u.output)}</b> · 비용 <b>${cost}</b>${sec ? " · " + sec : ""}`;
}
function usageEl(out) {
  let el = out.nextElementSibling;
  if (!el || !el.classList.contains("usage")) {
    el = document.createElement("div"); el.className = "usage";
    out.after(el);
  }
  return el;
}

async function callAI(kind, btn, out, isDiagram) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "생성 중… (수십 초)";
  out.style.display = "block"; out.className = isDiagram ? "" : "aiout"; out.textContent = "⏳ Claude가 생성 중입니다…";
  const usage = usageEl(out); usage.textContent = "";
  try {
    const r = await fetch(`/api/ai/${kind}/${SESSION}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    if (isDiagram) {
      out.className = "mermaid";
      const def = data.text.replace(/^```mermaid\s*/i,"").replace(/```$/,"").trim();
      renderMermaid(out, def);
    } else {
      out.className = "aiout md"; out.innerHTML = md(data.text); highlightCode();
    }
    usage.innerHTML = usageLine(data.usage);
  } catch (e) {
    out.className = "aiout"; out.textContent = "❌ 실패: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

// 탭 열 때 캐시된 AI 결과를 즉시 표시 (생성 X, 토큰 0). stale면 재생성 힌트.
async function loadCachedAI(kind, out, btn, isDiagram) {
  try {
    let data;
    if (EXPORT) { data = EXPORT.cache && EXPORT.cache[kind]; btn.style.display = "none"; }
    else { const r = await fetch(`/api/ai-cache/${kind}/${SESSION}`); data = await r.json(); }
    if (!data || data.cached === false || !data.text) return;
    out.style.display = "block";
    if (isDiagram) {
      out.className = "mermaid";
      const def = data.text.replace(/^```mermaid\s*/i, "").replace(/```$/, "").trim();
      renderMermaid(out, def);
    } else {
      out.className = "aiout md"; out.innerHTML = md(data.text); highlightCode();
    }
    const usage = usageEl(out); usage.innerHTML = usageLine(data.usage);
    btn.textContent = isDiagram ? "↻ AI 다이어그램 재생성" : "↻ AI 요약 재생성";
    if (data.atEventCount != null && data.atEventCount < EVENTS.length) {
      const hint = document.createElement("div"); hint.className = "hint"; hint.style.color = "#d29922";
      hint.textContent = `⚠ 캐시 생성 이후 작업이 더 진행됐어요 (이벤트 ${data.atEventCount} → ${EVENTS.length}). ↻ 재생성하면 최신 반영.`;
      usage.after(hint);
    }
  } catch {}
}

// ── 상단 토큰바: 이 세션 토큰(안 리셋) + 계정 한도%(리셋) 명확히 분리 ──
function updateUsageBar(u) {
  if (!u) return;
  let html = `이 세션 <b>${fmtTok(u.total)}</b>`;
  if (u.rate) {
    const r = [];
    if (u.rate.fiveHour != null) r.push(`5h <b>${u.rate.fiveHour}%</b>`);
    if (u.rate.sevenDay != null) r.push(`주간 <b>${u.rate.sevenDay}%</b>`);
    if (r.length) html += ` <span class="acct">· 계정 ${r.join(" · ")}</span>`;
  }
  usagebar.innerHTML = html;
  const cost = u.cost != null ? `~$${u.cost.toFixed(2)}` : "—";
  usagebar.title = `이 세션 토큰 ${u.total.toLocaleString()} (이 대화 누적, 리셋 안 됨) · API 환산 ${cost} (구독제면 실제 청구 아님)`
    + (u.rate ? "\n계정 5h·주간 = 전체 한도 소진율(세션별 아님, 창마다 리셋)" : "");
}

// ── 초기화 / SSE ─────────────────────────────────────────
try { mermaid.initialize({ startOnLoad:false, theme:"dark" }); } catch {}
try { if (window.hljs) hljs.configure({ ignoreUnescapedHTML:true }); } catch {}
document.getElementById("fabTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
document.getElementById("fabBottom").onclick = () => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
const exportBtn = document.getElementById("exportBtn");
if (EXPORT) { exportBtn.style.display = "none"; document.getElementById("listLink").style.display = "none"; }
else exportBtn.onclick = async () => {
  const lbl = exportBtn.querySelector(".lbl"); exportBtn.disabled = true; const t = lbl.textContent; lbl.textContent = "내보내는 중…";
  try {
    const r = await fetch(`/export/${SESSION}`); const d = await r.json();
    if (d.error) throw new Error(d.error);
    stat.textContent = `저장됨: ${d.file}`;
    alert(`내보냈습니다:\n${d.path}`);
  } catch (e) { alert("내보내기 실패: " + e.message); }
  finally { exportBtn.disabled = false; lbl.textContent = t; }
};
renderTabs(); draw();
if (EXPORT) {
  stat.textContent = "내보낸 스냅샷";
  updateUsageBar(EXPORT.usage);
  renderSessionName();
} else {
  const es = new EventSource(`/events/${SESSION}`);
  es.addEventListener("snapshot", (m) => {
    EVENTS = JSON.parse(m.data);
    dot.classList.add("live"); stat.textContent = "실시간 연결됨";
    draw(); renderSessionName();
  });
  es.addEventListener("usage", (m) => { try { updateUsageBar(JSON.parse(m.data)); } catch {} });
  es.onerror = () => { dot.classList.remove("live"); stat.textContent = "재연결 중…"; };
}
