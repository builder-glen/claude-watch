<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-watch · 세션</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  /* ── 다크 테마 ── */
  :root { --bg:#15151a; --card:#1e1e24; --line:#2c2c35; --muted:#8b8b96; --ink:#e7e7ec; --accent:#ff5fa8;
    --code-bg:#16161b; --mono:'JetBrains Mono', ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.7 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(21,21,26,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 20px; }
  .topline { display:flex; gap:10px; align-items:center; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .usagebar { margin-left:auto; font-size:12px; color:var(--muted); font-family:var(--mono); white-space:nowrap; }
  .usagebar b { color:var(--ink); font-weight:700; }
  .usagebar .cost { color:#ffb454; font-weight:700; }
  .usagebar .acct { color:#71717c; } .usagebar .acct b { color:#a9a9b4; }
  .status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-left:14px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#555; }
  .dot.live { background:#2bbf6a; box-shadow:0 0 0 3px rgba(43,191,106,.18); }
  .tabs { display:flex; gap:4px; margin-top:10px; }
  .tabs button { border:none; background:transparent; padding:8px 14px; font-size:13.5px; cursor:pointer;
    color:var(--muted); border-radius:8px 8px 0 0; font-weight:600; }
  .tabs button.on { color:var(--accent); background:var(--card); border:1px solid var(--line); border-bottom:1px solid var(--card); margin-bottom:-1px; }
  main { max-width:880px; margin:0 auto; padding:24px 20px 120px; }
  .ev { margin:16px 0; }

  /* 역할 헤더 (F) */
  .msghead { display:flex; align-items:center; gap:8px; margin:0 2px 5px; font-size:12px; }
  .msghead .who { font-weight:700; }
  .msghead .ts { color:var(--muted); font-family:var(--mono); font-size:11px; margin-left:auto; }
  .user .who { color:#6fa8ff; }
  .assistant .who { color:var(--accent); }

  .bubble { padding:12px 16px; border-radius:14px; word-break:break-word; }
  .user .bubble { background:#1d2740; border:1px solid #2c3a5c; white-space:pre-wrap; }
  .assistant .bubble { background:transparent; padding:2px 2px 2px 12px; border-left:2px solid #3a2c36; }
  .role { font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  details.think summary { cursor:pointer; color:var(--muted); font-size:13px; list-style:none; }
  details.think .body { white-space:pre-wrap; color:#9a9aa4; font-size:13px; background:#22222a;
    border-left:3px solid #3a3a44; padding:10px 12px; border-radius:6px; margin-top:6px; font-family:var(--mono); }

  /* 마크다운 (H) */
  .md :first-child { margin-top:0; } .md :last-child { margin-bottom:0; }
  .md p { margin:.5em 0; } .md ul, .md ol { margin:.5em 0; padding-left:1.4em; }
  .md li { margin:2px 0; }
  .md h1,.md h2,.md h3,.md h4 { font-size:1.05em; margin:.8em 0 .3em; font-weight:700; }
  .md a { color:var(--accent); }
  .md blockquote { margin:.5em 0; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); }
  .md table { border-collapse:collapse; margin:.5em 0; font-size:.95em; }
  .md th, .md td { border:1px solid var(--line); padding:4px 8px; }
  .md code { font-family:var(--mono); font-size:.92em; background:#2a2733; padding:1px 5px; border-radius:4px; }
  .md pre { background:var(--code-bg); padding:12px 14px; border-radius:8px; overflow:auto; margin:.6em 0; }
  .md pre code { background:transparent; padding:0; font-size:12.5px; }

  .tool { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:10px 0; }
  .tool .head { display:flex; align-items:center; gap:8px; padding:10px 14px; font-size:13px; }
  .tool .head .name { font-weight:600; }
  .tool .head .path { color:var(--muted); font-family:var(--mono); font-size:12px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool .head .ts { color:var(--muted); font-family:var(--mono); font-size:11px; margin-left:auto; }
  .tool .head .badge { margin-left:8px; }
  .tool.err { border-color:#5c2e2e; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; background:#18331f; color:#5fcf86; }
  .badge.err { background:#3a1e1e; color:#ef7d7d; }
  pre.code { margin:0; padding:12px 14px; background:var(--code-bg); color:#e6e6e6; overflow:auto;
    font:12.5px/1.55 var(--mono); }
  pre.code code, pre.code code.hljs { background:transparent; padding:0; }
  .desc { padding:6px 14px 10px; color:var(--muted); font-size:12.5px; }
  .diff { font:12.5px/1.55 var(--mono); }
  .diff .l { padding:1px 14px; white-space:pre-wrap; word-break:break-word; }
  .diff .del { background:rgba(229,83,75,.14); color:#f0a39a; }
  .diff .add { background:rgba(63,185,108,.14); color:#8fe0ab; }
  details.result { border-top:1px dashed var(--line); }
  details.result summary { cursor:pointer; padding:8px 14px; font-size:12px; color:var(--muted); list-style:none; }
  details.result pre { margin:0; padding:0 14px 12px; max-height:320px; overflow:auto;
    white-space:pre-wrap; font:12px/1.5 var(--mono); color:#9a9aa4; }
  summary::-webkit-details-marker { display:none; }

  /* 요약 탭 */
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; text-align:center; }
  .stat .n { font-size:22px; font-weight:700; }
  .stat .k { font-size:12px; color:var(--muted); }
  h3.sec { font-size:14px; margin:22px 0 8px; }
  ol.prompts { padding-left:20px; } ol.prompts li { margin:4px 0; }
  ul.files { list-style:none; padding:0; font-family:var(--mono); font-size:12.5px; }
  ul.files li { padding:3px 0; } ul.files .tag { font-size:10px; padding:1px 6px; border-radius:8px; margin-right:6px; }
  .tag.new { background:#1f3a2a; color:#8fe0ab; } .tag.mod { background:#1f2f4a; color:#9cc0ef; }

  /* 세션 요약 v1: 의사결정·산출물·핫스팟 */
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:640px){ .cols { grid-template-columns:1fr; } }
  .decision { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:10px; padding:10px 14px; margin:8px 0; }
  .decision .dq { font-weight:600; font-size:13.5px; margin-bottom:5px; }
  .decision .dtag { font-size:10px; font-weight:700; color:var(--accent); background:#2c1a26;
    padding:1px 7px; border-radius:10px; margin-right:6px; vertical-align:middle; }
  .decision .dchosen { color:#8fe0ab; font-size:13px; }
  .decision details.dalts { margin-top:7px; }
  .decision details.dalts summary { cursor:pointer; color:var(--muted); font-size:12px; list-style:none; }
  .decision .dalt { font-size:12px; color:var(--muted); padding:3px 0 3px 12px; border-left:2px solid var(--line); margin-top:5px; }
  .decision .dalt b { color:var(--ink); }
  /* 섹션 접기/펼치기 래퍼 */
  details.fold { margin:22px 0 0; }
  details.fold > summary { cursor:pointer; list-style:none; font-size:14px; font-weight:700; margin:0; display:flex; align-items:center; gap:7px; padding:4px 0; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::before { content:"▸"; color:var(--muted); font-size:12px; transition:transform .15s; }
  details.fold[open] > summary::before { transform:rotate(90deg); }
  details.fold > summary:hover { color:var(--accent); }
  .foldbody { margin-top:10px; }

  .topsum { background:var(--card); border:1px solid var(--line); border-left:3px solid #ffb454; border-radius:12px; padding:14px 16px; margin:6px 0 18px; }
  .topsum-h { font-weight:700; font-size:14px; margin-bottom:8px; }
  .topsum-body { font-size:13.5px; line-height:1.85; }
  .topsum-body b { color:#ffd9a3; font-weight:700; }

  .aibox { margin:14px 0; }
  .aibtn { background:var(--accent); color:#1a0f15; border:none; padding:9px 16px; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; }
  .aibtn:disabled { opacity:.5; cursor:wait; }
  .aiout { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .mermaid { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; overflow:auto; }
  .hint { color:var(--muted); font-size:12.5px; margin:6px 0 14px; }
  .usage { margin-top:8px; font-size:12px; color:var(--muted); font-family:var(--mono); }
  .usage b { color:var(--ink); font-weight:600; }

  /* 긴 블록 접기 */
  .clamp { max-height:340px; overflow:hidden; }
  .clamp.open { max-height:none; overflow:auto; }
  .clamp-toggle { display:block; width:100%; border:none; background:#26242c; color:var(--accent);
    font-size:12px; font-weight:600; padding:6px; cursor:pointer; }
  .clamp-toggle:hover { background:#2e2c36; }

  /* FAB */
  .fab { position:fixed; right:20px; bottom:24px; display:flex; flex-direction:column; gap:8px; z-index:20; }
  .fab button { width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer; font-size:18px; color:var(--ink); line-height:1; }
  .fab button:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="topline">
    <h1>🦞 claude-watch</h1>
    <div class="usagebar" id="usagebar" title="이 세션 누적 토큰 · API 환산 추정 비용 (구독제면 실제 청구액 아님)">집계 중…</div>
    <div class="status"><span id="dot" class="dot"></span><span id="stat">연결 중…</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="view"></main>
<div class="fab">
  <button id="fabTop" title="처음으로">⤒</button>
  <button id="fabBottom" title="가장 최근 대화로">⤓</button>
</div>

<script>
const SESSION = "__SESSION_ID__";
let EVENTS = [];
let TAB = "raw";
const view = document.getElementById("view");
const dot = document.getElementById("dot");
const stat = document.getElementById("stat");
const usagebar = document.getElementById("usagebar");
let mermaidSeq = 0;

const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clampWrap = (inner) => `<div class="clamp">${inner}</div>`;
const fileName = (p) => String(p || "").split("/").slice(-2).join("/");
const base = (p) => String(p || "").split("/").pop();
const topDir = (p) => { const parts = String(p||"").split("/").filter(Boolean); const i = parts.findIndex(x=>x==="src"||x==="lib"||x==="backend"||x==="public"||x==="app"); return i>=0 ? parts[i] : (parts.length>1?parts[parts.length-2]:"root"); };

// 토큰 수 축약 (123456 → 123.5k, 4530000 → 4.5M)
const fmtTok = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);

// ── 타임스탬프 (F) ───────────────────────────────────────
function fmtTs(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ── 마크다운(H) / 코드(G) ────────────────────────────────
function md(t) {
  try { return window.marked ? marked.parse(String(t || ""), { breaks: true }) : esc(t); }
  catch { return esc(t); }
}
const EXT2LANG = { js:"javascript", mjs:"javascript", cjs:"javascript", jsx:"javascript", ts:"typescript", tsx:"typescript",
  java:"java", py:"python", rb:"ruby", go:"go", rs:"rust", sh:"bash", bash:"bash", zsh:"bash", json:"json",
  css:"css", scss:"scss", html:"xml", xml:"xml", md:"markdown", yml:"yaml", yaml:"yaml", sql:"sql",
  kt:"kotlin", swift:"swift", c:"c", h:"c", cpp:"cpp", cc:"cpp", php:"php", vue:"xml" };
const langFromPath = (p) => EXT2LANG[String(p||"").split(".").pop().toLowerCase()] || "";
const codeBlock = (code, lang) => `<pre class="code"><code class="${lang ? "language-"+lang : ""}">${esc(code)}</code></pre>`;
function highlightCode() {
  if (!window.hljs) return;
  view.querySelectorAll("pre code:not([data-hl])").forEach((el) => {
    el.setAttribute("data-hl", "1");
    try { hljs.highlightElement(el); } catch {}
  });
}

// ── 탭 정의 ──────────────────────────────────────────────
const TABS = [
  { id: "raw",     label: "Raw 대화", render: renderRaw },
  { id: "summary", label: "세션 요약", render: renderSummary },
  { id: "diagram", label: "아키텍처/구조", render: renderDiagram },
  { id: "diff",    label: "코드 변경", render: renderDiff },
];
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button class="${t.id===TAB?'on':''}" data-tab="${t.id}">${t.label}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.onclick = () => { TAB = b.dataset.tab; renderTabs(); draw(); });
}
function draw() { TABS.find(t => t.id === TAB).render(); highlightCode(); applyClamps(); }

function applyClamps() {
  view.querySelectorAll(".clamp:not([data-clamp])").forEach((el) => {
    el.setAttribute("data-clamp", "1");
    if (el.scrollHeight <= el.clientHeight + 4) { el.classList.remove("clamp"); return; }
    const btn = document.createElement("button");
    btn.className = "clamp-toggle"; btn.textContent = "⌄ 더 보기";
    btn.onclick = () => {
      const open = el.classList.toggle("open");
      btn.textContent = open ? "⌃ 접기" : "⌄ 더 보기";
      if (!open) el.scrollIntoView({ block: "nearest" });
    };
    el.after(btn);
  });
}

// ── 탭1: Raw 대화 ────────────────────────────────────────
function renderRaw() {
  const frag = document.createDocumentFragment();
  for (const e of EVENTS) frag.appendChild(renderEvent(e));
  view.replaceChildren(frag);
}
function head(who, cls, ts) {
  return `<div class="msghead"><span class="who ${cls}">${who}</span><span class="ts">${fmtTs(ts)}</span></div>`;
}
function renderEvent(e) {
  const wrap = document.createElement("div");
  wrap.className = "ev " + e.kind;
  if (e.kind === "user_text") {
    const long = (e.text || "").length > 1200;
    wrap.innerHTML = head("🧑 나", "", e.ts) + (long
      ? `<details><summary class="role" style="cursor:pointer">긴 입력 펼치기</summary><div class="bubble">${esc(e.text)}</div></details>`
      : `<div class="bubble">${esc(e.text)}</div>`);
  } else if (e.kind === "assistant_text") {
    wrap.innerHTML = head("🤖 Claude", "", e.ts) + `<div class="bubble md">${clampWrap(md(e.text))}</div>`;
  } else if (e.kind === "thinking") {
    wrap.innerHTML = `<details class="think"><summary>💭 생각 펼치기</summary><div class="body">${esc(e.text)}</div></details>`;
  } else if (e.kind === "image") {
    wrap.innerHTML = `<div class="bubble" style="color:var(--muted)">🖼️ 첨부 이미지</div>`;
  } else if (e.kind === "tool_use") {
    wrap.appendChild(renderTool(e));
  }
  return wrap;
}
function badge(e){ if(e.result==null) return ""; return e.isError?`<span class="badge err">실패</span>`:`<span class="badge">완료</span>`; }
function tsSpan(e){ return e.ts?`<span class="ts">${fmtTs(e.ts)}</span>`:""; }
function resultBlock(e){ if(!e.result) return ""; const l=e.isError?"⚠️ 오류 결과 펼치기":"결과 펼치기"; return `<details class="result"><summary>${l}</summary><pre>${esc(e.result)}</pre></details>`; }
function editDiff(i){
  const del = String(i.old_string||"").split("\n").map(l=>`<div class="l del">- ${esc(l)}</div>`).join("");
  const add = String(i.new_string||"").split("\n").map(l=>`<div class="l add">+ ${esc(l)}</div>`).join("");
  return `<div class="diff">${del}${add}</div>`;
}
function renderTool(e) {
  const card = document.createElement("div");
  card.className = "tool" + (e.isError ? " err" : "");
  const i = e.input || {};
  if (e.name === "Bash") {
    card.innerHTML = `<div class="head"><span>⚡</span><span class="name">Bash</span>${tsSpan(e)}${badge(e)}</div>`+
      clampWrap(codeBlock("$ " + (i.command||""), "bash"))+(i.description?`<div class="desc">${esc(i.description)}</div>`:"")+resultBlock(e);
  } else if (e.name === "Edit") {
    card.innerHTML = `<div class="head"><span>📝</span><span class="name">파일 수정</span><span class="path">${esc(fileName(i.file_path))}</span>${tsSpan(e)}${badge(e)}</div>`+clampWrap(editDiff(i))+resultBlock(e);
  } else if (e.name === "Write") {
    card.innerHTML = `<div class="head"><span>📄</span><span class="name">파일 생성</span><span class="path">${esc(fileName(i.file_path))}</span>${tsSpan(e)}${badge(e)}</div>`+clampWrap(codeBlock(String(i.content||"").slice(0,4000), langFromPath(i.file_path)))+resultBlock(e);
  } else if (e.name === "Read") {
    card.innerHTML = `<div class="head"><span>📖</span><span class="name">읽기</span><span class="path">${esc(fileName(i.file_path))}</span>${tsSpan(e)}${badge(e)}</div>`;
  } else {
    card.innerHTML = `<div class="head"><span>🔧</span><span class="name">${esc(e.name)}</span>${tsSpan(e)}${badge(e)}</div>`+clampWrap(codeBlock(JSON.stringify(i,null,2).slice(0,1500), "json"))+resultBlock(e);
  }
  return card;
}

// ── 변경 파일 집계 ──────────────────────────────────────
function changedFiles() {
  const map = new Map();
  for (const e of EVENTS) {
    if (e.kind !== "tool_use") continue;
    const f = e.input?.file_path; if (!f) continue;
    if (e.name === "Write") map.set(f, { kind: "new", edits: [], content: e.input.content || "" });
    else if (e.name === "Edit") {
      const cur = map.get(f) || { kind: "mod", edits: [] };
      cur.edits.push(e.input);
      map.set(f, cur);
    }
  }
  return map;
}

// ── 탭2: 세션 요약 (v1: 데이터로 자동 정리, 토큰 0) ────────
// 결과문자열 "...\"질문\"=\"선택답\"..." → {질문:선택답} 맵
function parseChosen(resultStr) {
  const map = {}; const re = /"([^"]+)"\s*=\s*"([^"]+)"/g; let m;
  while ((m = re.exec(String(resultStr || "")))) map[m[1]] = m[2];
  return map;
}
// AskUserQuestion → 의사결정 목록 (질문·선택·대안+설명)
function decisions(events) {
  const out = [];
  for (const e of events) {
    if (e.kind !== "tool_use" || e.name !== "AskUserQuestion") continue;
    const chosen = parseChosen(e.result);
    for (const q of (e.input?.questions || [])) {
      const ch = chosen[q.question];
      out.push({
        header: q.header || "", question: q.question || "", chosen: ch || "(미응답)",
        options: (q.options || []).map(o => ({ label: o.label, desc: o.description || "", picked: o.label === ch })),
      });
    }
  }
  return out;
}
// 세션 소요 시간(첫~끝 timestamp)
function sessionDuration(events) {
  const ts = events.map(e => e.ts).filter(Boolean).map(t => new Date(t).getTime()).filter(n => !isNaN(n));
  if (ts.length < 2) return "—";
  let s = (Math.max(...ts) - Math.min(...ts)) / 1000;
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60);
  return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${m}분`;
}
// git commit 명령에서 사람이 읽을 메시지(제목 한 줄) 추출
function commitMsg(cmd) {
  // 단순 -m "msg" / 'msg' (단, $(...) 같은 셸 치환은 제외)
  let m = cmd.match(/-m\s+"([^"$]+)"/) || cmd.match(/-m\s+'([^']+)'/);
  if (m) return m[1].split("\n")[0].trim();
  // heredoc: <<'EOF' ... EOF  → 첫 비어있지 않은 줄
  m = cmd.match(/<<\s*['"]?(\w+)['"]?\s*\n([\s\S]*?)\n\1/);
  if (m) { const f = m[2].split("\n").map(s => s.trim()).filter(Boolean)[0]; if (f) return f; }
  return "커밋";
}
function commits(events) {
  const out = [];
  for (const e of events) {
    if (e.kind !== "tool_use" || e.name !== "Bash") continue;
    const cmd = e.input?.command || "";
    if (!/git commit/.test(cmd)) continue;
    out.push(commitMsg(cmd));
  }
  return out;
}

// 최상단 "이 세션 한눈에" — 데이터로 자동 생성(토큰 0)
function autoSummary(events) {
  const files = changedFiles();
  const decs = decisions(events);
  const cms = commits(events);
  const created = [...files].filter(([,v]) => v.kind === "new").length;
  const mod = [...files].filter(([,v]) => v.kind === "mod").length;
  const hot = [...files].filter(([,v]) => v.kind === "mod")
    .sort((a,b) => b[1].edits.length - a[1].edits.length).slice(0,3).map(([f]) => base(f));
  const decHeads = decs.slice(0,4).map(d => d.header || d.question.slice(0,18)).filter(Boolean);
  const lines = [];
  lines.push(`<b>${sessionDuration(events)}</b> 동안 파일 <b>${files.size}</b>개 작업 (생성 ${created} · 수정 ${mod}) · 의사결정 <b>${decs.length}</b>건${cms.length ? ` · 커밋 <b>${cms.length}</b>` : ""}`);
  if (hot.length) lines.push(`주로 손본 곳: ${hot.map(esc).join(", ")}`);
  if (decHeads.length) lines.push(`주요 결정: ${decHeads.map(esc).join(" · ")}`);
  if (cms.length) lines.push(`대표 커밋: ${esc(cms[0])}`);
  return lines.map(l => `<div>• ${l}</div>`).join("");
}
function decisionCard(d) {
  const alts = d.options.filter(o => !o.picked);
  return `<div class="decision">
    <div class="dq">${d.header ? `<span class="dtag">${esc(d.header)}</span>` : ""}${esc(d.question)}</div>
    <div class="dchosen">✅ ${esc(d.chosen)}</div>
    ${alts.length ? `<details class="dalts"><summary>대안 ${alts.length}개 ▸</summary>${alts.map(o => `<div class="dalt"><b>${esc(o.label)}</b>${o.desc ? " — " + esc(o.desc) : ""}</div>`).join("")}</details>` : ""}
  </div>`;
}

function renderSummary() {
  const files = changedFiles();
  const decs = decisions(EVENTS);
  const cms = commits(EVENTS);
  const created = [...files].filter(([,v]) => v.kind === "new");
  const hot = [...files].filter(([,v]) => v.kind === "mod").sort((a,b) => b[1].edits.length - a[1].edits.length);
  const fails = EVENTS.filter(e => e.kind === "tool_use" && e.isError).length;

  const edited = [...files].filter(([,v]) => v.kind === "mod");

  view.innerHTML = `
    <div class="topsum">
      <div class="topsum-h">📋 이 세션 한눈에 <span class="hint">(자동 · 토큰 0)</span></div>
      <div class="topsum-body">${autoSummary(EVENTS)}</div>
      <div class="aibox" style="margin:12px 0 0">
        <button class="aibtn" id="aiSum">✨ AI 서술형 요약으로 더 정교하게</button>
        <div class="aiout" id="aiSumOut" style="display:none"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n">${sessionDuration(EVENTS)}</div><div class="k">소요 시간</div></div>
      <div class="stat"><div class="n">${files.size}</div><div class="k">변경 파일</div></div>
      <div class="stat"><div class="n">${decs.length}</div><div class="k">의사결정</div></div>
      <div class="stat"><div class="n">${cms.length}</div><div class="k">커밋</div></div>
      <div class="stat"><div class="n">${fails}</div><div class="k">코스 수정</div></div>
    </div>

    <details class="fold" open>
      <summary>⚖️ 의사결정 ${decs.length}건</summary>
      <div class="foldbody">
        ${decs.length ? decs.map(decisionCard).join("") : '<p class="hint">기록된 결정(AskUserQuestion)이 없습니다.</p>'}
      </div>
    </details>

    <div class="cols">
      <div>
        <h3 class="sec">📦 산출물</h3>
        <div class="hint" style="margin:0 0 6px">파일 생성 ${created.length} · 수정 ${edited.length}${cms.length ? ` · 커밋 ${cms.length}` : ""}</div>
        <ul class="files">
          ${cms.slice(0,8).map(m => `<li>✅ <span style="color:var(--ink)">${esc(m)}</span></li>`).join("")}
          ${created.slice(0,12).map(([f]) => `<li><span class="tag new">생성</span> ${esc(base(f))}</li>`).join("")}
          ${(!cms.length && !created.length) ? "<li>(파일 변경 없음)</li>" : ""}
        </ul>
      </div>
      <div>
        <h3 class="sec">🔥 변경 핫스팟 <span class="hint">(많이 고친 파일)</span></h3>
        <ul class="files">
          ${hot.slice(0,8).map(([f,v]) => `<li><b>×${v.edits.length}</b> &nbsp;${esc(base(f))}</li>`).join("") || "<li>(없음)</li>"}
        </ul>
      </div>
    </div>
  `;
  document.getElementById("aiSum").onclick = (ev) => callAI("summary", ev.target, document.getElementById("aiSumOut"));
  loadCachedAI("summary", document.getElementById("aiSumOut"), document.getElementById("aiSum"), false);
}

// ── 탭3: 아키텍처/구조 ───────────────────────────────────
function renderDiagram() {
  const files = changedFiles();
  view.innerHTML = `
    <div class="aibox">
      <button class="aibtn" id="aiDia">✨ AI 아키텍처 다이어그램 생성 (claude -p)</button>
      <div class="hint">아래는 변경 파일을 기계적으로 그린 "변경 지도"입니다. 진짜 구조도는 위 버튼으로 AI가 생성합니다.</div>
      <div id="aiDiaOut" style="display:none"></div>
    </div>
    <h3 class="sec">🗺️ 변경 파일 맵 (기계적)</h3>
    <div class="mermaid" id="mechMap"></div>
  `;
  const groups = {};
  for (const [f, v] of files) (groups[topDir(f)] ??= []).push([f, v]);
  let def = "flowchart LR\n";
  let nid = 0; const ids = {};
  for (const [dir, arr] of Object.entries(groups)) {
    def += `  subgraph ${JSON.stringify(dir)}\n`;
    for (const [f, v] of arr) {
      const id = "n" + (nid++); ids[f] = id;
      def += `    ${id}["${base(f).replace(/"/g,"")}"]\n`;
    }
    def += "  end\n";
  }
  for (const [f, v] of files) def += `  style ${ids[f]} fill:${v.kind==="new"?"#1f3a2a":"#1f2f4a"},stroke:#666,color:#e7e7ec\n`;
  renderMermaid(document.getElementById("mechMap"), files.size ? def : "flowchart LR\n  x[변경 없음]");
  document.getElementById("aiDia").onclick = (ev) => callAI("diagram", ev.target, document.getElementById("aiDiaOut"), true);
  loadCachedAI("diagram", document.getElementById("aiDiaOut"), document.getElementById("aiDia"), true);
}

async function renderMermaid(el, def) {
  try {
    const { svg } = await mermaid.render("m" + (mermaidSeq++), def);
    el.innerHTML = svg;
  } catch (e) {
    el.innerHTML = `<div class="hint">다이어그램 렌더 실패. 원본:</div><pre class="code">${esc(def)}</pre>`;
  }
}

// ── 탭4: 코드 변경 (diff) ────────────────────────────────
function renderDiff() {
  const files = changedFiles();
  if (!files.size) { view.innerHTML = `<p class="hint">코드 변경이 없습니다.</p>`; return; }
  const frag = document.createDocumentFragment();
  for (const [f, v] of files) {
    const card = document.createElement("div");
    card.className = "tool";
    let body;
    if (v.kind === "new") {
      body = clampWrap(codeBlock(String(v.content).slice(0,6000), langFromPath(f)));
    } else {
      body = clampWrap(v.edits.map(i => editDiff(i)).join('<div style="height:6px"></div>'));
    }
    card.innerHTML = `<div class="head"><span>${v.kind==="new"?"📄":"📝"}</span><span class="name">${v.kind==="new"?"생성":"수정"}</span><span class="path">${esc(fileName(f))}</span><span class="badge" style="margin-left:auto">${v.kind==="new"?"new":v.edits.length+"회"}</span></div>${body}`;
    frag.appendChild(card);
  }
  view.replaceChildren(frag);
}

// ── AI 호출 (claude -p) ──────────────────────────────────
const fmtK = (n) => n >= 1000 ? (n/1000).toFixed(1) + "k" : String(n);
function usageLine(u) {
  if (!u) return "";
  const cost = u.cost != null ? `$${u.cost.toFixed(4)}` : "—";
  const sec = u.durationMs != null ? `${(u.durationMs/1000).toFixed(1)}s` : "";
  return `입력 <b>${fmtK(u.input)}</b> · 출력 <b>${fmtK(u.output)}</b> · 비용 <b>${cost}</b>${sec ? " · " + sec : ""}`;
}
function usageEl(out) {
  let el = out.nextElementSibling;
  if (!el || !el.classList.contains("usage")) {
    el = document.createElement("div"); el.className = "usage";
    out.after(el);
  }
  return el;
}

async function callAI(kind, btn, out, isDiagram) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "생성 중… (수십 초)";
  out.style.display = "block"; out.className = isDiagram ? "" : "aiout"; out.textContent = "⏳ Claude가 생성 중입니다…";
  const usage = usageEl(out); usage.textContent = "";
  try {
    const r = await fetch(`/api/ai/${kind}/${SESSION}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    if (isDiagram) {
      out.className = "mermaid";
      const def = data.text.replace(/^```mermaid\s*/i,"").replace(/```$/,"").trim();
      renderMermaid(out, def);
    } else {
      out.className = "aiout md"; out.innerHTML = md(data.text); highlightCode();
    }
    usage.innerHTML = usageLine(data.usage);
  } catch (e) {
    out.className = "aiout"; out.textContent = "❌ 실패: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

// 탭 열 때 캐시된 AI 결과를 즉시 표시 (생성 X, 토큰 0). stale면 재생성 힌트.
async function loadCachedAI(kind, out, btn, isDiagram) {
  try {
    const r = await fetch(`/api/ai-cache/${kind}/${SESSION}`);
    const data = await r.json();
    if (!data || data.cached === false || !data.text) return;
    out.style.display = "block";
    if (isDiagram) {
      out.className = "mermaid";
      const def = data.text.replace(/^```mermaid\s*/i, "").replace(/```$/, "").trim();
      renderMermaid(out, def);
    } else {
      out.className = "aiout md"; out.innerHTML = md(data.text); highlightCode();
    }
    const usage = usageEl(out); usage.innerHTML = usageLine(data.usage);
    btn.textContent = isDiagram ? "↻ AI 다이어그램 재생성" : "↻ AI 요약 재생성";
    if (data.atEventCount != null && data.atEventCount < EVENTS.length) {
      const hint = document.createElement("div"); hint.className = "hint"; hint.style.color = "#d29922";
      hint.textContent = `⚠ 캐시 생성 이후 작업이 더 진행됐어요 (이벤트 ${data.atEventCount} → ${EVENTS.length}). ↻ 재생성하면 최신 반영.`;
      usage.after(hint);
    }
  } catch {}
}

// ── 상단 토큰바: 이 세션 토큰(안 리셋) + 계정 한도%(리셋) 명확히 분리 ──
function updateUsageBar(u) {
  if (!u) return;
  let html = `이 세션 <b>${fmtTok(u.total)}</b>`;
  if (u.rate) {
    const r = [];
    if (u.rate.fiveHour != null) r.push(`5h <b>${u.rate.fiveHour}%</b>`);
    if (u.rate.sevenDay != null) r.push(`주간 <b>${u.rate.sevenDay}%</b>`);
    if (r.length) html += ` <span class="acct">· 계정 ${r.join(" · ")}</span>`;
  }
  usagebar.innerHTML = html;
  const cost = u.cost != null ? `~$${u.cost.toFixed(2)}` : "—";
  usagebar.title = `이 세션 토큰 ${u.total.toLocaleString()} (이 대화 누적, 리셋 안 됨) · API 환산 ${cost} (구독제면 실제 청구 아님)`
    + (u.rate ? "\n계정 5h·주간 = 전체 한도 소진율(세션별 아님, 창마다 리셋)" : "");
}

try { if (window.hljs) hljs.configure({ ignoreUnescapedHTML:true }); } catch {}
document.getElementById("fabTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
document.getElementById("fabBottom").onclick = () => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
renderTabs(); draw();

es.addEventListener("snapshot", (m) => {
  EVENTS = JSON.parse(m.data);
  dot.classList.add("live"); stat.textContent = "실시간 연결됨";
  draw();
});
es.addEventListener("usage", (m) => { try { updateUsageBar(JSON.parse(m.data)); } catch {} });
es.onerror = () => { dot.classList.remove("live"); stat.textContent = "재연결 중…"; };
</script>
