const roleMul = (k) => tweaks.roles[k] ?? DEFAULT_ROLES[k] ?? 1;

const WIDTHS = [[960, "좁게"], [1280, "기본"], [1600, "넓게"], [0, "제한 없음"]];
const savedTweaks = store.get("tweaks", {});
let tweaks = Object.assign({ fs: 1, width: 1280 }, savedTweaks);
tweaks.roles = Object.assign({}, DEFAULT_ROLES, savedTweaks.roles || {});
function applyTweaks() {
  const r = document.documentElement;
  r.style.setProperty("--fs", String(tweaks.fs));
  r.style.setProperty("--content-max", tweaks.width ? tweaks.width + "px" : "none");
  // 요소별 배율 — 전체 배율에 곱해진다. 기본값 1은 굳이 심지 않는다.
  for (const [, list] of ROLES) for (const [key] of list) {
    const v = roleMul(key);
    if (v !== 1) r.style.setProperty("--fs-" + key, String(v));
    else r.style.removeProperty("--fs-" + key);
  }
}
let railProject = null;                           // 레일에 표시할 프로젝트(드롭다운으로 전환)
let searchQ = "", hitIdx = 0, hitEls = [];
let newActivity = 0, atBottom = true;
let editingName = false;

/* ── 유틸 ─────────────────────────────────────────────── */
function fmtTs(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtClock(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function kfmt(n) {
  n = Number(n || 0);
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "K";
  return String(n);
}
const money = (c) => "$" + Number(c || 0).toFixed(2);
function dur(ms) {
  ms = Number(ms || 0);
  const s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + ":" + String(s % 60).padStart(2, "0");
  const h = Math.floor(m / 60);
  return h + "시간 " + (m % 60) + "분";
}
const famOf = (m) => { m = String(m || ""); return m.includes("opus") ? "opus" : m.includes("haiku") ? "haiku"
  : m.includes("sonnet") ? "sonnet" : m.includes("fable") ? "fable" : "other"; };
const shortModel = (m) => String(m || "").replace(/^claude-/, "").replace(/-\d{8}$/, "");
function modelChip(model) {
  if (!model || model === "<synthetic>") return "";
  const f = famOf(model);
  return `<span class="mchip m-${f}"><i></i><span>${esc(shortModel(model))}</span></span>`;
}
function md(t) {
  try { return window.marked ? marked.parse(String(t || ""), { breaks: true }) : esc(t); }
  catch { return esc(t); }
}
function highlightCode() {
  if (!window.hljs) return;
  view.querySelectorAll("pre code:not([data-hl])").forEach((el) => {
    el.setAttribute("data-hl", "1");
    try { hljs.highlightElement(el); } catch {}
  });
}
const CLAUDE_ICON = `<svg class="cicon" viewBox="0 0 24 24" aria-hidden="true"><path clip-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" fill="#D97757" fill-rule="evenodd"></path></svg>`;
const EDIT_ICON = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
  <path d="M11.4 2.6a1.6 1.6 0 0 1 2.26 2.26L5.9 12.62l-3.02.76.76-3.02 7.76-7.76Z"
    stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10.2 3.8l2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const FOLDER_ICON = `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
  <path d="M1.75 4.25A1.5 1.5 0 0 1 3.25 2.75h2.4c.4 0 .78.16 1.06.44l.9.9h5.14a1.5 1.5 0 0 1 1.5 1.5v6.16a1.5 1.5 0 0 1-1.5 1.5H3.25a1.5 1.5 0 0 1-1.5-1.5V4.25Z"
    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M1.75 6.6h12.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const CHEV_DOWN = `<svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="#8b8b96" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV_RIGHT = `<svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M4.5 2.5L8 6L4.5 9.5" stroke="#8b8b96" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// 홈 디렉터리는 "~" 가 아니라 "~/" 로 — 폴더라는 게 드러나야 프로젝트 선택기에서 읽힌다
const shortPath = (p) => { const s = String(p || "").replace(/^\/Users\/[^/]+/, "~"); return s === "~" ? "~/" : s; };
const baseName = (p) => String(p || "").split("/").filter(Boolean).pop() || "";

/* ── 히어로 ───────────────────────────────────────────── */
function renderHero() {
  if (!AGG || !SESS) return;
  const st = AGG.stats || {};
  const live = isLive();
  const durMs = (st.firstTs && st.lastTs) ? (new Date(st.lastTs) - new Date(st.firstTs)) : 0;
  $("dot").className = "livedot" + (live ? " pulse" : " off");
  $("mdot").className = "livedot" + (live ? " pulse" : " off");
  const stEl = $("stat");
  stEl.className = "statustext" + (live ? "" : " off");
  stEl.textContent = live ? `RUNNING · ${dur(durMs)}` : `종료 · 총 ${dur(durMs)}`;

  const models = (AGG.models && AGG.models.list) || [];
  const cur = (AGG.models && AGG.models.current) || (models[0] && models[0].model) || "";
  $("curmodel").innerHTML = modelChip(cur);
  const others = models.map(m => m.model).filter(m => m !== cur);
  $("plusmodels").textContent = others.length ? others.map(m => "+" + famOf(m)).join(" ") : "";

  const title = sessionTitle();
  $("htitle").textContent = title;
  $("mname").textContent = title;
  document.title = `${title} · claude-watch`;
  $("hpath").innerHTML = `${esc(shortPath(SESS.cwd || SESS.project))} · <span class="sname">${esc(title)}</span>`
    + (st.firstTs ? ` · 시작 ${esc(fmtTs(st.firstTs))}` : "")
    + (st.lastTs ? ` · 마지막 작업 ${esc(fmtTs(st.lastTs))}` : "");

  const totalTok = USAGE ? USAGE.total : 0;
  const cost = USAGE ? USAGE.cost : 0;
  let add = 0, del = 0;
  for (const f of (AGG.files || [])) { add += f.add || 0; del += f.del || 0; }
  const agents = (AGG.agents || []).length;

  // 설정에서 끈 지표는 구분선까지 같이 빠져야 선이 두 개 붙어 보이지 않는다.
  const cells = [
    ["hero.turns",  metric("주고받은 대화", `<span class="num">${AGG.turns || 0}</span><span class="unit">회</span>`)],
    ["hero.agents", metric("서브에이전트", `<span class="num" style="color:var(--agent)">${agents}</span><span class="unit">개</span>`)],
    ["hero.cost",   metric("쓴 토큰 · 비용", `<span class="num">${kfmt(totalTok)}</span><span class="sub">${money(cost)}</span>`)],
    ["hero.diff",   metric("이 세션에서 변경된 라인", `<span class="num" style="color:var(--add)">+${add}</span><span class="sub" style="font-size:calc(17px * var(--fs));font-weight:700;color:var(--del)">−${del}</span>`)],
  ].filter(([k]) => exShow(k)).map(([, html]) => html);

  $("metrics").innerHTML = cells.join(`<div class="vr"></div>`)
    + `<span class="resumewrap"><button class="btn-resume" id="resumeBtn">이어하기</button>`
    + `<span class="infodot" tabindex="0" role="img" aria-label="이어하기 사용법"
        data-tip="터미널에서 이 세션을 다시 여는 명령을 복사합니다. 붙여넣고 실행하면 대화 맥락이 그대로 이어집니다 — ${esc(resumeCmd())}">i</span></span>`
    + `<button class="btn-export" id="exportBtn">Export</button>`;
  // 내보낸 파일에서는 둘 다 의미가 없다(붙여넣을 터미널도, 저장할 서버도 없다).
  if (EXPORT) { $("exportBtn").remove(); $("resumeBtn").remove(); }
  else {
    $("exportBtn").onclick = doExport;
    $("resumeBtn").onclick = copyResume;
  }
}

// 이 도구를 만든 첫 번째 이유가 "탭을 실수로 닫았을 때 찾기"인데, 찾고 나서 돌아갈
// 방법이 없었다. 세션은 프로젝트 디렉터리 기준으로 관리되므로 cd 까지 붙여야 한다.
function resumeCmd() {
  const cwd = (SESS && SESS.cwd) || "";
  return (cwd ? `cd ${shq(cwd)} && ` : "") + `claude --resume ${SESSION}`;
}
// 경로에 공백·따옴표가 있어도 셸에서 한 덩어리로 읽히도록 작은따옴표로 감싼다.
const shq = (s) => `'` + String(s).replace(/'/g, `'\\''`) + `'`;

function copyResume() {
  const cmd = resumeCmd();
  const done = () => flash("✓ 복사되었어요! 터미널에서 붙여넣기 시 이 세션을 이어갈 수 있어요.");
  if (navigator.clipboard) navigator.clipboard.writeText(cmd).then(done, () => prompt("복사해서 터미널에 붙여넣으세요", cmd));
  else prompt("복사해서 터미널에 붙여넣으세요", cmd);
}
const metric = (lab, val) => `<div class="metric"><div class="lab">${lab}</div><div class="val">${val}</div></div>`;

function isLive() {
  if (EXPORT) return false;
  const last = AGG && AGG.stats && AGG.stats.lastTs;
  if (!last) return false;
  return (Date.now() - new Date(last).getTime()) < 5 * 60 * 1000; // 5분 내 활동 = 진행 중
}
function sessionTitle() {
  const row = INDEX.find(x => x.id === SESSION);
  if (row && row.title) return row.title;
  const u = EVENTS.find(e => e.kind === "user_text" && e.text);
  return u ? u.text.split("\n")[0].slice(0, 60) : SESSION.slice(0, 8);
}

/* ── 탭 ───────────────────────────────────────────────── */
// 내보낸 파일은 설정에서 끈 요소를 아예 갖고 있지 않다. 탭·지표도 그에 맞춰 지운다.
// (실시간 뷰어에는 EXPORT 가 없으므로 항상 전부 보인다.)
const exShow = (k) => !(EXPORT && EXPORT.show && EXPORT.show[k] === false);

const TABS = [
  { id: "summary", label: "요약",  render: renderSummary },
  { id: "arch",    label: "구조",  render: renderArch },
  { id: "changes", label: "변경",  render: renderChanges },
  { id: "raw",     label: "대화",  render: renderChat },
].filter((t) => exShow("tab." + t.id));
function renderTabs() {
  $("tabs").innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}" class="${t.id === TAB ? "on" : ""}">${t.label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $("mobtabs").innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}" class="${t.id === TAB ? "on" : ""}">${t.label}</button>`).join("")
    + `<button data-tab="__rail">세션</button>`;
  $("mobtabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.tab === "__rail") { location.href = "/"; return; }
    setTab(b.dataset.tab);
  });
}
function setTab(id) {
  if (!TAB_IDS.includes(id) || id === TAB) return;
  TAB = id;
  const u = new URL(location.href);
  u.searchParams.set("tab", id);
  history.replaceState(null, "", u);
  renderTabs(); draw(); syncSearchVisibility();
  scroller.scrollTop = 0;
  atBottom = true; farUp = false; updateNewBar();
}
function draw() {
  if (NOTFOUND) return;
  const t = TABS.find(x => x.id === TAB);
  view.innerHTML = "";
  t.render();
  highlightCode();
  applySearch();
}

/* ── 요약 탭 ──────────────────────────────────────────── */
function renderSummary() {
  const a = AGG || {};
  const wrap = document.createElement("div");
  wrap.className = "sum";
  const parts = [];

  // 1) 한 줄 결론 + 불릿 3개 (AI, 캐시 사용)
  parts.push(`<div id="aiSum"></div>`);

  // 2) 의사결정 — 이 세션에서 사람이 실제로 고른 것. 집계보다 위에 둔다.
  //    누르면 대화 탭의 그 지점으로 이동한다(#m<앵커>).
  const decs = a.decisions || [];
  if (decs.length) {
    parts.push(`<div class="pane" style="gap:10px">
      <div class="sechead"><div class="seclab">의사결정 ${decs.length}건</div><div class="spacer"></div>
        <div class="secmeta">누르면 대화의 그 지점으로 이동합니다</div></div>
      <div class="pane" style="gap:8px">${decs.map(d => `<div class="deccard${d.m != null ? " lnkcard" : ""}"
        ${d.m != null ? `data-goto="${d.m}" role="button" tabindex="0" data-tip="대화 탭 #m${d.m} 으로 이동"` : ""}>
        <div style="display:flex;gap:9px;align-items:flex-start">
          ${d.header ? `<span class="dechead">${esc(d.header)}</span>` : ""}
          <span class="decq">${esc(d.question)}</span></div>
        ${d.chosen ? `<div class="decc">✅ ${esc(d.chosen)}</div>` : ""}</div>`).join("")}</div>
    </div>`);
  }

  // 3) 무엇이 이 세션을 돌렸나 — 스킬 / 도구
  const skills = a.skills || [];
  const skTok = skills.reduce((s, x) => s + x.tokens, 0);
  const tools = (a.tools && a.tools.list) || [];
  const maxTool = tools.length ? tools[0].count : 1;
  const TOOLC = { Read: "var(--sonnet)", Edit: "var(--accent)", Write: "var(--accent)", Bash: "var(--sess)",
                  Task: "var(--agent)", Agent: "var(--agent)" };
  parts.push(`<div class="divider"></div>
  <div class="grid2">
    <div class="pane" style="gap:10px">
      <div class="sechead"><div class="seclab">사용한 스킬 ${skills.length}개</div><div class="spacer"></div>
        <div class="secmeta">${skills.length ? "주입 " + kfmt(skTok) + " tok" : ""}</div></div>
      ${skills.length ? `<div class="listbox">${skills.map(s => `<div class="r" data-tip="${esc(s.name)} · 주입 ${s.tokens.toLocaleString()} tok" tabindex="0">
        <span class="skl">SKL</span><span class="skname">${esc(s.name)}</span>
        <span class="sktok">${kfmt(s.tokens)}</span></div>`).join("")}</div>`
        : `<div class="listbox"><div class="r"><span class="sktok">주입된 스킬이 없습니다</span></div></div>`}
    </div>
    <div class="pane" style="gap:10px">
      <div class="sechead"><div class="seclab">도구 호출 ${(a.tools && a.tools.total) || 0}회</div><div class="spacer"></div>
        <div class="secmeta">${(a.tools && a.tools.fails) ? "실패 " + a.tools.fails : ""}</div></div>
      <div class="toolbox">${tools.slice(0, 6).map(t => {
        const c = TOOLC[t.name] || "var(--muted)";
        // 도구명은 52px 칸에 들어가느라 잘린다(mcp__figma__… 처럼 긴 것들) → 행 전체에 전체 이름 툴팁
        return `<div class="toolrow" data-tip="${esc(t.name)} · ${t.count}회" tabindex="0">
          <span class="n" style="color:${c}">${esc(t.name)}</span>
          <span class="track"><span class="fill" style="width:${Math.max(4, Math.round(t.count / maxTool * 100))}%;background:${c}"></span></span>
          <span class="c">${t.count}</span></div>`;
      }).join("") || `<div class="secmeta">도구 호출이 없습니다</div>`}</div>
    </div>
  </div>`);

  // 3) 서브에이전트
  const ags = a.agents || [];
  if (ags.length) {
    const done = ags.filter(x => !x.running).length;
    const run = ags.length - done;
    const tok = ags.reduce((s, x) => s + (x.tokens || 0), 0);
    parts.push(`<div class="pane" style="gap:10px">
      <div class="sechead"><div class="seclab">서브에이전트 ${ags.length}개</div><div class="spacer"></div>
        <div class="secmeta" style="color:var(--agent-muted)">${done} 완료${run ? " · " + run + " 진행" : ""} · ${kfmt(tok)} tok</div></div>
      <div class="agentbox">${ags.map(x => agentRow(x)).join("")}</div>
    </div>`);
  }

  // 4) 모델 비율
  const models = (a.models && a.models.list) || [];
  if (models.length) {
    const tot = models.reduce((s, m) => s + m.total, 0) || 1;
    const cost = models.reduce((s, m) => s + m.cost, 0);
    parts.push(`<div class="pane" style="gap:10px">
      <div class="sechead"><div class="seclab">모델 ${models.length}종 · 전환 ${(a.models.switches || []).length}회</div>
        <div class="spacer"></div>
        <div class="secmeta">${tot.toLocaleString()} tok · ${money(cost)}</div></div>
      <div class="ratio">${models.map(m => `<div style="flex:${Math.max(1, Math.round(m.total / tot * 100))};background:var(--${famOf(m.model)})"></div>`).join("")}</div>
      <div class="legend">${models.map(m => `<div class="l"><span class="sw" style="background:var(--${famOf(m.model)})"></span>
        <span class="nm">${esc(shortModel(m.model))}</span><span class="v">${kfmt(m.total)} · ${money(m.cost)}</span></div>`).join("")}</div>
    </div>`);
  }

  // 6) 산출물 (의사결정은 위로 올렸다)
  const files = a.files || [];
  if (files.length) {
    parts.push(`<div class="divider"></div>`);
    {
      const hot = [...files].sort((x, y) => y.touches - x.touches).slice(0, 5);
      parts.push(`<div class="grid2">
        <div class="pane" style="gap:10px">
          <div class="sechead"><div class="seclab">산출물</div><div class="spacer"></div>
            <div class="secmeta">생성 ${files.filter(f => f.kind === "new").length} · 수정 ${files.filter(f => f.kind === "mod").length}</div></div>
          <div class="listbox">${files.slice(0, 8).map(f => `<div class="r" data-tip="${esc(shortPath(f.path))}" tabindex="0">
            <span class="tag ${f.kind}">${f.kind === "new" ? "생성" : f.kind === "del" ? "삭제" : "수정"}</span>
            <span class="skname">${esc(baseName(f.path))}</span></div>`).join("")}</div>
        </div>
        <div class="pane" style="gap:10px">
          <div class="sechead"><div class="seclab">변경 핫스팟</div><div class="spacer"></div>
            <div class="secmeta">많이 고친 파일</div></div>
          <div class="listbox">${hot.map(f => `<div class="r" data-tip="${esc(shortPath(f.path))} · ${f.touches}회 수정" tabindex="0">
            <span class="sktok">×${f.touches}</span><span class="skname">${esc(baseName(f.path))}</span>
            <span class="sktok"><span style="color:var(--add)">+${f.add}</span> <span style="color:var(--del)">−${f.del}</span></span></div>`).join("")}</div>
        </div>
      </div>`);
    }
  }

  wrap.innerHTML = parts.join("");
  view.appendChild(wrap);

  // 의사결정 → 대화 탭의 그 지점. jumpToHash 가 탭 전환·스크롤을 이미 처리한다.
  wrap.querySelectorAll("[data-goto]").forEach((el) => {
    const go = () => gotoAnchor(el.dataset.goto);
    el.onclick = go;
    el.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } };
  });

  renderAiSummary();
}

// 대화 탭의 #m<번호> 로 이동. 주소창 해시도 같이 바꿔 뒤로가기로 돌아올 수 있게 한다.
function gotoAnchor(m) {
  if (m == null) return;
  location.hash = "m" + m;
  jumpToHash();
}

function agentRow(x) {
  const stat = x.running
    ? `<span class="astat run"><i class="pulse"></i>진행</span>`
    : `<span class="astat done">완료</span>`;
  return `<div class="r">
    <span class="abadge">${x.n}</span>
    <span class="adesc" data-tip="${esc(x.desc)}">${esc(x.desc)}</span>
    ${x.model ? `<span class="amodel" style="color:var(--${famOf(x.model)})">${esc(shortModel(x.model))}</span>` : ""}
    ${x.tools != null ? `<span class="atools">도구 ${x.tools}</span>` : ""}
    ${stat}
    <span class="atok">${x.tokens != null ? kfmt(x.tokens) : "—"}</span>
  </div>`;
}

// 불릿이 "무엇을 했나"라면 서술은 "어떻게 흘러갔나"다.
// 요청 → 작업 → 막힌 지점 → 남은 것 순으로, 처음 보는 사람이 읽을 수 있게.
// 옛 캐시에는 narrative 가 없으므로 없으면 그냥 그리지 않는다(재생성하면 붙는다).
function narrativeBlock(text) {
  const t = String(text || "").trim();
  if (!t) return "";
  const lines = t.split(/\r?\n/).map((x) => x.trim()).filter(Boolean).slice(0, 8);
  if (!lines.length) return "";
  return `<div class="narr">${lines.map((l) => `<p>${inlineCode(l)}</p>`).join("")}</div>`;
}

/* AI 한 줄 결론 + 불릿 — 캐시가 있으면 즉시, 없으면 버튼 */
// AI 요약 상태 — 탭을 오갈 때마다 재요청/재생성하지 않도록 세션 단위로 들고 있는다
let aiCache = null;      // 서버에서 받은 요약(있으면 그대로 그린다)
let aiAutoTried = false; // 자동 생성은 세션당 1회만 시도
let aiBusy = false;

async function renderAiSummary() {
  const box = $("aiSum");
  if (!box) return;

  const paint = (data) => {
    aiCache = data;
    const stale = data.atEventCount != null && data.atEventCount < EVENTS.length;
    const o = typeof data.text === "string" ? parseSummaryJson(data.text) : data.text;
    const foot = (EXPORT || !stale) ? "" :
      `<div class="secmeta">이 요약은 이후 ${EVENTS.length - data.atEventCount}건의 활동을 반영하지 않았습니다
        <span class="lnk" id="aiRegen" style="color:var(--accent);cursor:pointer">⟳ 다시 생성</span></div>`;
    if (o && o.headline) {
      box.innerHTML = `<div class="pane" style="gap:22px">
        <div class="headline">${esc(o.headline)}</div>
        <div class="bullets">${(o.bullets || []).slice(0, 3).map(b =>
          `<div class="bullet"><i></i><span>${inlineCode(b)}</span></div>`).join("")}</div>
        ${narrativeBlock(o.narrative)}${foot}</div>`;
    } else {
      box.innerHTML = `<div class="pane" style="gap:12px"><div class="headline">${esc(autoHeadline())}</div>
        <div class="abody">${md(String(data.text || ""))}</div>${foot}</div>`;
    }
    const rg = $("aiRegen");
    if (rg) rg.onclick = () => generate(rg);
  };

  // 토큰 0 자동 요약 — AI 결과가 없거나 만드는 중일 때 보여준다
  const autoPane = (tail) => `<div class="pane" style="gap:14px">
      <div class="headline">${esc(autoHeadline())}</div>
      <div class="bullets">${autoBullets().map(b => `<div class="bullet"><i></i><span>${inlineCode(b)}</span></div>`).join("")}</div>
      ${tail}</div>`;

  const generate = async (btn) => {
    if (aiBusy) return;
    aiBusy = true;
    const label = btn ? btn.textContent : "";
    if (btn) { btn.textContent = "요약 생성 중…"; btn.disabled = true; }
    try {
      const r = await fetch(`/api/ai/summary/${SESSION}`);
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      aiBusy = false;      // paint 보다 먼저 내려야 한다 — 도중에 재렌더가 끼면 '만드는 중'으로 덮인다
      paint(d);
    } catch (e) {
      if (btn) { btn.textContent = "실패: " + e.message; btn.disabled = false; }
    } finally { aiBusy = false; }
  };

  const manual = () => {
    box.innerHTML = autoPane(EXPORT ? "" : `<button class="aibtn" id="aiBtn">✨ AI 서술형 요약으로 더 정교하게</button>`);
    const b = $("aiBtn");
    if (b) b.onclick = () => generate(b);
  };

  if (EXPORT) { const c = EXPORT.cache && EXPORT.cache.summary; return c ? paint(c) : manual(); }
  if (aiCache) return paint(aiCache);          // 이미 받아둔 게 있으면 재요청하지 않는다
  // 생성 중에 탭이 다시 그려져도(=SSE init/patch) 진행 문구를 유지한다.
  // 이걸 안 하면 나중에 그려진 쪽이 버튼 화면으로 덮어써 생성이 취소된 것처럼 보인다.
  if (aiBusy) return void (box.innerHTML = autoPane(`<div class="secmeta">✨ AI 요약을 만드는 중…</div>`));

  let cached = null;
  try {
    const r = await fetch(`/api/ai-cache/summary/${SESSION}`);
    const d = await r.json();
    if (d && d.text) cached = d;
  } catch {}
  if (aiCache) return paint(aiCache);          // 기다리는 사이 다른 호출이 받아왔을 수 있다
  if (cached) return paint(cached);

  // 캐시가 없다 → 세션이 끝났으면 한 번 자동 생성한다.
  //   진행 중(5분 내 활동)인 세션은 내용이 계속 바뀌므로 자동 생성하지 않는다(결과가 금방 낡는다).
  if (!aiAutoTried && !isLive()) {
    aiAutoTried = true;
    box.innerHTML = autoPane(`<div class="secmeta">✨ 세션이 끝나 AI 요약을 자동으로 만드는 중…</div>`);
    await generate(null);
    if (!aiCache) manual();
    return;
  }
  manual();
}
const stripFence = (s) => String(s || "").replace(/^\s*```(?:json)?\s*/i, "").replace(/```\s*$/, "");
// 모델이 JSON 앞뒤에 인사말을 붙이는 경우가 있다("완료했습니다.\n{...}").
// 코드펜스를 벗기고 첫 { 부터 마지막 } 까지를 잘라 파싱한다.
function parseSummaryJson(text) {
  const t = stripFence(text);
  try { return JSON.parse(t); } catch {}
  const i = t.indexOf("{"), j = t.lastIndexOf("}");
  if (i >= 0 && j > i) { try { return JSON.parse(t.slice(i, j + 1)); } catch {} }
  return null;
}
const inlineCode = (s) => esc(s).replace(/`([^`]+)`/g, '<span class="icode">$1</span>');
// AI 요약이 아직 없을 때 쓰는 자동 헤드라인(토큰 0).
//  주제는 sessionTitle() — 별칭 > Claude Code가 붙인 ai-title > 첫 질문 순.
//  예전엔 첫 사용자 메시지를 그대로 썼는데, 명령문("~ 좀 알려줘")이 제목이 되어 어색했다.
function autoHeadline() {
  const a = AGG || {};
  const topic = String(sessionTitle() || "세션")
    .replace(/\s*[?？!！.]+$/, "")            // 끝의 물음표·마침표는 뗀다
    .replace(/\s*(좀\s*)?(알려줘|해줘|해줄래|부탁해|보여줘)$/, "")  // 명령형 꼬리 제거
    .trim().slice(0, 52);
  const bits = [];
  const f = (a.files || []).length, d = (a.decisions || []).length, ag = (a.agents || []).length;
  if (f) bits.push(`파일 ${f}개`);
  if (d) bits.push(`의사결정 ${d}건`);
  if (ag) bits.push(`서브에이전트 ${ag}개`);
  if (a.stats && a.stats.commits) bits.push(`커밋 ${a.stats.commits}건`);
  return bits.length ? `${topic} — ${bits.join(" · ")}` : topic;
}
function autoBullets() {
  const a = AGG || {}, out = [];
  const st = a.stats || {};
  const hot = [...(a.files || [])].sort((x, y) => y.touches - x.touches)[0];
  out.push(`${a.turns || 0}번 주고받으며 도구를 ${(a.tools && a.tools.total) || 0}회 호출했습니다.`);
  if (hot) out.push(`가장 많이 손본 곳은 \`${baseName(hot.path)}\` (${hot.touches}회).`);
  if ((a.agents || []).length) out.push(`서브에이전트 ${a.agents.length}개가 작업을 나눠 맡았습니다.`);
  else if (st.commits) out.push(`커밋 ${st.commits}건을 만들었습니다.`);
  return out.slice(0, 3);
}

/* ── 구조 탭 ──────────────────────────────────────────── */
function renderArch() {
  const files = (AGG && AGG.files) || [];
  const wrap = document.createElement("div");
  wrap.className = "pane";
  wrap.style.cssText = "gap:16px;width:100%;max-width:var(--content-max)";

  // 경로 → 디렉터리 그룹
  const groups = new Map();
  for (const f of files) {
    const parts = shortPath(f.path).split("/");
    const name = parts.pop();
    const d = parts.join("/") + "/";
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push({ ...f, name });
  }
  const maxTouch = files.reduce((m, f) => Math.max(m, f.touches), 0);
  const rows = [...groups].map(([d, fs]) => {
    const head = `<div class="d">${esc(d)}</div>`;
    const body = fs.map(f => {
      const hot = f.touches === maxTouch && maxTouch > 1;
      const tag = f.kind === "new" ? `<span class="pill new">new</span>`
        : f.kind === "del" ? `<span class="pill del">del</span>` : `<span class="pill mod">mod</span>`;
      return `<div class="f${hot ? " hot" : ""}">${esc(f.name)} ${tag}
        ${f.add ? `<span class="add">+${f.add}</span>` : ""} ${f.del ? `<span class="del">−${f.del}</span>` : ""}</div>`;
    }).join("");
    return head + body;
  }).join("");

  wrap.innerHTML = `<div class="sechead"><div class="seclab">이 세션이 건드린 구조</div><div class="spacer"></div>
      <div class="secmeta">다이어그램 뷰 준비 중</div></div>
    ${files.length ? `<div class="tree">${rows}</div>` : `<div class="secmeta">변경된 파일이 없습니다</div>`}
    <div class="divider"></div>
    <div class="sechead"><div class="seclab">AI 아키텍처 다이어그램</div></div>
    <div id="diaWrap"></div>`;
  view.appendChild(wrap);
  renderDiagram();
}

// 첫 보관을 미뤄둔 경우에만 뜬다. statusline.sh 가 자동 기동한 서버는 터미널이 없어
// 물어볼 수 없으므로, 여기가 사용자가 보관을 시작할 수 있는 유일한 출구다.
let archNoteDone = false;
async function paintArchiveNote() {
  const el = $("archnote");
  if (!el || EXPORT || archNoteDone) return;
  let d;
  try { d = await (await fetch("/api/archive")).json(); } catch { return; }
  if (!d.deferred) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<b>세션 기록이 보관되지 않고 있습니다</b>
    Claude Code 는 30일 지난 세션을 지웁니다. 지금 ${(d.pendingBytes / 1024 / 1024).toFixed(0)}MB 를 보관할 수 있습니다.
    보관본은 이 컴퓨터에만 저장되고 외부로 나가지 않습니다.
    <button id="archGo">지금 보관 시작</button>`;
  $("archGo").onclick = async () => {
    const b = $("archGo"); b.disabled = true; b.textContent = "보관 중…";
    try {
      const r = await (await fetch("/api/archive", { method: "POST" })).json();
      if (r.error) throw new Error(r.error);
      archNoteDone = true;
      el.innerHTML = `<b>보관 완료</b>세션 ${r.files || 0}개 · 서브에이전트 ${r.subagents || 0}개`;
      setTimeout(() => { el.hidden = true; }, 4000);
    } catch (e) { b.disabled = false; b.textContent = "실패 — 다시 시도"; }
  };
}

let mermaidSeq = 0;
async function renderDiagram() {
  const box = $("diaWrap");
  if (!box) return;
  const paint = async (text) => {
    box.innerHTML = `<div class="mermaid" id="mm${++mermaidSeq}"></div>`;
    const el = box.firstChild;
    try {
      const { svg } = await mermaid.render("mmr" + mermaidSeq, stripFence(text).trim());
      el.innerHTML = svg;
      // 그린 결과를 서버 캐시에 얹어둔다 → 내보낼 때 mermaid 없이 이 SVG만 실으면 된다.
      fetch(`/api/diagram-svg/${SESSION}`, { method: "POST", body: svg }).catch(() => {});
    } catch (e) { el.innerHTML = `<div class="secmeta">다이어그램을 그리지 못했습니다: ${esc(e.message)}</div>`; }
  };
  // 내보낸 파일에는 mermaid 가 없다. 미리 그려진 SVG를 그대로 보여준다.
  const paintSvg = (svg) => { box.innerHTML = `<div class="mermaid">${svg}</div>`; };
  const btn = () => {
    box.innerHTML = `<button class="aibtn" id="diaBtn">✨ 아키텍처 다이어그램 생성 (claude -p)</button>`;
    $("diaBtn").onclick = async () => {
      const b = $("diaBtn"); b.textContent = "생성 중…"; b.disabled = true;
      try {
        const r = await fetch(`/api/ai/diagram/${SESSION}`);
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        await paint(d.text);
      } catch (e) { b.textContent = "실패: " + e.message; b.disabled = false; }
    };
  };
  if (EXPORT) {
    const c = EXPORT.cache && EXPORT.cache.diagram;
    if (c && c.svg) return paintSvg(c.svg);
    // 다이어그램 텍스트만 있고 그려둔 적이 없으면, 내보낸 파일에선 그릴 수 없다(mermaid 미포함).
    box.innerHTML = `<div class="secmeta">${c
      ? "다이어그램이 그려지지 않은 채로 내보내졌습니다 (내보내기 전에 [구조] 탭을 한 번 열어주세요)"

function fileBlock(f) {

// 이벤트를 화면 단위(unit)로 묶는다. 연속 도구 호출 = 한 그룹.
function buildBaseUnits(events) {
  const units = [];
  let i = 0;
  while (i < events.length) {
    const e = events[i];
    if (e.kind === "tool_use" && !/^(Task|Agent|AskUserQuestion)$/.test(e.name)) {
      const start = i;
      while (i < events.length && events[i].kind === "tool_use"
             && !/^(Task|Agent|AskUserQuestion)$/.test(events[i].name)) i++;
      units.push({ type: "tools", start, end: i - 1 });
      continue;
    }
    if (e.kind === "tool_use" && /^(Task|Agent)$/.test(e.name)) {
      const start = i;
      while (i < events.length && events[i].kind === "tool_use" && /^(Task|Agent)$/.test(events[i].name)) i++;
      units.push({ type: "agents", start, end: i - 1 });
      continue;
    }
    units.push({ type: e.kind, start: i, end: i });
    i++;
  }
  return units;
}

// 사용자가 한 번 말하면 Claude는 여러 번 답한다(설명 → 도구 → 설명 → 도구…).
// 그 연속 구간을 '턴' 하나로 묶어 헤더(아이콘·모델·시각)를 한 번만 그린다.
// 예전엔 응답마다 헤더가 반복돼 화면이 잘게 끊겨 읽기 어려웠다.
const CLAUDE_SIDE = new Set(["assistant_text", "thinking", "tools", "agents"]);
function buildUnits(events) {
  const base = buildBaseUnits(events);
  const out = [];
  let turn = null;
  const flush = () => { if (turn) { out.push(turn); turn = null; } };
  for (const u of base) {
    const isAsk = u.type === "tool_use" && events[u.start].name === "AskUserQuestion";
    if (CLAUDE_SIDE.has(u.type) || isAsk) {
      if (!turn) turn = { type: "turn", start: u.start, end: u.end, parts: [] };
      turn.parts.push(u);
      turn.end = u.end;
    } else {
      flush();
      out.push(u);
    }
  }
  flush();
  return out;
}

let chatEl = null;
function renderChat() {
  chatEl = document.createElement("div");
  chatEl.className = "chat";
  view.appendChild(chatEl);
  paintChatFrom(0);
}
function paintChatFrom(fromIdx) {
  if (!chatEl) return;
  const units = buildUnits(EVENTS);
  let ui = units.findIndex(u => u.end >= fromIdx);
  if (ui < 0) ui = units.length;
  // 다시 그릴 구간의 DOM만 제거
  [...chatEl.children].forEach(ch => {
    if (Number(ch.dataset.start) >= (units[ui] ? units[ui].start : Infinity)) ch.remove();
  });
  let lastModel = null;
  for (let k = 0; k < ui; k++) {
    const u = units[k];
    for (let j = u.start; j <= u.end; j++) if (EVENTS[j].model && EVENTS[j].model !== "<synthetic>") lastModel = EVENTS[j].model;
  }
  for (let k = ui; k < units.length; k++) {
    const u = units[k];
    const node = renderUnit(u, lastModel);
    for (let j = u.start; j <= u.end; j++) if (EVENTS[j].model && EVENTS[j].model !== "<synthetic>") lastModel = EVENTS[j].model;
    if (node) { node.dataset.start = u.start; chatEl.appendChild(node); }
  }
  highlightCode();
}
function renderUnit(u, prevModel) {
  const e = EVENTS[u.start];
  const box = document.createElement("div");
  box.className = "unit";

  if (u.type === "turn") return renderTurn(u, prevModel, box);
  if (u.type === "tools") return toolGroup(u, box);
  if (u.type === "agents") return agentBlock(u, box);

  switch (e.kind) {
    case "user_text": {
      box.className = "umsg";
      box.innerHTML = `<div class="meta">
          <span class="anchor lnk" data-anchor="${e.m}">#m${e.m} · 링크</span>
          <span class="time">${esc(fmtClock(e.ts))}</span><span class="who">나</span></div>
        <div class="ubub" id="ub${u.start}">${inlineCode(e.text)}${e.imageNames ? `<div class="secmeta">🖼 ${esc(e.imageNames.join(", "))}</div>` : ""}</div>`;
      box.id = "m" + e.m;
      box.querySelector(".anchor").onclick = () => copyAnchor(e.m);
      requestAnimationFrame(() => clampBubble($("ub" + u.start)));
      return box;
    }
    case "skill_note":
    case "system_note": {
      const isSkill = e.kind === "skill_note";
      const name = isSkill ? (e.skill || (e.text.match(/skills\/([^/\s]+)/) || [])[1] || "") : "";
      const label = isSkill
        ? `skill: ${name} 주입 · ${(Math.round(e.text.length / 3.6)).toLocaleString()} tok — 사용자가 입력한 내용이 아닙니다`
        : e.text.replace(/\s+/g, " ").slice(0, 160);
      const key = "sys@" + u.start;
      box.className = "pane";
      box.style.gap = "8px";
      box.innerHTML = `<div class="sysnote"><span class="k">SYS</span><span class="t">${esc(label)}</span>
          <span class="x">${openState[key] ? "접기" : "펼치기"}</span></div>
        ${openState[key] ? `<div class="sysbody">${esc(e.text)}</div>` : ""}`;
      box.querySelector(".x").onclick = () => { openState[key] = !openState[key]; paintChatFrom(u.start); };
      return box;
    }
    case "assistant_text": {
      const sw = (prevModel && e.model && e.model !== "<synthetic>" && e.model !== prevModel)
        ? switchMark(prevModel, e.model, e.ts) : "";
      const tok = e.usage ? `#m${e.m} · ${kfmt((e.usage.in || 0) + (e.usage.out || 0) + (e.usage.cw || 0) + (e.usage.cr || 0))} tok` : `#m${e.m}`;
      box.className = "amsg";
      box.innerHTML = `${sw}<div class="meta">${CLAUDE_ICON}<span class="aname">claude</span>
          ${modelChip(e.model)}<span class="time">${esc(fmtClock(e.ts))}</span>

        <div class="abody">${md(e.text)}</div>`;
      box.querySelector(".tok").onclick = () => copyAnchor(e.m);
      box.id = "m" + e.m;
      return box;
    }
    case "thinking": {
      const key = "th@" + u.start;
      box.innerHTML = `<div class="think"><span class="t">💭 생각 ${openState[key] ? "접기" : "펼치기"}</span>
        ${openState[key] ? `<div style="margin-top:7px;white-space:pre-wrap">${esc(e.text)}</div>` : ""}</div>`;
      box.querySelector(".t").onclick = () => { openState[key] = !openState[key]; paintChatFrom(u.start); };
      return box;
    }
    case "tool_use":
      if (e.name === "AskUserQuestion") return askBlock(e, box);
      return toolGroup({ type: "tools", start: u.start, end: u.start }, box);
    default:
      return null;
  }
}
// 한 턴 = 헤더 1개 + 그 아래 설명·도구·에이전트가 순서대로 흐른다.
function renderTurn(u, prevModel, box) {
  box.className = "turn";
  const first = EVENTS[u.start];
  // 턴 전체 토큰 합 + 대표 모델(첫 응답 기준)
  let tok = 0, model = "";
  for (let i = u.start; i <= u.end; i++) {
    const ev = EVENTS[i];
    if (ev.usage) tok += (ev.usage.in || 0) + (ev.usage.out || 0) + (ev.usage.cw || 0) + (ev.usage.cr || 0);
    if (!model && ev.model && ev.model !== "<synthetic>") model = ev.model;
  }
  const last = EVENTS[u.end];
  const span = (first.ts && last.ts && fmtClock(first.ts) !== fmtClock(last.ts))
    ? `${fmtClock(first.ts)}–${fmtClock(last.ts)}` : fmtClock(first.ts);

  const head = document.createElement("div");
  head.className = "meta turnhead";
  head.innerHTML = `${CLAUDE_ICON}<span class="aname">claude</span>${modelChip(model)}
    <span class="time">${esc(span)}</span>
    <span class="tok lnk" data-anchor="${first.m}">#m${first.m} · ${kfmt(tok)} tok</span>`;
  head.querySelector(".tok").onclick = () => copyAnchor(first.m);
  box.appendChild(head);

  const body = document.createElement("div");
  body.className = "turnbody";
  box.appendChild(body);

  let cur = model;
  for (const part of u.parts) {
    const pe = EVENTS[part.start];
    // 턴 중간에 모델이 바뀌면 그 자리에 전환 마커
    if (part.type === "assistant_text" && pe.model && pe.model !== "<synthetic>" && cur && pe.model !== cur) {
      const w = document.createElement("div");
      w.innerHTML = switchMark(cur, pe.model, pe.ts);
      body.appendChild(w.firstElementChild);
      cur = pe.model;
    }
    let node = null;
    if (part.type === "tools") node = toolGroup(part, document.createElement("div"));
    else if (part.type === "agents") node = agentBlock(part, document.createElement("div"));
    else if (part.type === "assistant_text") {
      node = document.createElement("div");
      node.className = "abody";
      node.id = "m" + pe.m;
      node.innerHTML = md(pe.text);
    } else if (part.type === "thinking") {
      const key = "th@" + part.start;
      node = document.createElement("div");
      node.innerHTML = `<div class="think"><span class="t">💭 생각 ${openState[key] ? "접기" : "펼치기"}</span>
        ${openState[key] ? `<div style="margin-top:7px;white-space:pre-wrap">${esc(pe.text)}</div>` : ""}</div>`;
      node.querySelector(".t").onclick = () => { openState[key] = !openState[key]; paintChatFrom(u.start); };
    } else if (part.type === "tool_use" && pe.name === "AskUserQuestion") {
      node = askBlock(pe, document.createElement("div"));
    }
    if (node) body.appendChild(node);
  }
  return box;
}

function switchMark(from, to, ts) {
  return `<div class="switchmark"><div class="ln"></div><div class="c">
    <span class="mm" style="color:var(--${famOf(from)})">${esc(shortModel(from))}</span>
    <span class="ar">→</span>
    <span class="mm" style="color:var(--${famOf(to)})">${esc(shortModel(to))}</span>
    <span class="lb">모델 전환 · ${esc(fmtClock(ts))}</span></div><div class="ln"></div></div>`;
}

// 도구 그룹 — 접힌 상태에서도 '무엇을 했는지'가 보여야 한다
function toolGroup(u, box) {
  const items = EVENTS.slice(u.start, u.end + 1);
  const key = "tg@" + u.start;
  const open = !!openState[key];
  const fails = items.filter(x => x.isError).length;
  const durMs = (items[0].ts && items[items.length - 1].ts)
    ? (new Date(items[items.length - 1].ts) - new Date(items[0].ts)) : 0;
  box.className = "tgroup";
  box.innerHTML = `<button class="thead">
      <span class="chev">${open ? "▾" : "▸"}</span>
      <span class="cnt">도구 ${items.length}</span>
      <span class="sum" data-tip="${esc(String(toolSummary(items)).replace(/<[^>]+>/g, ""))}">${toolSummary(items)}</span>
      <span class="badge${fails ? " err" : ""}">${fails ? `실패 ${fails}` : "모두 완료"}</span>
      ${durMs > 0 ? `<span class="dur">${dur(durMs)}</span>` : ""}
    </button>
    ${open ? `<div class="tbody">${items.map((x, i) => toolItem(x, u.start + i)).join("")}</div>` : ""}`;
  box.querySelector(".thead").onclick = () => { openState[key] = !open; paintChatFrom(u.start); };
  if (open) box.querySelectorAll(".titem").forEach(el => {
    el.onclick = () => { const k = "ti@" + el.dataset.i; openState[k] = !openState[k]; paintChatFrom(u.start); };
  });
  return box;
}
const TOOLCOLOR = { Read: "var(--sonnet)", Edit: "var(--accent)", Write: "var(--accent)", Bash: "var(--sess)",
                    Grep: "var(--muted)", Glob: "var(--muted)" };
function toolSummary(items) {
  const parts = [];
  const seen = new Map();
  for (const x of items) {
    const arg = toolArg(x);
    const k = x.name + "|" + arg;
    if (seen.has(k)) { seen.set(k, seen.get(k) + 1); continue; }
    seen.set(k, 1);
    if (parts.length < 4) parts.push({ name: x.name, arg, k });
  }
  const txt = parts.map(p => {
    const c = seen.get(p.k);
    return esc(p.name + (p.arg ? " " + p.arg : "") + (c > 1 ? " ×" + c : ""));
  }).join(" · ");
  const rest = items.length - parts.reduce((s, p) => s + seen.get(p.k), 0);
  return txt + (rest > 0 ? ` · +${rest}` : "");
}
function toolArg(e) {
  const i = e.input || {};
  if (i.file_path) return baseName(i.file_path);
  if (i.command) return String(i.command).split("\n")[0].slice(0, 40);
  if (i.pattern) return String(i.pattern).slice(0, 30);
  if (i.description) return String(i.description).slice(0, 30);
  if (i.url) return String(i.url).slice(0, 40);
  if (i.query) return String(i.query).slice(0, 30);
  return "";
}
function toolItem(e, idx) {
  const key = "ti@" + idx;
  const open = !!openState[key];
  const c = TOOLCOLOR[e.name] || "var(--muted)";
  let detail = "";
  if (open) {
    const i = e.input || {};
    const head = i.command ? "$ " + i.command
      : i.file_path ? i.file_path + (i.old_string != null ? "\n\n- " + i.old_string + "\n+ " + i.new_string : "")
      : JSON.stringify(i, null, 2).slice(0, 4000);
    detail = `<div class="tdetail">${esc(head)}${e.result ? "\n\n──────\n" + esc(String(e.result).slice(0, 6000)) : ""}</div>`;
  }
  return `<div class="titem" data-i="${idx}">
    <div class="l"><span class="nm" style="color:${c}">${esc(e.name)}</span>
      <span class="ar">${esc(toolArg(e))}</span>
      <span class="ok${e.isError ? " err" : ""}">${e.result == null ? "…" : e.isError ? "✗" : "✓"}</span></div>
    ${detail}</div>`;
}

// 서브에이전트 블록 (대화 흐름 안)
function agentBlock(u, box) {
  const items = EVENTS.slice(u.start, u.end + 1);
  const all = (AGG && AGG.agents) || [];
  const rows = items.map(x => all.find(a => a.id === (x.meta && x.meta.agentId) || a.m === x.m)).filter(Boolean);
  const list = rows.length ? rows : items.map((x, i) => ({
    n: i + 1, desc: (x.input && x.input.description) || "(설명 없음)",
    model: (x.meta && x.meta.resolvedModel) || "", tokens: (x.meta && x.meta.totalTokens) || null,
    tools: (x.meta && x.meta.totalToolUseCount) ?? null, running: x.result == null,
  }));
  const tok = list.reduce((s, x) => s + (x.tokens || 0), 0);
  const durMs = list.reduce((s, x) => Math.max(s, (x.durationMs || 0)), 0);
  box.className = "agentbox";
  box.innerHTML = `<div class="r" style="border-bottom:1px solid #241c34">
      <span style="font-size:calc(13px * var(--fs));font-weight:700;color:var(--agent)">서브에이전트 ${list.length}개${list.length > 1 ? " 병렬" : ""}</span>
      <div class="spacer" style="flex:1"></div>
      <span class="secmeta" style="color:var(--agent-muted)">${durMs ? dur(durMs) + " · " : ""}${kfmt(tok)} tok</span>
    </div>${list.map(x => agentRow(x)).join("")}`;
  return box;
}

// AskUserQuestion — 의사결정은 대화 흐름에서도 읽히게
function askBlock(e, box) {
  const chosen = {};
  const re = /"([^"]+)"\s*=\s*"([^"]+)"/g; let m;
  while ((m = re.exec(String(e.result || "")))) chosen[m[1]] = m[2];
  const qs = (e.input && e.input.questions) || [];
  box.className = "askbox";
  box.innerHTML = qs.map(q => {
    const pick = chosen[q.question] || "";
    const opts = (q.options || []).map(o =>
      `<div class="askopt${o.label === pick ? " on" : ""}">${o.label === pick ? "✅" : "○"} ${esc(o.label)}${o.description ? ` — ${esc(o.description)}` : ""}</div>`).join("");
    const custom = pick && !(q.options || []).some(o => o.label === pick)
      ? `<div class="askopt on">🗨 내 답변: ${esc(pick)}</div>` : "";
    return `<div class="askq">⚖ ${esc(q.question)}</div>${opts}${custom}`;
  }).join("") || `<div class="askq">질문 정보를 읽지 못했습니다</div>`;
  return box;
}

function clampBubble(el) {
  if (!el || el.dataset.clamped) return;
  const lh = parseFloat(getComputedStyle(el).lineHeight) || 23;
  if (el.scrollHeight <= lh * 10 + 4) return;
  el.dataset.clamped = "1";
  el.classList.add("clamp");
  el.style.maxHeight = (lh * 10) + "px";
  const more = document.createElement("div");
  more.className = "moreline";
  more.textContent = "⌄ 펼치기";
  more.onclick = () => {
    const on = el.classList.toggle("clamp");
    el.style.maxHeight = on ? (lh * 10) + "px" : "none";
    more.textContent = on ? "⌄ 펼치기" : "⌃ 접기";
  };
  el.after(more);
}
function copyAnchor(m) {
  const u = new URL(location.href);
  u.searchParams.set("tab", "raw");
  u.hash = "m" + m;
  navigator.clipboard?.writeText(u.toString());
  flash(`링크 복사됨 · #m${m}`);
}
// 동작 결과(복사됨·저장됨)를 상단 토스트로 알린다.
// 예전에는 히어로의 상태 표시(#stat)를 덮어썼는데, 그러면 LIVE 여부가 잠깐 사라지는 데다
// 눈이 잘 가지 않는 자리라 복사가 됐는지 알기 어려웠다.
let toastT = null;
function flash(msg) {
  let el = $("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    el.setAttribute("role", "status");      // 스크린리더에도 알린다
    el.setAttribute("aria-live", "polite");
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove("on");
  void el.offsetWidth;                       // 연달아 불러도 팝업이 다시 재생되도록
  el.classList.add("on");
  // 긴 문장은 읽을 시간이 더 필요하다. 글자 수에 따라 늘리되 4초를 넘기지 않는다.
  const ms = Math.min(4000, 1600 + msg.length * 45);
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("on"), ms);
}

/* ── 세션 내 검색 ─────────────────────────────────────── */
// 검색은 대화 본문을 찾는 기능이라 대화 탭에서만 노출한다.
// (요약·구조·변경 탭은 집계 화면이라 검색할 본문이 없다)
function syncSearchVisibility() {
  const box = document.querySelector(".searchbox");
  if (!box) return;
  const on = TAB === "raw";
  box.style.display = on ? "" : "none";
  if (!on && searchQ) { searchQ = ""; $("q").value = ""; hitIdx = 0; applySearch(); }
}

function applySearch() {
  hitEls = [];
  view.querySelectorAll(".hl").forEach(el => { el.replaceWith(document.createTextNode(el.textContent)); });
  view.normalize();
  if (!searchQ) { $("hits").textContent = ""; return; }
  const q = searchQ.toLowerCase();
  const walker = document.createTreeWalker(view, NodeFilter.SHOW_TEXT);
  const targets = [];
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue || !n.nodeValue.toLowerCase().includes(q)) continue;
    if (n.parentElement.closest("script,style")) continue;
    targets.push(n);
  }
  for (const t of targets) {
    const frag = document.createDocumentFragment();
    let rest = t.nodeValue, i;
    while ((i = rest.toLowerCase().indexOf(q)) >= 0) {
      if (i) frag.appendChild(document.createTextNode(rest.slice(0, i)));
      const mark = document.createElement("span");
      mark.className = "hl";
      mark.textContent = rest.slice(i, i + q.length);
      frag.appendChild(mark);
      hitEls.push(mark);
      rest = rest.slice(i + q.length);
    }
    if (rest) frag.appendChild(document.createTextNode(rest));
    t.replaceWith(frag);
  }
  if (hitIdx >= hitEls.length) hitIdx = 0;
  markCurrentHit();
}
function markCurrentHit() {
  $("hits").textContent = hitEls.length ? `${hitEls.length ? hitIdx + 1 : 0}/${hitEls.length}` : "0";
  hitEls.forEach((el, i) => el.classList.toggle("cur", i === hitIdx));
  const cur = hitEls[hitIdx];
  if (cur) cur.scrollIntoView({ block: "center", behavior: "smooth" });
}
function gotoHit(d) {
  if (!hitEls.length) return;
  hitIdx = (hitIdx + d + hitEls.length) % hitEls.length;
  markCurrentHit();
}

// 프로젝트별 대표 작업 디렉터리 — 해당 프로젝트 세션 중 cwd가 있는 첫 항목에서 가져온다
function cwdOfProject(proj) {
  const hit = INDEX.find(x => x.project === proj && x.cwd);
  return hit ? hit.cwd : proj;
}
// 홈에서 바로 띄운 세션(프로젝트 폴더 없음)인가 — 목록에서 맨 위로 올린다
function isHomeProject(proj) {
  return shortPath(cwdOfProject(proj)) === "~/";
}
// 경로를 [부모(흐리게), 마지막 폴더(밝게)] 로 쪼갠다. 홈은 쪼개지 않고 통째로 '~/'.
function splitPath(cwd) {
  if (cwd === "~/" || cwd === "~") return { par: "", leaf: "~/" };
  const leaf = baseName(cwd) || cwd;
  return { par: cwd.slice(0, cwd.length - leaf.length), leaf };
}

// 프로젝트 전환 드롭다운. 예전엔 클릭하면 세션 목록 페이지로 튀어서 맥락이 끊겼다.
function openProjectMenu() {
  document.getElementById("projmenu")?.remove();
  const anchor = $("projsel").getBoundingClientRect();
  const groups = new Map();
  for (const x of INDEX) {
    if (x.interactive === false) continue;
    if (!groups.has(x.project)) groups.set(x.project, []);
    groups.get(x.project).push(x);
  }
  const recency = (list) => Math.max(...list.map(s => new Date(s.lastTs || s.updatedAt)));
  const rows = [...groups].sort((a, b) => {
    // 전역(홈에서 띄운 세션)을 항상 맨 위로, 그 다음은 최근 활동순
    const ha = isHomeProject(a[0]), hb = isHomeProject(b[0]);
    if (ha !== hb) return ha ? -1 : 1;
    return recency(b[1]) - recency(a[1]);
  });

  const menu = document.createElement("div");
  menu.id = "projmenu";
  menu.className = "projmenu";
  menu.style.left = anchor.left + "px";
  menu.style.top = (anchor.bottom + 6) + "px";
  menu.innerHTML = rows.map(([proj, list]) => {
    const cwd = shortPath(cwdOfProject(proj));
    const { par, leaf } = splitPath(cwd);
    const live = list.some(s => s.id === SESSION);
    return `<button class="pmrow${proj === railProject ? " on" : ""}" data-proj="${esc(proj)}">
      <span class="dot" style="${live ? "" : "opacity:.25"}"></span>
      <span class="p"><span class="par">${esc(par)}</span><span class="leaf">${esc(leaf)}</span></span>
      <span class="c">${list.length}</span></button>`;
  }).join("") + `<div class="pmfoot"><button class="pmrow" data-all="1">
      <span class="p"><span class="leaf">전체 세션 목록 열기</span></span></button></div>`;
  document.body.appendChild(menu);

  menu.querySelectorAll(".pmrow").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    if (b.dataset.all) { location.href = "/"; return; }
    railProject = b.dataset.proj;
    menu.remove();
    renderRail();
  });
  setTimeout(() => {
    const close = (ev) => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener("click", close); } };
    document.addEventListener("click", close);
  }, 0);
}

function startRename(rowEl) {
  if (editingName) return;
  editingName = true;
  const nm = rowEl.querySelector(".nm");
  const btn = rowEl.querySelector(".renamebtn");
  const cur = nm.textContent;
  const input = document.createElement("input");
  input.className = "renameinput";
  input.value = cur;
  nm.replaceWith(input);
  if (btn) btn.style.display = "none";
  input.focus(); input.select();
  let saved = false;
  const save = async () => {
    if (saved) return; saved = true; editingName = false;
    const next = input.value.trim();
    if (next && next !== cur) {
      await fetch(`/api/rename/${SESSION}?title=${encodeURIComponent(next)}`).catch(() => {});
      const row = INDEX.find(x => x.id === SESSION);
      if (row) row.title = next;
    }
    renderRail(); renderHero();
  };
  const cancel = () => { if (saved) return; saved = true; editingName = false; renderRail(); };
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    else if (e.key === "Escape") { e.preventDefault(); cancel(); }
  };
  input.onblur = save;
}

      c.show = c.show || {}; c.show[b.dataset.el] = b.checked; draw();
    });
    dlg.querySelectorAll("[data-group]").forEach((b) => b.onclick = () => {
      const list = (exportElements.find(([g]) => g === b.dataset.group) || [null, []])[1];
      const turnOff = list.every(([k]) => shown(c, k));
      c.show = c.show || {};
      for (const [k] of list) c.show[k] = !turnOff;
      draw();
    });
    $("cfgCancel").onclick = () => { clearPreview(); dlg.remove(); };
    $("cfgPreview").onclick = () => {
      // 패널을 숨겨 뷰어를 그대로 보여주고, 돌아가기를 누르면 원상복구된다.
      applyPreview(c);
      dlg.style.display = "none";
      const back = document.createElement("div");
      back.className = "pvbar";
      back.innerHTML = `<span>미리보기 — 받는 사람에게 이렇게 보입니다</span><button>설정으로 돌아가기</button>`;
      document.body.appendChild(back);
      back.querySelector("button").onclick = () => {
        clearPreview(); back.remove(); dlg.style.display = "";
      };
    };
    $("cfgSave").onclick = async () => {
      const btn = $("cfgSave"); btn.disabled = true; btn.textContent = "저장 중…";
      try {
        const r = await fetch("/api/export-config", { method: "POST", body: JSON.stringify(c) });
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        exportCfg = d.config;
        clearPreview(); dlg.remove();
        flash("내보내기 설정 저장됨");
        onDone && onDone();
      } catch (e) {
        $("cfgMsg").innerHTML = `<span style="color:var(--del)">저장 실패: ${esc(e.message)}</span>`;
        btn.disabled = false; btn.textContent = "저장";
      }
    };
  };
  document.body.appendChild(dlg);
  draw();
}

async function doExport() {
  if (!exportDefaults) {
    try { exportDefaults = await (await fetch("/api/export-defaults")).json(); }
    catch { exportDefaults = { dir: "~/.claude-watch/exports" }; }
  }
  const homey = (p) => String(p || "").replace(exportDefaults.home || "␀", "~");
  const defName = `[${new Date().toISOString().slice(2, 10).replace(/-/g, "")}] ${sessionTitle()}`
    .replace(/[\/\\:*?"<>|\n\r]+/g, " ").trim().slice(0, 80);

  document.getElementById("exportdlg")?.remove();
  const dlg = document.createElement("div");
  dlg.id = "exportdlg";
  dlg.className = "modal";
  dlg.innerHTML = `<div class="sheet">
      <div class="sh">세션 내보내기</div>
      <div class="sd">서버 없이 열리는 자체완결 HTML 파일 하나로 저장합니다.</div>
      <label class="fl">저장 위치</label>
      <div class="frow">
        <input class="fi mono" id="exDir" value="${esc(homey(exportDefaults.dir))}" spellcheck="false" />
        ${exportDefaults.canPick === false ? "" : `<button class="iconbtn" id="exPick" title="폴더 선택">${FOLDER_ICON}</button>`}
      </div>
      <label class="fl">파일명</label>
      <input class="fi" id="exName" value="${esc(defName)}" spellcheck="false" />
      <label class="fl">내보내기 설정</label>
      <div class="cfgrow">
        <div class="cfgsum" id="exCfgSum">불러오는 중…</div>
        <button class="ghostbtn" id="exCfgEdit">변경</button>
      </div>
      <div class="acts">
        <button class="btn-sec" id="exCancel">취소</button>
        <button class="btn-primary" id="exGo">내보내기</button>
      </div>
      <div class="sd" id="exMsg"></div>
    </div>`;
  document.body.appendChild(dlg);

  const close = () => dlg.remove();
  $("exCancel").onclick = close;

  const paintCfg = () => { $("exCfgSum").innerHTML = cfgSummary(exportCfg); };
  loadExportCfg().then(paintCfg);
  $("exCfgEdit").onclick = () => openExportCfg(paintCfg);
  const pick = $("exPick");
  if (pick) pick.onclick = async () => {
    pick.disabled = true;
    const cur = $("exDir").value.trim().replace(/^~/, exportDefaults.home || "~");
    try {
      const r = await fetch(`/api/pick-folder?start=${encodeURIComponent(cur)}`);
      const d = await r.json();
      if (d.dir) $("exDir").value = homey(d.dir);
      else if (d.error) $("exMsg").innerHTML = `<span style="color:var(--del)">${esc(d.error)}</span>`;
    } catch (e) { $("exMsg").innerHTML = `<span style="color:var(--del)">폴더 선택 실패: ${esc(e.message)}</span>`; }
    finally { pick.disabled = false; }
  };
  dlg.onclick = (e) => { if (e.target === dlg) close(); };
  document.addEventListener("keydown", function esc2(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc2); }
  });
  $("exName").focus(); $("exName").select();

  $("exGo").onclick = async () => {
    const go = $("exGo"), msg = $("exMsg");
    go.disabled = true; go.textContent = "내보내는 중…";
    try {
      const q = new URLSearchParams({
        dir: $("exDir").value.trim(),
        name: $("exName").value.trim(),
      });
      // 설정은 서버가 export-config.json 에서 읽는다 — 여기서 다시 보내지 않는다.
      const r = await fetch(`/export/${SESSION}?${q}`);
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      const m = d.masked;
      const detail = m && m.total
        ? `민감정보 ${m.total}개 가림 (${Object.entries(m.counts).map(([k, v]) => `${k} ${v}`).join(", ")})`
        : (m ? "가릴 민감정보를 찾지 못했습니다" : "");
      const L = d.light || {};
      const size = L.bytes ? (L.bytes / 1024 / 1024).toFixed(2) + " MB" : "";
      const lightInfo = L.mode === "light" && L.savedChars
        ? `경량 적용 — 도구 결과 ${L.result || 0}건 줄임 (${(L.savedChars / 1024 / 1024).toFixed(1)}MB 절약)`
        : "";
      msg.innerHTML = `<span style="color:var(--add)">저장됨</span> <span class="icode">${esc(homey(d.path))}</span>`
        + (size ? ` <span class="sd">${size}</span>` : "")
        + (lightInfo ? `<br>${esc(lightInfo)}` : "")
        + (detail ? `<br>${esc(detail)}` : "");
      flash(`저장됨: ${d.file}`);
      go.textContent = "완료";
      setTimeout(close, m && m.total ? 3200 : 1400);
    } catch (e) {
      msg.innerHTML = `<span style="color:var(--del)">실패: ${esc(e.message)}</span>`;
      go.disabled = false; go.textContent = "내보내기";
    }
  };
}


/* ── Tweaks 패널 ─────────────────────────────────────── */
// 글자 크기는 --fs 하나로 전체 font-size 에 곱해진다(선언 130곳을 calc 로 묶어둠).
// 값은 즉시 반영되고 localStorage 에 저장되어 다음 방문에도 유지된다.
function openTweaks() {
  document.getElementById("tweakpanel")?.remove();
  const anchor = $("tweakBtn").getBoundingClientRect();
  const el = document.createElement("div");
  el.id = "tweakpanel";
  el.className = "tweaks";
  document.body.appendChild(el);

  const draw = () => {
    const pct = Math.round(tweaks.fs * 100);
    const i = FS_STEPS.indexOf(tweaks.fs);
    // "변경됨" 은 기본 배율과 다른 것만 센다
    const changed = ROLES.flatMap(([, l]) => l).filter(([k]) => roleMul(k) !== (DEFAULT_ROLES[k] || 1)).length;
    el.innerHTML = `<div class="hd">보기 설정</div>
      <div class="row">
        <div class="rl"><span class="n">전체 글자 크기</span><span class="v">${pct}%</span></div>
        <div class="bar">
          <button id="fsDown" ${i <= 0 ? "disabled" : ""} aria-label="작게">−</button>
          <span class="prev">가나다 Aa 0123</span>
          <button id="fsUp" ${i >= FS_STEPS.length - 1 ? "disabled" : ""} aria-label="크게">+</button>
        </div>
      </div>
      <div class="row">
        <div class="rl"><span class="n">본문 폭</span>
          <span class="v">${tweaks.width ? tweaks.width + "px" : "제한 없음"}</span></div>
        <div class="steps">${WIDTHS.map(([w, lab]) =>
          `<button data-w="${w}" class="${w === tweaks.width ? "on" : ""}">${lab}</button>`).join("")}</div>
      </div>
      <details class="rolebox" ${changed ? "open" : ""}>
        <summary>요소별 크기 <span class="cnt">${changed ? changed + "개 변경됨" : "전체 기본"}</span></summary>
        ${ROLES.map(([group, list]) => `<div class="rgrp">${esc(group)}</div>` + list.map(([key, label, base]) => {
          const mul = roleMul(key);
          const px = Math.round(base * tweaks.fs * mul * 10) / 10;
          const ri = ROLE_STEPS.indexOf(mul);
          const isDefault = mul === (DEFAULT_ROLES[key] || 1);
          return `<div class="rrow">
            <span class="rn">${esc(label)}</span>
            <span class="rv${isDefault ? "" : " on"}">${px}px</span>
            <button class="rb" data-role="${key}" data-d="-1" ${ri <= 0 ? "disabled" : ""} aria-label="${esc(label)} 작게">−</button>
            <button class="rb" data-role="${key}" data-d="1" ${ri >= ROLE_STEPS.length - 1 ? "disabled" : ""} aria-label="${esc(label)} 크게">+</button>
          </div>`;
        }).join("")).join("")}
      </details>
      <div class="ft">
        <span class="note">이 브라우저에만 저장됩니다</span>
        <button id="twReset">초기화</button>
      </div>`;

    const step = (d) => {
      const n = FS_STEPS.indexOf(tweaks.fs) + d;
      if (n < 0 || n >= FS_STEPS.length) return;
      tweaks.fs = FS_STEPS[n];
      save();
    };
    $("fsDown").onclick = () => step(-1);
    $("fsUp").onclick = () => step(1);
    el.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      tweaks.width = Number(b.dataset.w); save();
    });
    el.querySelectorAll(".rb").forEach(b => b.onclick = () => {
      const key = b.dataset.role;
      const cur = roleMul(key);
      const n = ROLE_STEPS.indexOf(cur) + Number(b.dataset.d);
      if (n < 0 || n >= ROLE_STEPS.length) return;
      tweaks.roles[key] = ROLE_STEPS[n];
      save(true);
    });
    $("twReset").onclick = () => { tweaks = { fs: 1, width: 1280, roles: Object.assign({}, DEFAULT_ROLES) }; save(); };
  };

  const save = (keepOpen) => {
    const wasOpen = keepOpen || !!el.querySelector(".rolebox[open]");
    store.set("tweaks", tweaks);
    applyTweaks();
    draw();
    const box = el.querySelector(".rolebox");
    if (box && wasOpen) box.open = true;
    place();
    // 글자 크기가 바뀌면 말풍선 10줄 클램프 기준도 달라진다 → 대화 탭은 다시 그린다
    if (TAB === "raw") paintChatFrom(0);
  };
  const place = () => {
    const w = el.offsetWidth || 268;
    el.style.left = Math.max(10, Math.min(anchor.right - w, window.innerWidth - w - 10)) + "px";
    el.style.top = (anchor.bottom + 8) + "px";
  };

  draw(); place();
  // 바깥 클릭 감지는 mousedown 으로 한다.
  //  click 으로 잡으면, 패널 안 버튼을 눌러 draw() 가 다시 그리는 순간 그 버튼이 DOM 에서 떨어져
  //  el.contains(target) 이 false 가 되고 → 자기 클릭을 '바깥'으로 오인해 패널이 닫힌다.
  setTimeout(() => {
    const close = (ev) => {
      if (el.contains(ev.target) || (ev.target.closest && ev.target.closest("#tweakBtn"))) return;
      el.remove(); document.removeEventListener("mousedown", close);
    };
    document.addEventListener("mousedown", close);
  }, 0);
  document.addEventListener("keydown", function esc(ev) {
    if (ev.key === "Escape") { el.remove(); document.removeEventListener("keydown", esc); }
  });
}

/* ── 툴팁 ─────────────────────────────────────────────── */
// 네이티브 title 은 1초쯤 가만히 있어야 뜨고 OS 스타일이라 눈에 안 띈다.
// data-tip 을 쓰는 요소에 즉시 뜨는 제품 톤 툴팁을 붙인다(터치·키보드 포커스도 지원).
const tipEl = (() => {
  const d = document.createElement("div");
  d.id = "tip"; d.setAttribute("role", "tooltip");
  document.body.appendChild(d);
  return d;
})();
let tipTimer = null, tipHost = null;
function showTip(host) {
  const text = host.getAttribute("data-tip");
  if (!text) return;
  tipHost = host;
  tipEl.textContent = text;
  tipEl.classList.add("on");
  const r = host.getBoundingClientRect();
  const t = tipEl.getBoundingClientRect();
  // 기본은 요소 위. 위가 좁으면 아래로 뒤집는다.
  let top = r.top - t.height - 8;
  if (top < 8) top = r.bottom + 8;
  let left = r.left;
  if (left + t.width > window.innerWidth - 10) left = window.innerWidth - t.width - 10;
  tipEl.style.left = Math.max(10, left) + "px";
  tipEl.style.top = top + "px";
}
const hideTip = () => { clearTimeout(tipTimer); tipHost = null; tipEl.classList.remove("on"); };
document.addEventListener("mouseover", (e) => {
  const host = e.target.closest && e.target.closest("[data-tip]");
  if (!host) return;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => showTip(host), 120);
});
document.addEventListener("mouseout", (e) => {
  if (e.target.closest && e.target.closest("[data-tip]")) hideTip();
});
document.addEventListener("focusin", (e) => {
  const host = e.target.closest && e.target.closest("[data-tip]");
  if (host) showTip(host);
});
document.addEventListener("focusout", hideTip);
// 스크롤 중에도 붙어 있게 위치만 갱신 (포커스가 유발한 스크롤에 툴팁이 사라지지 않도록)
scroller.addEventListener("scroll", () => {
  if (!tipHost) return;
  if (!document.contains(tipHost)) return hideTip();
  showTip(tipHost);
});

/* ── 초기화 ───────────────────────────────────────────── */
try { mermaid.initialize({ startOnLoad: false, theme: "dark" }); } catch {}
try { if (window.hljs) hljs.configure({ ignoreUnescapedHTML: true }); } catch {}

applyTweaks();
$("tweakBtn").onclick = (e) => { e.stopPropagation(); openTweaks(); };
$("railtoggle").onclick = toggleRail;
$("keep").onclick = () => {
  keepExpanded = !keepExpanded;
  store.set("keepExpanded", keepExpanded);
  $("keep").classList.toggle("on", keepExpanded);
  $("keep").setAttribute("aria-checked", String(keepExpanded));
};
$("keep").classList.toggle("on", keepExpanded);
let qTimer = null;
$("q").oninput = (e) => {
  searchQ = e.target.value.trim();
  hitIdx = 0;
  clearTimeout(qTimer);
  qTimer = setTimeout(applySearch, 160);
};
$("q").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); gotoHit(e.shiftKey ? -1 : 1); } };
$("hprev").onclick = () => gotoHit(-1);
$("hnext").onclick = () => gotoHit(1);
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "f") { e.preventDefault(); $("q").focus(); $("q").select(); }
});

function jumpToHash() {
  const h = location.hash.replace(/^#/, "");
  if (!/^m\d+$/.test(h)) return;
  if (TAB !== "raw") { TAB = "raw"; renderTabs(); draw(); }
  // 탭을 막 그렸으면 요소가 아직 없을 수 있어 한 프레임 뒤에 한 번 더 찾는다.
  const go = () => {
    const el = document.getElementById(h);
    if (!el) return false;
    el.scrollIntoView({ block: "center" });
    flashAnchor(el);
    return true;
  };
  if (!go()) requestAnimationFrame(go);
}

// 이동만 하면 "어디로 왔는지" 눈이 못 따라간다. 그 자리를 잠깐 밝혔다가 되돌린다.
function flashAnchor(el) {
  el.classList.remove("jumped");
  void el.offsetWidth;              // 같은 곳을 연달아 눌러도 다시 재생되도록 리플로우 강제
  el.classList.add("jumped");
  clearTimeout(el._jumpT);
  el._jumpT = setTimeout(() => el.classList.remove("jumped"), 1700);
}

function boot(payload) {
  EVENTS = payload.events; AGG = payload.agg; USAGE = payload.usage; SESS = payload.session;
  renderHero(); renderTabs(); draw(); renderRail(); syncSearchVisibility();
  setTimeout(jumpToHash, 60);
}

if (EXPORT) {
  $("stat").textContent = "내보낸 스냅샷";
  $("dot").className = "livedot off";
  renderHero(); renderTabs(); draw(); syncSearchVisibility();
  document.querySelector(".rail").style.display = "none";
  setTimeout(jumpToHash, 60);
} else {
  // 레일용 색인 (실패해도 본문은 뜬다)
  fetch("/api/index").then(r => r.json()).then(d => {
    INDEX = d; renderRail(); renderHero();
    // 색인이 도착해야 세션 제목(ai-title/별칭)을 쓸 수 있다 → 요약 탭이면 헤드라인 갱신
    if (TAB === "summary") draw();
  }).catch(() => {});

  fetch(`/api/session/${SESSION}`).then(async (r) => {
    if (r.status === 404) return renderNotFound();
    boot(await r.json());

    const es = new EventSource(`/events/${SESSION}`);
    es.addEventListener("init", (m) => {
      const p = JSON.parse(m.data);
      EVENTS = p.events; AGG = p.agg; USAGE = p.usage; SESS = p.session;
      $("stat").classList.remove("off");
      renderHero();
      if (TAB !== "raw") draw(); else paintChatFrom(0);
    });
    // 증분 패치: 달라진 뒷부분만 갈아끼운다 → 펼쳐둔 항목·스크롤이 살아남는다
    es.addEventListener("patch", (m) => {
      const p = JSON.parse(m.data);
      const added = Math.max(0, p.total - EVENTS.length);
      EVENTS = EVENTS.slice(0, p.from).concat(p.events);
      AGG = p.agg; USAGE = p.usage;
      renderHero();
      if (TAB === "raw") {
        if (keepExpanded) paintChatFrom(p.from);
        else draw();
      } else draw();
      if (added > 0 && !atBottom) { newActivity += added; updateNewBar(); }
    });
    es.onerror = () => {
      $("dot").className = "livedot off";
      $("stat").className = "statustext off";
      $("stat").textContent = "재연결 중…";
    };
  }).catch(() => renderNotFound());
}
