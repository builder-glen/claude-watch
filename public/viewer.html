<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-watch · 세션</title>
<!-- 외부 CDN을 쓰지 않는다. 내보낸 HTML은 남에게 보내는 파일이라, 여는 쪽 인터넷 사정에
     따라 깨지거나 외부 도메인에 접속 기록이 남으면 안 된다. 아래는 전부 로컬 vendor/ 에서 온다.
     내보낼 때는 서버가 이 태그들을 파일 내용 자체로 치환한다(server.mjs 의 inlineVendor). -->
<style id="cw-font-face">
/* 본문 한글은 웹폰트를 싣지 않는다 — 설치돼 있으면 Pretendard, 없으면 OS 기본 한글 폰트로
   떨어진다. 한글 글리프 전체는 4종 합쳐 2.6MB라 '보낼 수 있는 파일' 목표와 맞지 않는다.
   반면 JetBrains Mono 는 라틴 문자만이라 43KB고, UI 대부분이 이 폰트를 쓰므로 싣는다. */
@font-face{
  font-family:'JetBrains Mono';
  src:url('/vendor/jetbrains-mono.woff2') format('woff2');
  font-weight:100 800; font-style:normal; font-display:swap;
}
</style>
<link rel="stylesheet" href="/vendor/atom-one-dark.min.css" />
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/marked.min.js"></script>
<!-- mermaid 는 3.2MB라 내보낼 때 제외된다. 대신 뷰어가 그려둔 SVG를 캐시에 넣어 내보낸다. -->
<script src="/vendor/mermaid.min.js" id="cw-mermaid"></script>
<style>
/* ══ 디자인 토큰 (핸드오프 Design Tokens) ══ */
:root{
  --bg:#15151a; --card:#1e1e24; --line:#2c2c35; --line-soft:#21212a;
  --ink:#e7e7ec; --ink-2:#c3c3cc; --ink-3:#d4d4dc; --muted:#8b8b96; --muted-2:#5c5c66;
  --accent:#ff5fa8; --accent-bg:#2c1a26; --accent-ink:#ffa8cf;
  --sess:#f4f89d; --live:#2bbf6a; --code-bg:#16161b;
  --panel:#131318; --panel-2:#0f0f13; --row-sel:#1c1c22; --block:#191920;
  --add:#8fe0ab; --del:#ef7d7d; --mod:#9cc0ef; --sys:#ef5350;
  --agent:#c9a6ff; --agent-bg:#191325; --agent-line:#34294a; --agent-muted:#8b7bb0;
  --opus:#e0a458; --sonnet:#9cc0ef; --haiku:#8fe0ab; --fable:#c9a6ff; --other:#8b8b96;
  --done:#5fcf86;
  /* 본문 최대 폭 — 이 값만 바꾸면 4개 탭 전부 반영된다. 좁히면 가운데로 모인다. */
  /* Tweaks — 뷰어에서 조절하고 localStorage 에 저장한다 */
  --fs:1;                  /* 글자 크기 배율. 모든 font-size 가 이 값과 곱해진다 */
  --content-max:1280px;    /* 본문 최대 폭 */
  --rail-w:357px;          /* 세션 목록 폭 (기존 238 → +50%) */
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sans:Pretendard, -apple-system, system-ui, 'Apple SD Gothic Neo', sans-serif;
  --ease:cubic-bezier(0.23, 1, 0.32, 1);
}
/* 브라우저에 "이 페이지는 다크"라고 알린다.
   이게 없으면 스크롤바·체크박스·입력창을 라이트 기준으로 그려서 흰 스크롤바가 튄다. */
:root{color-scheme:dark}

/* 스크롤바 — 팔레트에 맞춘 얇은 형태. 트랙은 비우고 손잡이만 보이게 한다.
   표준 속성(scrollbar-color/width)이 있으면 Chrome 은 아래 ::-webkit-scrollbar 를 무시한다.
   webkit 블록은 표준 속성을 아직 모르는 구버전 Safari 용 대비책이다. */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;
  border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
@media (hover:hover) and (pointer:fine){
  ::-webkit-scrollbar-thumb:hover{background:var(--muted-2);background-clip:padding-box}
}
/* Firefox 및 표준 속성 */
:root{scrollbar-color:var(--line) transparent;scrollbar-width:thin}
/* 세션 목록·패널은 폭이 좁으니 더 얇게 */
.raillist::-webkit-scrollbar,.tweaks::-webkit-scrollbar,.projmenu::-webkit-scrollbar{width:8px}
.raillist::-webkit-scrollbar-thumb,.tweaks::-webkit-scrollbar-thumb,
.projmenu::-webkit-scrollbar-thumb{border-width:2px}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:calc(14.5px * var(--fs) * var(--fs-ui,1));line-height:1.7;font-family:var(--sans);
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}

@keyframes cwpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
.pulse{animation:cwpulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .pulse{animation:none} *{transition-duration:1ms !important} }

/* 동작 결과 토스트 — 화면 맨 위가 아니라 시선이 자연스럽게 머무는 위쪽 1/6 지점에 띄운다.
   맨 위(top:20px)에 두면 히어로에 묻혀 눈에 안 들어온다. */
.toast{position:fixed;top:16vh;left:50%;z-index:90;
  max-width:min(440px,calc(100vw - 40px));
  padding:13px 22px;border-radius:12px;text-align:center;line-height:1.6;
  background:var(--card);border:1px solid var(--accent);color:var(--ink);
  font-weight:700;font-size:calc(13px * var(--fs) * var(--fs-ui,1));
  box-shadow:0 14px 40px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;
  transform:translateX(-50%) translateY(10px) scale(.96);
  transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1);
  animation:cwtoast 380ms cubic-bezier(.34,1.56,.64,1) both}
/* 살짝 튀어올랐다 자리잡는 팝업 */
@keyframes cwtoast{
  0%   {opacity:0;transform:translateX(-50%) translateY(14px) scale(.92)}
  55%  {opacity:1;transform:translateX(-50%) translateY(-3px) scale(1.04)}
  100% {opacity:1;transform:translateX(-50%) translateY(0)    scale(1)}
}
@media (prefers-reduced-motion: reduce){ .toast.on{animation:none} }

/* 앵커로 이동했을 때 그 자리를 잠깐 밝힌다 — 어디로 왔는지 눈이 따라가도록 */
.jumped{animation:cwjump 1.6s ease-out both;border-radius:12px}
@keyframes cwjump{
  0%   {background:var(--accent-bg);box-shadow:0 0 0 3px var(--accent)}
  55%  {background:var(--accent-bg);box-shadow:0 0 0 3px var(--accent)}
  100% {background:transparent;box-shadow:0 0 0 3px transparent}
}
/* 움직임을 줄이는 설정에서는 깜빡임 없이 정적으로 표시했다가 JS 가 걷어간다 */
@media (prefers-reduced-motion: reduce){
  .jumped{animation:none;background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
}

/* ══ 1. 라이브 히어로 ══ */
.hero{flex-shrink:0;padding:18px 24px 16px;background:linear-gradient(180deg,#1e1e24 0%,#15151a 100%);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px}
.hero-l{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.hero-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(43,191,106,.18);flex-shrink:0}
.livedot.off{background:#555;box-shadow:none;animation:none}
.statustext{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-hero,1));font-weight:700;color:var(--live);letter-spacing:.1em}
.statustext.off{color:var(--muted)}
.hero-title{font-size:calc(20px * var(--fs) * var(--fs-hero,1));font-weight:700;color:var(--ink);letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-path{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-hero,1));color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-path .sname{color:var(--sess)}
.hero-r{display:flex;align-items:center;gap:20px;flex-shrink:0}
.metric{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.metric .lab{font-size:calc(11.5px * var(--fs) * var(--fs-hero,1));color:var(--muted);white-space:nowrap}
.metric .val{display:flex;align-items:baseline;gap:3px}
.metric .num{font-family:var(--mono);font-size:calc(23px * var(--fs) * var(--fs-hero,1));font-weight:700;line-height:1;color:var(--ink)}
.metric .unit{font-size:calc(12.5px * var(--fs) * var(--fs-hero,1));color:var(--muted)}
.metric .sub{font-family:var(--mono);font-size:calc(13.5px * var(--fs) * var(--fs-hero,1));color:var(--muted)}
.vr{width:1px;height:32px;background:var(--line);flex-shrink:0}
.btn-export{font-family:var(--mono);padding:8px 14px;border-radius:8px;background:var(--accent);
  color:#2c1a26;font-size:calc(13px * var(--fs) * var(--fs-hero,1));font-weight:700;transition:transform 160ms var(--ease)}
.btn-export:active{transform:scale(0.97)}
/* 이어하기 — Export 옆에 두되 주 동작은 아니므로 테두리 버튼으로 한 단계 낮춘다 */
.btn-resume{font-family:var(--mono);padding:8px 14px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);color:var(--ink-2);font-size:calc(13px * var(--fs) * var(--fs-hero,1));
  font-weight:700;transition:transform 160ms var(--ease),border-color 160ms var(--ease)}
.btn-resume:hover{border-color:var(--sess);color:var(--ink)}
.btn-resume:active{transform:scale(0.97)}
/* 이어하기 옆 (i) — 무엇을 하는 버튼인지 마우스오버로 알려준다 */
.resumewrap{display:inline-flex;align-items:center;gap:5px}
.infodot{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:1px solid var(--muted-2);color:var(--muted);
  font-family:var(--mono);font-size:calc(10px * var(--fs) * var(--fs-hero,1));font-weight:800;
  cursor:default;transition:color 160ms ease,border-color 160ms ease}
.infodot:hover,.infodot:focus-visible{color:var(--accent-ink);border-color:var(--accent)}
/* 첫 보관을 미뤄둔 상태 안내 — 터미널에서 못 물어봤을 때의 출구 */
.archnote{margin:8px 10px;padding:10px 11px;border:1px solid var(--accent);border-radius:9px;
  background:var(--accent-bg);font-size:calc(11.5px * var(--fs) * var(--fs-rail,1));
  color:var(--accent-ink);line-height:1.6}
.archnote[hidden]{display:none}
.archnote b{display:block;margin-bottom:4px;font-size:calc(12px * var(--fs) * var(--fs-rail,1))}
.archnote button{margin-top:8px;width:100%;font-family:var(--mono);font-weight:700;
  font-size:calc(11.5px * var(--fs) * var(--fs-rail,1));padding:7px;border-radius:7px;
  background:var(--accent);color:#2c1a26}
.archnote button[disabled]{background:var(--card);color:var(--muted);border:1px solid var(--line)}

/* 보관 배지 — 원본이 지워지고 claude-watch 사본으로만 남은 세션 */
.kept{flex-shrink:0;font-family:var(--mono);font-size:calc(9.5px * var(--fs) * var(--fs-rail,1));
  font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px;
  background:var(--accent-bg);color:var(--accent-ink);border:1px solid var(--accent);cursor:default}

/* 내보내기 설정 — 다이얼로그엔 요약 한 줄만, 상세는 별도 창 */
.cfgrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card)}
.cfgsum{flex:1;min-width:0;font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 설정창 — 화면 구조(상단바/탭/요약/대화/파일)와 같은 묶음으로 나열한다 */
.sheet.wide{max-width:760px;width:calc(100vw - 48px)}
.cfggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.cfggroup{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--card)}
.cfgh{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-family:var(--mono);font-weight:700;
  font-size:calc(11.5px * var(--fs) * var(--fs-ui,1));color:var(--ink);letter-spacing:.04em}
.allbtn{margin-left:auto;font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-ui,1));
  color:var(--muted);padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:none}
.allbtn:hover{color:var(--ink-2);border-color:var(--muted-2)}
.ckl{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;
  font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--ink-2)}
.ckl input{flex-shrink:0}

/* 미리보기 — 설정대로 뺐을 때의 화면. 실제 내보내기는 데이터를 지우지만
   미리보기는 되돌려야 하므로 CSS 로만 가린다. */
body.pv-hero-turns   .metric:nth-child(1){display:none}
body.pv-hero-agents  .metric:nth-child(3){display:none}
body.pv-hero-cost    .metric:nth-child(5){display:none}
body.pv-hero-diff    .metric:nth-child(7){display:none}
body.pv-tab-summary  [data-tab="summary"],
body.pv-tab-arch     [data-tab="arch"],
body.pv-tab-changes  [data-tab="changes"],
body.pv-tab-raw      [data-tab="raw"]{display:none}
body.pv-chat-tools .tdetail,body.pv-chat-tools .titem .ar{display:none}
body.pv-chat-think .think{display:none}
body.pv-chat-sys   .sysnote,body.pv-chat-sys .sysbody{display:none}
body.pv-chat-model .mchip,body.pv-chat-model .plusmodels,body.pv-chat-model .switchmark,body.pv-chat-model .amodel{display:none}
body.pv-chat-tok   .meta .tok,body.pv-chat-tok .atok{display:none}
body.pv-sum-skills .skl,body.pv-sum-tools .toolrow,
body.pv-sum-agents .agentcard,body.pv-sum-models .legend,body.pv-sum-files .filepill{display:none}
.pvbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;align-items:center;gap:14px;
  justify-content:center;padding:11px 16px;background:var(--accent-bg);border-top:1px solid var(--accent);
  font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--accent-ink)}
.pvbar button{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-ui,1));font-weight:700;
  padding:6px 12px;border-radius:7px;background:var(--accent);color:#2c1a26}
.btn-export[disabled]{background:var(--card);border:1px solid var(--line);color:var(--muted-2);cursor:default}

/* 모델 칩 */
.mchip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;white-space:nowrap}
.mchip i{width:4px;height:4px;border-radius:50%;display:block}
.mchip span{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-chat-model,1))}
.m-opus{background:rgba(224,164,88,.12);border:1px solid rgba(224,164,88,.3)}
.m-opus i,.m-opus span{background-color:var(--opus);color:var(--opus)}
.m-sonnet{background:rgba(156,192,239,.11);border:1px solid rgba(156,192,239,.28)}
.m-sonnet i,.m-sonnet span{background-color:var(--sonnet);color:var(--sonnet)}
.m-haiku{background:rgba(143,224,171,.11);border:1px solid rgba(143,224,171,.28)}
.m-haiku i,.m-haiku span{background-color:var(--haiku);color:var(--haiku)}
.m-fable{background:rgba(201,166,255,.11);border:1px solid rgba(201,166,255,.28)}
.m-fable i,.m-fable span{background-color:var(--fable);color:var(--fable)}
.m-other{background:rgba(139,139,150,.11);border:1px solid rgba(139,139,150,.28)}
.m-other i,.m-other span{background-color:var(--other);color:var(--other)}
.mchip i{background-image:none}
.mchip span{background:none}
.plusmodels{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-chat-model,1));color:var(--muted-2)}

/* ══ 2. 탭 바 ══ */
.tabbar{flex-shrink:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.tabgroup{display:flex;gap:3px;padding:3px;border-radius:9px;background:#1a1a20;border:1px solid var(--line)}
.tabgroup button{padding:6px 15px;border-radius:6px;font-size:calc(13.5px * var(--fs) * var(--fs-ui,1));font-weight:600;color:var(--muted);
  transition:background 160ms ease,color 160ms ease}
.tabgroup button.on{background:var(--line);color:var(--ink)}
.searchbox{flex:1;min-width:0;max-width:300px;display:flex;align-items:center;gap:8px;height:30px;
  padding:0 11px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.searchbox .ico{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--muted)}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:calc(13px * var(--fs) * var(--fs-ui,1));font-family:var(--sans)}
.searchbox input::placeholder{color:var(--muted-2)}
.hits{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-ui,1));color:var(--accent);white-space:nowrap}
.navhit{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--muted);padding:0 2px;transition:color 160ms ease}
.spacer{flex:1}
.keep{display:flex;align-items:center;gap:9px;flex-shrink:0}
.keep .lab{font-size:calc(13px * var(--fs) * var(--fs-ui,1));color:var(--muted)}
.switch{width:34px;height:19px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0;
  transition:background 160ms ease}
.switch i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);
  transition:left 160ms var(--ease),background 160ms ease;display:block}
.switch.on{background:var(--live)}
.switch.on i{left:17px;background:var(--bg)}

/* ══ 본문 셸 ══ */
.shell{flex:1;display:flex;min-height:0}
.mainwrap{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.scroller{flex:1;overflow-y:auto;padding:22px 26px 64px;display:flex;flex-direction:column;align-items:center}
#view{width:100%;display:flex;flex-direction:column;align-items:center}

/* ══ 3. 세션 레일 ══ */
.rail{width:var(--rail-w);flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;flex-direction:column;gap:9px;padding:11px 12px 10px}
.rail-head .row1{display:flex;align-items:center;gap:8px}
.rail-lab{font-size:calc(11.5px * var(--fs) * var(--fs-rail,1));font-weight:700;color:var(--muted);letter-spacing:.08em}
.railbtn{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;
  background:var(--card);border:1px solid var(--line);font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-rail,1));color:var(--muted);
  transition:transform 160ms var(--ease),background 160ms ease,color 160ms ease}
.railbtn:active{transform:scale(0.94)}
.projsel{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);cursor:pointer;transition:background 160ms ease;width:100%;text-align:left}
.projsel .dot{width:5px;height:5px;border-radius:50%;background:var(--live);flex-shrink:0}
.projpath{display:flex;align-items:center;gap:0;flex:1;min-width:0}
.projpath .par{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-rail,1));color:var(--muted);flex:0 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projpath .leaf{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-rail,1));color:var(--ink);flex:0 0 auto;white-space:nowrap}
.projsel .cnt{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-rail,1));color:var(--muted);flex-shrink:0}
.projsel .car{font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-rail,1));color:var(--muted-2);flex-shrink:0}
.raillist{display:flex;flex-direction:column;overflow-y:auto;border-top:1px solid var(--line-soft);flex:1}
.dgroup{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:7px;padding:7px 12px;width:100%;
  background:var(--panel-2);border-bottom:1px solid var(--line-soft);text-align:left;transition:background 160ms ease}
.dgroup .chev{display:flex;align-items:center;justify-content:center;width:13px;height:13px;flex-shrink:0}
.dgroup .lab{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-rail,1));font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.dgroup .sub{font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-rail,1));color:var(--muted-2)}
.dgroup .cnt{font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-rail,1));color:var(--muted-2);margin-left:auto}
.srow{position:relative;padding:9px 12px 10px 17px;border-bottom:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:background 160ms ease;width:100%;text-align:left}
.srow .nm{font-family:var(--mono);font-size:calc(13px * var(--fs) * var(--fs-rail,1));color:var(--ink-2);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .r1{display:flex;align-items:center;gap:7px;min-width:0}
.srow .ts{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-rail,1));color:var(--muted-2)}
.srow .r3{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-rail,1));color:var(--muted);flex-wrap:wrap}
.srow.sel{padding-left:14px;background:var(--row-sel)}
.srow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.srow.sel .nm{color:var(--sess)}
.srow.live .ts{color:var(--live)}
.renamebtn{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:5px;color:var(--muted-2);flex-shrink:0;cursor:pointer;
  transition:color 160ms ease,background 160ms ease}
.renamebtn svg{display:block}
.renameinput{flex:1;min-width:0;font-family:var(--mono);font-size:calc(13px * var(--fs) * var(--fs-rail,1));color:var(--sess);background:var(--bg);
  border:1px solid var(--accent);border-radius:4px;padding:2px 6px;outline:none}
.railfoot{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line-soft);
  transition:background 160ms ease;width:100%;text-align:left}
.railfoot .l{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-rail,1));color:var(--muted);flex:1}
.railfoot .r{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-rail,1));color:var(--muted-2)}
.statusline{margin:10px;padding:10px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.statusline .lab{font-size:calc(10.5px * var(--fs) * var(--fs-rail,1));font-weight:700;color:var(--muted-2);letter-spacing:.08em}
.statusline .body{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-rail,1));color:var(--muted);white-space:nowrap;overflow:hidden}
.statusline .sep{color:#3a3a44}
/* 내보내기 다이얼로그 */
#tip{position:fixed;z-index:70;max-width:340px;padding:7px 10px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.45);
  color:var(--ink-2);font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-ui,1));
  line-height:1.55;word-break:break-all;pointer-events:none;opacity:0;
  transition:opacity 120ms ease;white-space:pre-wrap}
#tip.on{opacity:1}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);padding:24px}
.modal .sheet{width:100%;max-width:520px;display:flex;flex-direction:column;gap:9px;padding:22px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal .sh{font-size:calc(18px * var(--fs) * var(--fs-ui,1));font-weight:700;color:var(--ink)}
.modal .sd{font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--muted);line-height:1.6}
.modal .fl{font-size:calc(12px * var(--fs) * var(--fs-ui,1));font-weight:700;color:var(--muted);letter-spacing:.06em;margin-top:6px}
.modal .fi{padding:9px 11px;border-radius:8px;background:var(--bg);border:1px solid var(--line);
  color:var(--ink);font-size:calc(13.5px * var(--fs) * var(--fs-ui,1));font-family:var(--sans);outline:none;transition:border-color 160ms ease}
.modal .fi.mono{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-ui,1))}
.modal .frow{display:flex;gap:7px;align-items:stretch}
.modal .frow .fi{flex:1;min-width:0}
.modal .iconbtn{display:flex;align-items:center;justify-content:center;width:38px;flex-shrink:0;
  border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--muted);
  transition:transform 160ms var(--ease),background 160ms ease,color 160ms ease}
.modal .iconbtn:active{transform:scale(0.94)}
.modal .iconbtn[disabled]{opacity:.5}
.modal .fi:focus{border-color:var(--accent)}
.modal .ck{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 12px;border-radius:9px;
  background:var(--bg);border:1px solid var(--line);cursor:pointer}
.modal .ck input{margin-top:2px;accent-color:var(--accent);width:15px;height:15px;flex-shrink:0}
.modal .ck b{font-size:calc(13.5px * var(--fs) * var(--fs-ui,1));color:var(--ink);font-weight:600;display:block;margin-bottom:3px}
.modal .ck .sd{display:block}
.modal .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:10px}
/* Tweaks 패널 */
.tweakbtn{width:26px;height:26px;flex-shrink:0}
.tweaks{position:fixed;z-index:55;width:268px;padding:14px;display:flex;flex-direction:column;gap:15px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.tweaks .hd{font-size:calc(11px * var(--fs) * var(--fs-ui,1));font-weight:700;color:var(--muted);letter-spacing:.08em}
.tweaks .row{display:flex;flex-direction:column;gap:8px}
.tweaks .rl{display:flex;align-items:baseline;gap:8px}
.tweaks .rl .n{font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--ink)}
.tweaks .rl .v{margin-left:auto;font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-ui,1));color:var(--accent)}
.tweaks .steps{display:flex;gap:6px}
.tweaks .steps button{flex:1;padding:6px 0;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-ui,1));
  transition:background 160ms ease,color 160ms ease,border-color 160ms ease}
.tweaks .steps button.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  color:var(--accent-ink);background:var(--accent-bg)}
.tweaks .steps button:active{transform:scale(0.96)}
.tweaks .bar{display:flex;align-items:center;gap:9px}
.tweaks .bar button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-family:var(--mono);font-size:calc(13px * var(--fs) * var(--fs-ui,1))}
.tweaks .bar button:disabled{opacity:.4}
.tweaks .bar .prev{flex:1;text-align:center;color:var(--ink-2);font-size:calc(13px * var(--fs) * var(--fs-ui,1));
  white-space:nowrap;overflow:hidden}
.tweaks{max-height:76vh;overflow-y:auto}
.tweaks .rolebox{border-top:1px solid var(--line-soft);padding-top:11px}
.tweaks .rolebox summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  font-size:calc(12.5px * var(--fs) * var(--fs-ui,1));color:var(--ink)}
.tweaks .rolebox summary::-webkit-details-marker{display:none}
.tweaks .rolebox summary::before{content:"▸";font-family:var(--mono);color:var(--muted);font-size:.9em}
.tweaks .rolebox[open] summary::before{content:"▾"}
.tweaks .rolebox summary .cnt{margin-left:auto;font-family:var(--mono);
  font-size:calc(10.5px * var(--fs) * var(--fs-ui,1));color:var(--muted-2)}
.tweaks .rgrp{margin:12px 0 5px;font-size:calc(10.5px * var(--fs) * var(--fs-ui,1));font-weight:700;
  letter-spacing:.08em;color:var(--muted-2)}
.tweaks .rrow{display:flex;align-items:center;gap:6px;padding:3px 0}
.tweaks .rrow .rn{flex:1;min-width:0;font-size:calc(12px * var(--fs) * var(--fs-ui,1));color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tweaks .rrow .rv{font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-ui,1));
  color:var(--muted-2);width:calc(44px * var(--fs));text-align:right;flex-shrink:0}
.tweaks .rrow .rv.on{color:var(--accent)}
.tweaks .rrow .rb{width:24px;height:22px;flex-shrink:0;border-radius:6px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-2);font-family:var(--mono);
  font-size:calc(11.5px * var(--fs) * var(--fs-ui,1));line-height:1}
.tweaks .rrow .rb:disabled{opacity:.35}
.tweaks .ft{display:flex;align-items:center;gap:9px;padding-top:11px;border-top:1px solid var(--line-soft)}
.tweaks .ft .note{font-size:calc(11px * var(--fs) * var(--fs-ui,1));color:var(--muted-2);flex:1;line-height:1.5}
.tweaks .ft button{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-ui,1));color:var(--muted);
  padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.projmenu{position:fixed;z-index:50;min-width:280px;max-height:60vh;overflow-y:auto;padding:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 6px 20px rgba(0,0,0,.45)}
.pmrow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;text-align:left;
  transition:background 160ms ease}
.pmrow.on{background:var(--row-sel)}
.pmrow .dot{width:5px;height:5px;border-radius:50%;background:var(--live);flex-shrink:0}
.pmrow .p{display:flex;align-items:center;gap:0;flex:1;min-width:0}
.pmrow .par{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-rail,1));color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmrow .leaf{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-rail,1));color:var(--ink);white-space:nowrap;flex-shrink:0}
.pmrow .c{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-rail,1));color:var(--muted-2);flex-shrink:0}
.pmfoot{margin-top:4px;padding-top:4px;border-top:1px solid var(--line-soft)}
.pmfoot .leaf{color:var(--muted)}
.rail.closed{width:48px;align-items:center;padding:13px 0;gap:8px}
.rail.closed .rail-head,.rail.closed .raillist,.rail.closed .railfoot,.rail.closed .statusline{display:none}
.railmini{display:none}
.rail.closed .railmini{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;width:100%}
.minibtn{width:28px;height:28px;border-radius:7px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-rail,1));font-weight:700;color:var(--ink)}
.minisep{width:24px;height:1px;background:var(--line);margin:4px 0}
.minichip{width:28px;height:28px;border-radius:7px;background:#1a1a20;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-rail,1));color:var(--muted)}
.minichip.on{background:rgba(255,95,168,.12);border-color:rgba(255,95,168,.3)}
.minichip .p{width:6px;height:6px;border-radius:50%;background:var(--live)}

/* ══ 공통 섹션 ══ */
.seclab{font-size:calc(12px * var(--fs) * var(--fs-sum-label,1));font-weight:700;color:var(--muted);letter-spacing:.08em}
.secmeta{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-sum-label,1));color:var(--muted-2)}
.sechead{display:flex;align-items:baseline;gap:9px}
.sechead .spacer{flex:1}
.divider{height:1px;background:var(--line)}
.pane{display:flex;flex-direction:column}
.listbox{border:1px solid var(--line);border-radius:11px;background:var(--card);overflow:hidden}
.listbox .r{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line)}
.listbox .r:last-child{border-bottom:0}

/* ══ 4. 요약 탭 ══ */
/* 폭은 유동. 프로토타입 프레임(1180px) 기준 고정값을 쓰면 와이드 모니터에서 오른쪽이 빈다. */
.sum{display:flex;flex-direction:column;gap:22px;width:100%;max-width:var(--content-max)}
.headline{font-size:calc(22px * var(--fs) * var(--fs-sum-head,1));font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.45;text-wrap:pretty;max-width:42em}
.bullets{display:flex;flex-direction:column;gap:10px}
.bullet{display:flex;gap:11px}
.bullet i{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:9px;flex-shrink:0;display:block}
.bullet span{font-size:calc(15px * var(--fs) * var(--fs-sum-bullet,1));color:var(--ink-2);line-height:1.7;text-wrap:pretty;max-width:64em}
code,.icode{font-family:var(--mono);font-size:calc(13.5px * var(--fs) * var(--fs-code,1));background:#2a2733;color:#CE9178;padding:1px 5px;border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.skl{font-family:var(--mono);font-size:calc(10px * var(--fs) * var(--fs-sum-label,1));font-weight:800;color:var(--sys);flex-shrink:0}
.skname{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-sum-label,1));color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sktok{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-sum-label,1));color:var(--muted)}
.toolbox{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:11px 13px;
  display:flex;flex-direction:column;gap:9px}
.toolrow{display:flex;align-items:center;gap:9px}
.toolrow .n{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-sum-label,1));width:calc(58px * var(--fs));flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolrow .track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.toolrow .fill{height:100%;display:block}
.toolrow .c{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-sum-label,1));color:var(--muted);width:calc(24px * var(--fs));text-align:right}
.agentbox{border:1px solid var(--agent-line);border-radius:11px;background:var(--agent-bg);overflow:hidden}
.agentbox .r{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid #241c34}
.agentbox .r:last-child{border-bottom:0}
.abadge{width:17px;height:17px;border-radius:5px;background:rgba(201,166,255,.14);border:1px solid rgba(201,166,255,.32);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:calc(10px * var(--fs) * var(--fs-chat-agent,1));color:var(--agent);
  font-weight:700;flex-shrink:0}
.adesc{font-size:calc(13px * var(--fs) * var(--fs-chat-agent,1));color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amodel,.atools,.astat,.atok{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-chat-agent,1));flex-shrink:0}
.atools{color:var(--agent-muted)}
.astat.done{color:var(--done)}
.astat.run{display:flex;align-items:center;gap:5px;color:var(--sess)}
.astat.run i{width:5px;height:5px;border-radius:50%;background:var(--sess);display:block}
.atok{color:var(--muted);width:calc(41px * var(--fs));text-align:right}
.ratio{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.ratio div:first-child{border-radius:4px 0 0 4px}
.ratio div:last-child{border-radius:0 4px 4px 0}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.legend .l{display:flex;align-items:center;gap:8px}
.legend .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0;display:block}
.legend .nm{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-sum-label,1));color:var(--ink-2);flex:1}
.legend .v{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-sum-label,1));color:var(--muted)}
.aibtn{align-self:flex-start;font-size:calc(13px * var(--fs) * var(--fs-sum-label,1));padding:7px 13px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);color:var(--ink-2);transition:transform 160ms var(--ease),color 160ms ease}
.aibtn:active{transform:scale(0.97)}

/* 서술형 요약 — 불릿이 "무엇을"이면 여기는 "어떻게 흘러갔나".
   코드 블록처럼 한 덩어리로 감싸 본문과 구분한다. */
.narr{background:var(--code-bg);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  display:flex;flex-direction:column;gap:7px}
.narr p{margin:0;font-size:calc(13.5px * var(--fs) * var(--fs-sum-bullet,1));color:var(--ink-2);line-height:1.75}
.narr p:first-child{color:var(--ink)}

/* 의사결정 / 산출물 (기존 기능 유지) */
.deccard{border-left:2px solid var(--accent);background:var(--block);border-radius:0 11px 11px 0;padding:11px 14px;
  display:flex;flex-direction:column;gap:6px}
/* 누르면 대화 탭의 그 지점으로 가는 카드 */
.deccard.lnkcard{cursor:pointer;transition:border-color 160ms var(--ease),background 160ms var(--ease)}
.deccard.lnkcard:hover{background:var(--card);border-left-color:var(--accent-ink)}
.deccard.lnkcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.deccard.lnkcard .decq::after{content:" ↗";color:var(--muted-2);font-size:.85em}
.dechead{font-size:calc(11px * var(--fs) * var(--fs-sum-label,1));font-weight:700;padding:2px 8px;border-radius:5px;background:var(--accent-bg);
  color:var(--accent-ink);flex-shrink:0}
.decq{font-size:calc(14px * var(--fs) * var(--fs-sum-label,1));color:var(--ink);line-height:1.6}
.decc{font-size:calc(13px * var(--fs) * var(--fs-sum-label,1));color:var(--add)}
.filepill{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-sum-label,1));color:var(--muted)}
.tag{font-size:calc(11px * var(--fs) * var(--fs-sum-label,1));font-weight:700;padding:2px 8px;border-radius:5px;flex-shrink:0}
.tag.new{background:#1f3a2a;color:var(--add)}
.tag.mod{background:#1f2f4a;color:var(--mod)}
.tag.del{background:#3a1e1e;color:var(--del)}

/* ══ 5. 구조 탭 ══ */
.tree{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:calc(13.5px * var(--fs) * var(--fs-code,1))}
.tree .d{padding:7px 10px;color:var(--ink-2)}
.tree .f{padding:7px 10px 7px 30px;color:var(--muted);border-radius:7px}
.tree .f.hot{background:rgba(255,95,168,.1);color:var(--accent)}
.tree .add{color:var(--add);font-size:calc(12px * var(--fs) * var(--fs-code,1))}
.tree .del{color:var(--del);font-size:calc(12px * var(--fs) * var(--fs-code,1))}
.pill{font-size:calc(11px * var(--fs) * var(--fs-sum-label,1));padding:1px 7px;border-radius:20px}
.pill.mod{background:#1f2f4a;color:var(--mod)}
.pill.new{background:#1f3a2a;color:var(--add)}
.pill.del{background:#3a1e1e;color:var(--del)}

/* ══ 6. 변경 탭 ══ */
.chg{display:flex;flex-direction:column;gap:12px;width:100%;max-width:var(--content-max)}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:calc(12px * var(--fs) * var(--fs-sum-label,1));padding:4px 10px;border-radius:20px}
.chip.new{background:#1f3a2a;color:var(--add)}
.chip.mod{background:#1f2f4a;color:var(--mod)}
.chip.del{background:#3a1e1e;color:var(--del)}
.ghostbtn{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-sum-label,1));color:var(--muted);padding:4px 9px;border-radius:6px;
  border:1px solid var(--line);transition:transform 160ms var(--ease),color 160ms ease}
.ghostbtn:active{transform:scale(0.97)}
.fblock{border:1px solid var(--line);border-radius:12px;background:var(--block);overflow:hidden}
.fhead{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;transition:background 160ms ease;
  width:100%;text-align:left}
.fhead .chev{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-code,1));color:var(--muted);width:10px;flex-shrink:0}
.fhead .p{font-family:var(--mono);font-size:calc(13px * var(--fs) * var(--fs-code,1));color:var(--ink);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .p.gone{color:var(--muted);text-decoration:line-through}
.fhead .n{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-code,1));flex-shrink:0}
.copybtn{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-code,1));color:var(--muted-2);flex-shrink:0;transition:color 160ms ease}
.fbody{border-top:1px solid var(--line);background:var(--code-bg);font-family:var(--mono);font-size:12;
  line-height:1.9;padding:8px 0;overflow-x:auto}
.fbody .l{padding:0 14px;white-space:pre;font-size:calc(12.5px * var(--fs) * var(--fs-code,1))}
.fbody .l.a{color:var(--add);background:rgba(143,224,171,.07)}
.fbody .l.d{color:var(--del);background:rgba(239,125,125,.07)}
.fbody .l.c{color:var(--muted-2)}
.clipnote{padding:6px 14px;font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-code,1));color:var(--muted-2)}

/* ══ 7. 대화 탭 ══ */
.chat{display:flex;flex-direction:column;gap:15px;width:100%;max-width:var(--content-max)}
.unit{display:flex;flex-direction:column;gap:9px}
.sysnote{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:9px;background:#1a1a20;
  border:1px solid var(--line)}
.sysnote .k{font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-chat-sys,1));font-weight:800;color:var(--sys);letter-spacing:.06em;
  flex-shrink:0;padding-top:2px}
.sysnote .t{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-sys,1));color:var(--muted);line-height:1.65;flex:1;min-width:0}
.sysnote .x{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-sys,1));color:var(--muted-2);flex-shrink:0;cursor:pointer}
.sysbody{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-sys,1));color:var(--muted);white-space:pre-wrap;word-break:break-word;
  max-height:340px;overflow:auto;padding:8px 12px;background:var(--code-bg);border-radius:8px}
.umsg{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta .anchor{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-meta,1));color:var(--muted-2)}
.meta .lnk{cursor:pointer;transition:color 160ms ease}
.meta .time{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-meta,1));color:var(--muted)}
.meta .who{font-size:calc(12.5px * var(--fs) * var(--fs-chat-name,1));font-weight:700;color:var(--ink-2)}
.meta .tok{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-meta,1));color:var(--muted-2)}
.ubub{max-width:min(84%,720px);padding:11px 14px;border-radius:12px 2px 12px 12px;background:#1d2740;border:1px solid #2c3a5c;
  font-size:calc(14.5px * var(--fs) * var(--fs-chat-user,1));color:var(--ink);line-height:1.65;text-wrap:pretty;word-break:break-word}
.ubub.clamp{max-height:16em;overflow:hidden}
.moreline{align-self:flex-end;font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-meta,1));color:var(--accent);cursor:pointer}
.amsg{display:flex;flex-direction:column;gap:9px}
/* 턴 = 사용자 발화 1회에 대한 Claude의 연속 응답 묶음. 헤더는 맨 위 한 번만. */
.turn{display:flex;flex-direction:column;gap:10px}
/* 턴 헤더는 본문과 같이 흘러간다.
   예전엔 상단에 고정(sticky)했는데, 읽는 내내 따라다니는 게 거슬리는 데다
   배경이 반투명이라 밑을 지나는 본문이 비쳐 겹쳐 보였다. */
.turnhead{padding:2px 0 6px}
.turnbody{display:flex;flex-direction:column;gap:11px;padding-left:27px;
  border-left:1px solid var(--line-soft);margin-left:9px}
.turnbody > .abody{margin:0}
.cicon{width:19px;height:19px;flex-shrink:0;display:block}
.aname{font-size:calc(12.5px * var(--fs) * var(--fs-chat-name,1));font-weight:700;color:var(--accent)}
.abody{font-size:calc(14.5px * var(--fs) * var(--fs-chat-body,1));color:var(--ink-3);line-height:1.7;text-wrap:pretty;word-break:break-word;max-width:68em}
.abody p{margin:.5em 0}
.abody ul,.abody ol{margin:.5em 0;padding-left:1.3em}
.abody h1,.abody h2,.abody h3{font-size:calc(16px * var(--fs) * var(--fs-chat-body,1));margin:.8em 0 .3em;color:var(--ink)}
.abody pre{background:var(--code-bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;overflow:auto}
.abody pre code{background:none;padding:0;color:#9AEDFE;font-size:calc(13px * var(--fs) * var(--fs-chat-body,1))}
.abody table{border-collapse:collapse;font-size:calc(13.5px * var(--fs) * var(--fs-chat-body,1))}
.abody td,.abody th{border:1px solid var(--line);padding:4px 8px}
.think{border:1px solid var(--line);border-radius:9px;background:var(--block);padding:8px 12px;
  font-size:calc(13px * var(--fs) * var(--fs-chat-body,1));color:var(--muted)}
.think .t{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-body,1));color:var(--muted-2);cursor:pointer}
.tgroup{border:1px solid rgba(255,255,255,.06);border-radius:12px;background:#131317;overflow:hidden}
.thead{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;transition:background 160ms ease;
  width:100%;text-align:left}
.thead .chev{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-tool,1));color:var(--muted);flex-shrink:0}
.thead .cnt{font-size:calc(13px * var(--fs) * var(--fs-chat-tool,1));font-weight:700;color:var(--ink-2);flex-shrink:0}
.thead .sum{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-chat-tool,1));color:var(--muted);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thead .badge{font-size:calc(11px * var(--fs) * var(--fs-chat-tool,1));padding:2px 8px;border-radius:20px;background:#18331f;color:var(--done);flex-shrink:0}
.thead .badge.err{background:#3a1e1e;color:var(--del)}
.thead .dur{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-tool,1));color:var(--muted-2);flex-shrink:0}
.tbody{border-top:1px solid var(--line)}
.titem{padding:9px 13px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.titem:last-child{border-bottom:0}
.titem .l{display:flex;align-items:center;gap:9px}
.titem .nm{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-chat-tool,1));flex-shrink:0}
.titem .ar{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-chat-tool,1));color:var(--muted);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .ok{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-chat-tool,1));color:var(--done);flex-shrink:0}
.titem .ok.err{color:var(--del)}
.tdetail{margin-top:8px;background:var(--code-bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-chat-tool,1));color:var(--muted);white-space:pre-wrap;word-break:break-word;
  max-height:420px;overflow:auto}
.switchmark{display:flex;align-items:center;gap:11px}
.switchmark .ln{flex:1;height:1px;background:var(--line)}
.switchmark .c{display:flex;align-items:center;gap:8px;padding:4px 11px;border-radius:20px;background:#1a1a20;
  border:1px solid var(--line);flex-shrink:0}
.switchmark .c .mm{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-chat-model,1))}
.switchmark .c .ar{font-family:var(--mono);font-size:calc(11px * var(--fs) * var(--fs-chat-model,1));color:var(--muted-2)}
.switchmark .c .lb{font-size:calc(12px * var(--fs) * var(--fs-chat-meta,1));color:var(--muted)}
.askbox{border:1px solid var(--line);border-radius:12px;background:#131317;padding:11px 13px;
  display:flex;flex-direction:column;gap:8px}
.askq{font-size:calc(14px * var(--fs) * var(--fs-chat-ask,1));color:var(--ink);line-height:1.6}
.askopt{font-size:calc(13px * var(--fs) * var(--fs-chat-ask,1));color:var(--muted);padding-left:14px}
.askopt.on{color:var(--add)}
.hl{background:var(--accent-bg);color:var(--accent-ink);border-radius:3px}
.hl.cur{background:var(--accent);color:#2c1a26}

/* ══ 8. 플로팅 새 활동 ══ */
.newbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px;
  background:linear-gradient(180deg,rgba(21,21,26,0),rgba(21,21,26,.92) 55%);pointer-events:none}
.newbar[hidden]{display:none}  /* 클래스의 display:flex가 [hidden] 기본값을 덮으므로 명시 */
.newpill{display:flex;align-items:center;gap:9px;padding:7px 14px;border-radius:20px;background:var(--accent-bg);
  border:1px solid rgba(255,95,168,.34);box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:auto;
  transition:transform 160ms var(--ease)}
.newpill:active{transform:scale(0.97)}
.newpill i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.newpill .t{font-size:calc(13px * var(--fs) * var(--fs-ui,1));font-weight:600;color:var(--accent-ink)}
.newpill .s{font-family:var(--mono);font-size:calc(12px * var(--fs) * var(--fs-ui,1));color:var(--muted)}

/* ══ 빈/에러 상태 ══ */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:40px 46px;text-align:center}
.empty .ic{width:52px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:calc(21px * var(--fs) * var(--fs-ui,1));color:var(--muted-2)}
.empty .h{font-size:calc(20px * var(--fs) * var(--fs-ui,1));font-weight:700;color:var(--ink);letter-spacing:-.01em}
.empty .d{font-size:calc(14.5px * var(--fs) * var(--fs-ui,1));color:var(--muted);line-height:1.75;text-wrap:pretty;max-width:460px}
.empty .d .m{font-family:var(--mono);font-size:calc(13px * var(--fs) * var(--fs-ui,1));color:var(--ink-2)}
.empty .acts{display:flex;gap:9px;padding-top:4px}
.btn-primary{font-family:var(--mono);padding:8px 14px;border-radius:8px;background:var(--accent);color:#2c1a26;
  font-size:calc(13px * var(--fs) * var(--fs-ui,1));font-weight:700;transition:transform 160ms var(--ease)}
.btn-primary:active{transform:scale(0.97)}
.btn-sec{font-family:var(--mono);padding:8px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);font-size:calc(13px * var(--fs) * var(--fs-ui,1));transition:transform 160ms var(--ease)}
.btn-sec:active{transform:scale(0.97)}
.ssenote{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 12px;border-radius:8px;
  background:#1a1a20;border:1px solid var(--line)}
.ssenote .k{font-family:var(--mono);font-size:calc(10.5px * var(--fs) * var(--fs-ui,1));font-weight:800;color:var(--sys)}
.ssenote .t{font-family:var(--mono);font-size:calc(11.5px * var(--fs) * var(--fs-ui,1));color:var(--muted)}

/* 하단 모바일 탭바 (데스크탑에선 숨김) */
.mobtabs{display:none}

@media (hover:hover) and (pointer:fine){
  .tabgroup button:hover{color:var(--ink)}
  .railbtn:hover{background:var(--line);color:var(--ink)}
  .projsel:hover{background:#22222a}
  .dgroup:hover{background:var(--bg)}
  .srow:hover{background:#191920}
  .railfoot:hover{background:#191920}
  .renamebtn:hover{color:var(--ink);background:var(--line)}
  .fhead:hover{background:var(--card)}
  .thead:hover{background:#191920}
  .ghostbtn:hover{color:var(--ink)}
  .copybtn:hover{color:var(--ink)}
  .navhit:hover{color:var(--ink)}
  .aibtn:hover{color:var(--ink)}
  .meta .lnk:hover{color:var(--accent)}
  .modal .iconbtn:hover{background:var(--line);color:var(--ink)}
}

/* ══ 반응형 ══ */
@media (max-width:1300px){ .rail{width:48px;align-items:center;padding:13px 0;gap:8px}
  .rail .rail-head,.rail .raillist,.rail .railfoot,.rail .statusline{display:none}
  .rail .railmini{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;width:100%} }
@media (max-width:820px){
  body{overflow:auto}
  .hero{padding:12px 14px 11px;gap:10px;flex-wrap:wrap}
  /* 지표는 줄바꿈으로 흘린다 — 가로 스크롤로 두면 Export가 화면 밖에서 잘린다 */
  .hero-r{gap:10px 14px;width:100%;flex-wrap:wrap;align-items:flex-end}
  .hero-r .vr{display:none}
  .metric{align-items:flex-start}
  .metric .num{font-size:calc(17px * var(--fs) * var(--fs-hero,1))}
  .metric .lab{font-size:calc(10.5px * var(--fs) * var(--fs-hero,1))}
  .btn-export{margin-left:auto}
  .hero-title{font-size:calc(16px * var(--fs) * var(--fs-hero,1))}
  .rail{display:none}
  .tabbar{padding:0 12px;gap:8px}
  .tabgroup{display:none}
  .keep .lab{font-size:calc(11.5px * var(--fs) * var(--fs-ui,1))}
  .searchbox{max-width:none}
  .scroller{padding:16px 14px 96px}
  .grid2{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr}
  .mobtabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--line);
    background:var(--panel);padding:10px 0 22px}
  .mobtabs button{flex:1;text-align:center;font-size:calc(12px * var(--fs) * var(--fs-ui,1));font-weight:600;color:var(--muted)}
  .mobtabs button.on{color:var(--accent);font-weight:700}
  .newbar{bottom:64px}
}
/* 모바일 헤더 한 줄 유지 — 로고는 절대 줄바꿈/축소되지 않는다 */
.hero-brand{display:none}
@media (max-width:820px){
  .hero-brand{display:flex;align-items:center;gap:9px;width:100%;overflow:hidden}
  .hero-brand .lg{font-size:calc(16px * var(--fs) * var(--fs-hero,1));flex-shrink:0}
  .hero-brand .nm{font-family:var(--mono);font-size:calc(13.5px * var(--fs) * var(--fs-hero,1));font-weight:600;color:var(--ink);
    white-space:nowrap;flex-shrink:0}
  .hero-brand .sn{font-family:var(--mono);font-size:calc(12.5px * var(--fs) * var(--fs-hero,1));color:var(--sess);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hero-title,.hero-path{display:none}
}
</style>
</head>
<body>

<div class="hero" id="hero">
  <div class="hero-brand">
    <span class="lg">🦞</span><span class="nm">claude-watch</span>
    <span class="livedot pulse" id="mdot"></span>
    <span class="sn" id="mname"></span>
  </div>
  <div class="hero-l">
    <div class="hero-status">
      <span class="livedot pulse" id="dot"></span>
      <span class="statustext" id="stat">연결 중…</span>
      <span id="curmodel"></span>
      <span class="plusmodels" id="plusmodels"></span>
    </div>
    <div class="hero-title" id="htitle">세션을 불러오는 중…</div>
    <div class="hero-path" id="hpath"></div>
  </div>
  <div class="hero-r" id="metrics"></div>
</div>


<div class="shell">
  <div class="rail" id="rail">
    <div class="rail-head">
      <div class="row1">
        <div class="rail-lab">프로젝트 폴더</div>
        <div class="spacer"></div>
        <button class="railbtn" id="railtoggle" title="목록 접기">‹‹</button>
      </div>
      <button class="projsel" id="projsel">
        <span class="dot"></span>
        <span class="projpath"><span class="par" id="ppar"></span><span class="leaf" id="pleaf"></span></span>
        <span class="cnt" id="pcnt"></span><span class="car">▾</span>
      </button>
    </div>
    <div class="raillist" id="raillist"></div>
    <div class="archnote" id="archnote" hidden></div>
    <button class="railfoot" id="railfoot"><span class="l"></span><span class="r"></span></button>
    <div class="statusline">
      <div class="lab">터미널 STATUSLINE</div>
      <div class="body" id="slpreview"></div>
    </div>
    <div class="railmini" id="railmini"></div>
  </div>

  <div class="mainwrap">
    <div class="tabbar">
      <div class="tabgroup" id="tabs"></div>
      <div class="searchbox">

<script>
const SESSION = "__SESSION_ID__";
// export(도시락) 모드: <script type=application/json>에서 데이터를 읽음(SSE 없음)

const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const $ = (id) => document.getElementById(id);
const view = $("view"), scroller = $("scroller");

/* ── 상태 ─────────────────────────────────────────────── */

let AGG = EXPORT ? EXPORT.agg : null;
let USAGE = EXPORT ? EXPORT.usage : null;
let SESS = EXPORT ? EXPORT.session : null;
let INDEX = [];                       // 레일용 세션 색인
let NOTFOUND = false;

const store = {
  get(k, d) { try { const v = localStorage.getItem("cw:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cw:" + k, JSON.stringify(v)); } catch {} },
};
const TAB_IDS = ["summary", "arch", "changes", "raw"];
let TAB = (() => {
  const t = new URLSearchParams(location.search).get("tab");

})();
let railOpen = store.get("railOpen", true);
let keepExpanded = store.get("keepExpanded", true);
const groupOpen = store.get("groupOpen", {});     // 레일 날짜 그룹
const fileOpen = {};                              // 변경 탭 파일 블록
const openState = {};                             // 도구 그룹/시스템 노트 펼침
// Tweaks — 값은 localStorage 에 남아 다음 방문에도 유지된다
const FS_STEPS = [0.9, 1, 1.1, 1.2, 1.35, 1.5];
// 글자 크기를 조절할 수 있는 화면 요소들.
//  base = 기본 px(배율 1일 때). 패널에서 "14.5 → 16px" 처럼 결과를 보여주는 데 쓴다.
const ROLES = [
  ["대화", [
    ["chat-name",  "Claude · 나 이름표", 12.5],
    ["chat-model", "모델 칩",            11],

    ["chat-sys",   "SYS · 스킬 노트",     11.5],
    ["chat-tool",  "도구 그룹",           13],
    ["chat-agent", "서브에이전트 행",      13],
    ["chat-ask",   "질문 · 선택지",        14],
  ]],
  ["요약 · 변경", [
    ["sum-head",   "한 줄 결론",          22],
    ["sum-bullet", "불릿",               15],
    ["sum-label",  "라벨 · 표 · 태그",     12],

  ]],
  ["화면 틀", [
    ["hero",       "상단 히어로",          20],
    ["rail",       "좌측 세션 목록",        13],

  ]],
];
const ROLE_STEPS = [0.8, 0.9, 1, 1.1, 1.25, 1.4, 1.6];
// 기본 배율 — 직접 맞춘 값을 그대로 기본으로 쓴다(다른 브라우저·다른 기기에서도 같은 크기).
// 배율 1 인 것(모델 칩·시각·SYS·도구 그룹·서브에이전트)은 적지 않는다.
const DEFAULT_ROLES = {
  "chat-name": 1.25, "chat-body": 1.1, "chat-user": 1.1, "chat-ask": 1.1,
  "sum-head": 1.25, "sum-bullet": 1.1, "sum-label": 1.1, "code": 0.9,
