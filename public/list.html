<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-watch · 세션 목록</title>
<style>
  /* 뷰어와 같은 로컬 폰트 — 외부 CDN 을 쓰지 않는다(오프라인에서도 같은 화면) */
  @font-face { font-family:'JetBrains Mono'; src:url('/vendor/jetbrains-mono.woff2') format('woff2'); font-weight:100 800; font-display:swap; }
  :root{color-scheme:dark;scrollbar-color:#2c2c35 transparent;scrollbar-width:thin}
  :root { --bg:#15151a; --card:#1e1e24; --line:#2c2c35; --muted:#8b8b96; --ink:#e7e7ec; --accent:#ff5fa8;
    --sess:#f4f89d; --live:#2bbf6a; --add:#8fe0ab; --del:#ef7d7d;
    --opus:#e0a458; --sonnet:#9cc0ef; --haiku:#8fe0ab; --fable:#c9a6ff; --other:#8b8b96;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 var(--mono); }
  header { position:sticky; top:0; z-index:5; background:rgba(21,21,26,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:12px 20px; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:700; }
  .spacer { flex:1; }
  .sortbtns button, .ghost { background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; }
  .sortbtns button.on, .ghost.on { color:var(--accent); border-color:var(--accent); }
  input.search { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; min-width:240px; }
  main { max-width:980px; margin:0 auto; padding:20px; }
  .proj { margin:18px 0; }
  .proj > summary { cursor:pointer; list-style:none; font-weight:700; font-size:14px; color:var(--accent); padding:6px 0; display:flex; align-items:center; gap:8px; }
  .proj > summary::-webkit-details-marker { display:none; }
  .proj > summary::before { content:"▸"; color:var(--muted); transition:transform .15s; }
  .proj[open] > summary::before { transform:rotate(90deg); }
  .proj .count { color:var(--muted); font-weight:400; font-size:12px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 12px; margin:6px 0; background:var(--card);
    border:1px solid var(--line); border-radius:10px; }
  .row:hover { border-color:#3a3a44; }
  .rmain { flex:1; min-width:0; }
  .rtitle { font-weight:600; font-size:13.5px; cursor:text; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rtitle:hover { color:var(--accent); }
  .rmeta { color:var(--muted); font-size:11.5px; margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
  .rmeta .chip b { color:var(--ink); }
  .ract { display:flex; gap:6px; }
  .ract button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:7px; padding:5px 9px; font:inherit; font-size:12px; cursor:pointer; }
  .ract button:hover { border-color:var(--accent); color:var(--accent); }
  .ract button.resume:hover { border-color:var(--sess); color:var(--sess); }
  .ract button[disabled] { opacity:.4; cursor:default; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  .livedot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--live); margin-right:7px; vertical-align:1px;
    box-shadow:0 0 0 0 rgba(43,191,106,.6); animation:pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 6px rgba(43,191,106,0); } 100% { box-shadow:0 0 0 0 rgba(43,191,106,0); } }
  .badge { font-size:10.5px; padding:1px 6px; border-radius:5px; border:1px solid var(--line); color:var(--muted); margin-left:7px; font-weight:400; }
  .toast { position:fixed; top:16vh; left:50%; transform:translateX(-50%); z-index:90; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:10px 16px; font-size:13px; box-shadow:0 12px 32px rgba(0,0,0,.5); opacity:0; transition:opacity .2s; pointer-events:none; max-width:80vw; }
  .toast.on { opacity:1; }
  .modal { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); padding:24px; }
  .sheet { width:100%; max-width:520px; display:flex; flex-direction:column; gap:9px; padding:22px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .sheet .sh { font-size:17px; font-weight:700; }
  .sheet .sd { font-size:12.5px; color:var(--muted); line-height:1.6; }
  .sheet .cmd { padding:9px 11px; border-radius:8px; background:var(--bg); border:1px solid var(--line); font-size:12.5px; word-break:break-all; }
  .sheet .acts { display:flex; justify-content:flex-end; gap:9px; margin-top:10px; flex-wrap:wrap; }
  .sheet .acts button { font:inherit; font-size:13px; padding:8px 14px; border-radius:8px; background:var(--card); border:1px solid var(--line); color:var(--ink); cursor:pointer; }
  .sheet .acts button.primary { background:var(--accent); border-color:var(--accent); color:#2c1a26; font-weight:600; }
  @media (max-width:640px) { .row { flex-direction:column; align-items:stretch; } .ract { justify-content:flex-end; } input.search { min-width:0; flex:1; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🦞 claude-watch · 세션 목록</h1>
    <span class="spacer"></span>
    <input class="search" id="search" placeholder="제목·프로젝트·의사결정 검색…" />
    <span class="sortbtns">
      <button id="sortCreated" class="on">시작순</button>
      <button id="sortUpdated">최근작업순</button>
    </span>
    <button id="toggleAll" class="ghost" title="앱·SDK 자동 세션 포함 여부">전체 보기</button>
  </div>
</header>
<main id="view"><div class="empty">불러오는 중…</div></main>

<script>
let DATA = [];
let SORT = "created"; // created | updated
let SHOW_ALL = false; // false=사람(cli) 세션만, true=앱/SDK 자동까지
const view = document.getElementById("view");
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function rel(ms) {
  if (!ms) return "";
  let s = (Date.now() - ms) / 1000;
  if (s < 60) return "방금";
  const m = s/60; if (m < 60) return Math.floor(m) + "분 전";
  const h = m/60; if (h < 24) return Math.floor(h) + "시간 전";
  const d = h/24; if (d < 7) return Math.floor(d) + "일 전";
  const t = new Date(ms); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}
function dur(ms) {
  if (!ms) return "";
  let s = ms/1000; const d = Math.floor(s/86400); s -= d*86400; const h = Math.floor(s/3600); s -= h*3600; const m = Math.floor(s/60);
  return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${m}분`;
}
function kfmt(n) { n = Number(n||0); return n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"K":String(n); }
// 5분 내 활동 = 진행 중(뷰어의 isLive 와 같은 기준)
const isLive = (x) => x.lastTs && (Date.now() - new Date(x.lastTs).getTime()) < 5*60*1000;
function flash(msg) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.classList.add("on");
  clearTimeout(flash.t); flash.t = setTimeout(() => el.classList.remove("on"), 2600);
}
const sortKey = (x) => SORT === "updated" ? (x.updatedAt||0) : (x.createdAt||0);

function matches(x, q) {
  if (!q) return true;
  q = q.toLowerCase();
  const hay = [x.title, x.project, x.firstPrompt, ...(x.decisions||[]).flatMap(d => [d.h, d.q, d.c])].join(" ").toLowerCase();
  return hay.includes(q);
}

function render() {
  const q = document.getElementById("search").value.trim();
  const items = DATA.filter(x => (SHOW_ALL || x.interactive) && matches(x, q));
  if (!items.length) { view.innerHTML = `<div class="empty">${DATA.length ? "검색 결과 없음" : "세션이 없습니다"}</div>`; return; }
  // 프로젝트별 그룹
  const groups = {};
  for (const x of items) (groups[x.project] ??= []).push(x);
  // 그룹 정렬: 그룹 내 최신 키 기준 desc
  const projOrder = Object.keys(groups).sort((a,b) => Math.max(...groups[b].map(sortKey)) - Math.max(...groups[a].map(sortKey)));
  view.innerHTML = projOrder.map(proj => {
    const rows = groups[proj].sort((a,b) => sortKey(b) - sortKey(a));
    return `<details class="proj" open>
      <summary>${esc(proj)} <span class="count">${rows.length}개</span></summary>
      ${rows.map(rowHtml).join("")}
    </details>`;
  }).join("");
  bindRows();
}

function rowHtml(x) {
  const s = x.stats || {};
  const meta = [
    `<span class="chip">${rel(SORT==="updated"?x.updatedAt:x.createdAt)}</span>`,
    s.durationMs ? `<span class="chip">⏱ ${dur(s.durationMs)}</span>` : "",
    s.decisions ? `<span class="chip">⚖ <b>${s.decisions}</b></span>` : "",
    s.files ? `<span class="chip">📝 <b>${s.files}</b></span>` : "",
    s.commits ? `<span class="chip">✅ <b>${s.commits}</b></span>` : "",
    s.turns ? `<span class="chip">💬 <b>${s.turns}</b></span>` : "",
    s.tokens ? `<span class="chip">${kfmt(s.tokens)} tok${s.cost ? ` · $${Number(s.cost).toFixed(2)}` : ""}</span>` : "",
    s.model ? `<span class="chip" style="color:var(--${s.family || "other"})">${esc(s.model)}</span>` : "",
  ].filter(Boolean).join("");
  // 원본이 지워져 보관본만 남은 세션은 읽을 수는 있지만 claude --resume 으로 이어갈 수 없다.
  const badge = x.archived ? `<span class="badge" title="원본 로그가 삭제되어 보관본으로만 남은 세션">보관본</span>` : "";
  return `<div class="row" data-id="${x.id}">
    <div class="rmain">
      <div class="rtitle" data-title="${esc(x.title)}" title="클릭하여 제목 수정">${isLive(x) ? `<span class="livedot" title="진행 중"></span>` : ""}${esc(x.title)}${badge}</div>
      <div class="rmeta">${meta}</div>
    </div>
    <div class="ract">
      <button data-act="open">열기</button>
      <button data-act="resume" class="resume" ${x.archived ? "disabled title=\"원본이 삭제되어 이어갈 수 없어요\"" : ""}>이어하기</button>
      <button data-act="export">내보내기</button>
    </div>
  </div>`;
}

function bindRows() {
  view.querySelectorAll(".row").forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-act="open"]').onclick = () => { window.location.href = `/s/${id}`; };
    row.querySelector('[data-act="resume"]').onclick = () => openResume(DATA.find(x => x.id === id));
    // 예전엔 아이콘(📦)만 있는 버튼이 확인 없이 기본 폴더에 바로 저장했다. 뷰어의 내보내기 창으로 보낸다.
    row.querySelector('[data-act="export"]').onclick = () => { window.location.href = `/s/${id}?export=1`; };
    const t = row.querySelector(".rtitle");
    t.onclick = async () => {
      const cur = t.dataset.title;
      const next = prompt("세션 제목 수정 (비우면 자동 제목으로 복귀)", cur);
      if (next === null || next === cur) return;
      await fetch(`/api/rename/${id}?title=${encodeURIComponent(next)}`);
      const item = DATA.find(x => x.id === id);
      if (item) { item.alias = next; item.title = next || item.aiTitle || item.firstPrompt || id.slice(0,8); }
      render();
    };
  });
}

// 목록에서 바로 이어하기 — 세션을 "찾는" 곳이 여기라서, 찾고 나서 뷰어를 거치지 않게 한다.
// 뷰어의 이어하기 팝업과 같은 동작: 명령어 복사 또는 터미널 새 탭에서 실행.
const shq = (s) => `'` + String(s).replace(/'/g, `'\\''`) + `'`;
async function openResume(x) {
  if (!x) return;
  document.getElementById("resumedlg")?.remove();
  // stale: 서버가 이 기능 이전 버전으로 떠 있는 경우(404). 버튼을 조용히 숨기지 않고 이유를 알린다.
  let app = null, stale = false;
  try { const r = await fetch("/api/resume-terminal"); if (r.ok) app = (await r.json()).app; else stale = true; } catch {}
  const cmd = (x.cwd ? `cd ${shq(x.cwd)} && ` : "") + `claude --resume ${x.id}`;
  const dlg = document.createElement("div");
  dlg.id = "resumedlg"; dlg.className = "modal";
  dlg.innerHTML = `<div class="sheet">
    <div class="sh">세션 이어하기</div>
    <div class="sd">${esc(x.title)}</div>
    <div class="cmd">${esc(cmd)}</div>
    ${isLive(x) ? `<div class="sd" style="color:var(--del)">⚠ 이 세션은 최근 5분 안에 활동이 있었어요. 다른 터미널에서 아직 진행 중이라면, 같은 세션을 두 곳에서 열 때 대화가 꼬일 수 있어요.</div>` : ""}
    <div class="acts">
      <button id="rCancel">취소</button>
      <button id="rCopy">명령어 복사</button>
      ${app ? `<button class="primary" id="rRun">${esc(app)}에서 열기</button>` : ""}
    </div>
    <div class="sd" id="rMsg">${stale ? "터미널에서 바로 열기는 claude-watch 서버를 재시작하면 쓸 수 있어요." : ""}</div>
  </div>`;
  document.body.appendChild(dlg);
  const onKey = (e) => { if (e.key === "Escape") close(); };
  const close = () => { dlg.remove(); document.removeEventListener("keydown", onKey); };
  document.addEventListener("keydown", onKey);
  dlg.onclick = (e) => { if (e.target === dlg) close(); };
  dlg.querySelector("#rCancel").onclick = close;
  dlg.querySelector("#rCopy").onclick = () => {
    const done = () => { close(); flash("✓ 복사되었어요! 터미널에 붙여넣으면 이 세션을 이어갈 수 있어요."); };
    if (navigator.clipboard) navigator.clipboard.writeText(cmd).then(done, () => { dlg.querySelector("#rMsg").textContent = "복사 실패 — 위 명령을 직접 선택해 복사해 주세요."; });
    else dlg.querySelector("#rMsg").textContent = "위 명령을 직접 선택해 복사해 주세요.";
  };
  if (app) dlg.querySelector("#rRun").onclick = async (e) => {
    const btn = e.target; btn.disabled = true; btn.textContent = "여는 중…";
    try {
      const d = await (await fetch(`/api/resume-terminal?id=${encodeURIComponent(x.id)}`, { method: "POST" })).json();
      if (d.error) throw new Error(d.error);
      close(); flash(`✓ ${app}에서 이 세션을 열었어요.`);
    } catch (err) {
      dlg.querySelector("#rMsg").innerHTML = `<span style="color:var(--del)">열기 실패: ${esc(err.message)} — 명령어 복사를 이용해 주세요.</span>`;
      btn.disabled = false; btn.textContent = `${app}에서 열기`;
    }
  };
}

document.getElementById("search").oninput = render;
document.getElementById("toggleAll").onclick = (e) => { SHOW_ALL = !SHOW_ALL; e.target.textContent = SHOW_ALL ? "사람 세션만" : "전체 보기"; e.target.classList.toggle("on", SHOW_ALL); render(); };
document.getElementById("sortCreated").onclick = () => { SORT="created"; document.getElementById("sortCreated").classList.add("on"); document.getElementById("sortUpdated").classList.remove("on"); render(); };
document.getElementById("sortUpdated").onclick = () => { SORT="updated"; document.getElementById("sortUpdated").classList.add("on"); document.getElementById("sortCreated").classList.remove("on"); render(); };

fetch("/api/index").then(r => r.json()).then(d => { DATA = d; render(); }).catch(() => { view.innerHTML = `<div class="empty">불러오기 실패</div>`; });
</script>
</body>
</html>
